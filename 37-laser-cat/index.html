<script>
// ===== Laser Cat · free code by @sicscod.drops =====
// Try: yoursite/?fur=black&speed=1.3&dot=%2300ff88
const P = new URLSearchParams(location.search);
const FURS = {   // fur, stripes / shade, belly, eyes, inner ear, nose
  orange: { fur: "#ec8b3e", dark: "#c3622a", light: "#f8cf9c", eye: "#a6d65a", ear: "#f0a19b", nose: "#e2747c", stripes: true },
  black:  { fur: "#332c2f", dark: "#221d1f", light: "#4b4246", eye: "#f4c64a", ear: "#8a5a60", nose: "#7a5157", stripes: false },
  grey:   { fur: "#989ba6", dark: "#6e717d", light: "#d2d3d9", eye: "#f1b64c", ear: "#e8a3a7", nose: "#d98490", stripes: true },
  white:  { fur: "#f3eee5", dark: "#d8ccbb", light: "#ffffff", eye: "#71b8e8", ear: "#f2a7af", nose: "#ee8f9b", stripes: false },
};
const hex = v => v && /^#?[0-9a-f]{3,8}$/i.test(v) ? (v[0] === "#" ? v : "#" + v) : null;
const CONFIG = {
  fur: FURS[P.get("fur")] ? P.get("fur") : "orange",   // orange | black | grey | white
  speed: Math.min(2.5, Math.max(.4, +(P.get("speed") || 1))),  // how fast the cat runs (1 = normal house cat)
  dot: hex(P.get("dot")) || "#ff2d2d",                  // laser colour
  pounceRange: 175,       // px: how close the dot has to be before it crouches
  wiggle: [.5, .85],      // seconds of butt wiggle before a pounce (random in this range)
  bonkSpeed: 210,         // px/s: hitting the wall faster than this = bonk + stars
  sitAfter: .7,           // seconds the dot has to sit still on the cat before it gives up and purrs
  purr: "...prrr",
  label: "living room · 2:14 am",

const C = FURS[CONFIG.fur], INK = "#1d1412";

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const countEl = document.getElementById("count"), hintEl = document.getElementById("hint");
let W = 0, H = 0, DPR = 1, S = 1, floorY = 0, zMin = 0, zMax = 0, bg = null, vig = null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- the room (drawn once per resize, a little wobbly like ink on paper) ----------
function wob(c, pts, seed, amp = 1.2) {

  c.fillStyle = "rgba(243,234,210,.7)";

  g.addColorStop(0, "rgba(255,178,102,.30)"); g.addColorStop(.35, "rgba(255,150,80,.10)"); g.addColorStop(1, "rgba(255,150,80,0)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = INK; c.lineWidth = 3; line(c, lx, ly + 26, lx, floorY + 22, 41, 8, .6);
  c.fillStyle = "#e9b878"; wob(c, [[lx - 30, ly + 28], [lx - 19, ly - 10], [lx + 19, ly - 10], [lx + 30, ly + 28], [lx - 30, ly + 28]], 51, .8); c.fill(); c.stroke();
  c.fillStyle = "#3a2d2a"; wob(c, ellPts(lx, floorY + 24, 20, 5, 14), 61, .5); c.fill(); c.stroke();
  // baseboard + floor
  g = c.createLinearGradient(0, floorY, 0, H); g.addColorStop(0, "#43302a"); g.addColorStop(1, "#2a1e1a");
  c.fillStyle = g; c.fillRect(0, floorY, W, H - floorY);

  c.beginPath(); c.moveTo(wx, floorY + 2); c.lineTo(wx + ww, floorY + 2); c.lineTo(wx + ww * 1.7, H * .86); c.lineTo(wx + ww * .2, H * .86); c.fill();

  c.fillStyle = "#7c3f35"; c.strokeStyle = INK; c.lineWidth = 2.6; wob(c, ellPts(rx, ry, rw, rh, 34), 111, 1.4); c.fill(); c.stroke();
  c.strokeStyle = "#b9734a"; c.lineWidth = 3; wob(c, ellPts(rx, ry, rw * .78, rh * .74, 30), 121, 1.2); c.stroke();
  c.strokeStyle = "rgba(233,184,120,.55)"; c.lineWidth = 2; wob(c, ellPts(rx, ry, rw * .5, rh * .46, 26), 131, 1); c.stroke();

  c.fillStyle = "#5f7fb6"; c.strokeStyle = INK; c.lineWidth = 2.5; wob(c, ellPts(yx, yy, yr, yr, 18), 141, .7); c.fill(); c.stroke();

  for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(yx - 4 + i * 4, yy + 2, yr * (.9 - i * .2), -2.2, .4); c.stroke(); }
  c.strokeStyle = "#5f7fb6"; c.lineWidth = 2; wob(c, [[yx - yr, yy + 6], [yx - 40, yy + 14], [yx - 70, yy + 10], [yx - 96, yy + 18]], 151, 1.5); c.stroke();
  // vignette layer (goes over the cat)
  vig = document.createElement("canvas"); vig.width = W * DPR; vig.height = H * DPR;
  const v = vig.getContext("2d"); v.scale(DPR, DPR);
  g = v.createRadialGradient(W * .55, H * .55, Math.min(W, H) * .3, W * .5, H * .5, Math.max(W, H) * .78);
  g.addColorStop(0, "rgba(8,5,8,0)"); g.addColorStop(1, "rgba(8,5,8,.62)"); v.fillStyle = g; v.fillRect(0, 0, W, H);

function resize() {

  S = clamp(Math.min(W / 540, H / 600), .6, 1.35) * 1.15;
  floorY = H * .4; zMin = floorY + 62 * S; zMax = H - 66 * S;
  buildRoom();

// ---------- the laser (your finger) ----------
const dot = { on: false, x: 0, y: 0, vx: 0, vy: 0, sp: 0, still: 0, alpha: 0, used: false, px: 0, py: 0, off: 9 };
function setDot(e) { dot.x = e.clientX; dot.y = e.clientY; }
addEventListener("pointerdown", e => { setDot(e); if (!dot.on) { dot.px = dot.x; dot.py = dot.y; } dot.on = true; dot.used = true; });
addEventListener("pointermove", e => { if (e.pointerType === "mouse" && !dot.on && !e.clientX && !e.clientY) return; setDot(e); if (e.pointerType === "mouse" && !dot.on) { dot.on = true; dot.px = dot.x; dot.py = dot.y; dot.used = true; } });
addEventListener("pointerup", e => { if (e.pointerType !== "mouse") dot.on = false; });
addEventListener("pointercancel", () => dot.on = false);
document.addEventListener("pointerleave", () => dot.on = false);

// ---------- the cat ----------
let cat = null;
function newCat() {
  return { x: W * .5, z: lerp(zMin, zMax, .45), vx: 0, vz: 0, h: 0, vh: 0, face: 1, f: 1,
    mode: "idle", mt: 0, wig: 0, wigDur: .6, cool: 0, count: 0,
    c: 0, s: 1, a: 0, r: 0, b: 0, w: 0, d: 0, lid: .3, mouth: 0, ph: 0, sq: 0, sqv: 0,
    head: { x: W * .5, y: H * .5 }, look: { x: W * .6, y: H * .5 }, hr: 0, px: 0, py: 0, pu: .5,
    stars: 0, purrT: 0, offCat: 0, idleLook: 0 };

const fx = [], pops = [];      // dust puffs, "!" / "?" / purr popups
let shake = 0, bump = 0, hintA = .7;
function puff(x, y, n, spread, up, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    fx.push({ x: x + Math.cos(a) * 4, y: y + Math.sin(a) * 2, vx: Math.cos(a) * spread * (.5 + Math.random()), vy: -up * (.4 + Math.random()) + Math.sin(a) * spread * .25,
      r: size * (.6 + Math.random() * .6), t: 0, life: .45 + Math.random() * .35 });

function setMode(m) { cat.mode = m; cat.mt = 0; }

function think(dt, now) {

      fric = 9; T(0, 1, 0, 0, 0, 0);

      break;

function star(x, y, r, rot) {

// ---------- one loop for everything ----------
