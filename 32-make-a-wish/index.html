<script>
// ===== Make a Wish · free code by @sicscod.drops =====
// Send it: yoursite/?name=Delly&msg=my%20wish%20is%20always%20you&candles=5
const P = new URLSearchParams(location.search);
const CONFIG = {
  name: P.get("name") || "Delly",                       // what the smoke writes
  msg: P.get("msg") || "my wish is always you",         // the small line under it
  candles: Math.max(1, Math.min(12, +(P.get("candles") || 5) | 0)),
  frosting: [233, 196, 184],     // buttercream sides (r,g,b)
  glaze: [78, 40, 28],           // chocolate ganache on top + drips
  candle: "#efe6d6",             // candle wax
  stripe: "#c9a35a",             // the gold twist on the candles
  flame: 1,                      // flame size

  againHint: "light them again",

const $ = id => document.getElementById(id);
const cv = $("c"), X = cv.getContext("2d"), hint = $("hint"), num = $("num");

let phase = "lit", tAll = 0, tName = 0, targets = [], built = false, againAt = 0, fadeName = 0, tFade = 0;

for (let i = 0; i < CONFIG.candles; i++) cs.push({ i, state: 0, I: 1, lean: 0, lv: 0, wind: 0, tb: 0, dir: 1, ign: 1, tIgn: 0,

    for (let j = 0; j < im.data.length; j += 4) { const v = rnd() * 255; im.data[j] = im.data[j + 1] = im.data[j + 2] = v; im.data[j + 3] = 255; } s.putImageData(im, 0, 0); }

    gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.72)"); s.fillStyle = gr; s.fillRect(0, 0, W * D, H * D); }

// ---------- the still scene, fully candle-lit (the dark copy is the same scene with the lights off) ----------
function drawScene(g) {
  rs = 7; g.setTransform(D, 0, 0, D, 0, 0);
  const hz = topY - 26 * k;                                     // where the table meets the wall
  let gr = g.createLinearGradient(0, 0, 0, hz);
  gr.addColorStop(0, "#1c100c"); gr.addColorStop(.7, "#3a2319"); gr.addColorStop(1, "#4a2d20");
  g.fillStyle = gr; g.fillRect(0, 0, W, hz + 1);
  for (let i = 0; i < 7; i++) {                                 // soft folds of a curtain far behind, out of focus
    const x = (i + .3 + rnd() * .4) / 7 * W, w = (50 + rnd() * 60) * k;
    gr = g.createLinearGradient(x - w, 0, x + w, 0);

    g.fillStyle = gr; g.fillRect(x - w, 0, 2 * w, hz);

  gr = g.createLinearGradient(0, hz, 0, H);
  gr.addColorStop(0, "#5a3524"); gr.addColorStop(.35, "#4a2a1b"); gr.addColorStop(1, "#24130c");
  g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);

  const vx = cx, vy = hz - 520 * k;
  for (let i = -9; i <= 9; i++) {                               // plank seams
    const bx = cx + i * 120 * k + 30 * k;
    g.strokeStyle = "rgba(10,4,2,.55)"; g.lineWidth = 1.3 * k;
    g.beginPath(); g.moveTo(vx + (bx - vx) * ((hz - vy) / (H + 40 - vy)), hz); g.lineTo(bx, H + 40); g.stroke();
  }

    const bx = cx + (rnd() * 2 - 1) * W * 1.4, al = .03 + rnd() * .06, wob = rnd() * 6;
    g.strokeStyle = rnd() < .5 ? `rgba(20,8,3,${al})` : `rgba(255,190,140,${al * .6})`; g.lineWidth = (.6 + rnd() * 1.6) * k;
    g.beginPath();
    for (let s = 0; s <= 1.0001; s += .1) { const y = hz + (H + 40 - hz) * s * s, f = (y - vy) / (H + 40 - vy);
      const x = vx + (bx - vx) * f + Math.sin(s * 9 + wob) * 3 * k * f; s ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  gr = g.createLinearGradient(0, hz - 2, 0, hz + 24 * k); gr.addColorStop(0, "rgba(255,200,150,.18)"); gr.addColorStop(1, "rgba(255,200,150,0)");
  g.fillStyle = gr; g.fillRect(0, hz - 2, W, 26 * k);
  g.restore();

  // plate
  const prx = rx * 1.3, pry = prx * .31, py = botY + 4 * k;
  blob(g, cx, py + 16 * k, prx * 1.08, pry * 1.25, "rgba(8,3,1,.75)");
  g.fillStyle = "#8f8478"; g.beginPath(); g.ellipse(cx, py + 6 * k, prx, pry, 0, 0, 7); g.fill();
  gr = g.createRadialGradient(cx - prx * .2, py - pry * .4, 0, cx, py, prx);
  gr.addColorStop(0, "#f6efe6"); gr.addColorStop(.7, "#e3d8cb"); gr.addColorStop(1, "#bdb0a1");
  g.fillStyle = gr; g.beginPath(); g.ellipse(cx, py, prx, pry, 0, 0, 7); g.fill();
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1.2 * k; g.beginPath(); g.ellipse(cx, py, prx * .86, pry * .86, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
  g.strokeStyle = "rgba(120,100,85,.35)"; g.beginPath(); g.ellipse(cx, py + 1.5 * k, prx * .86, pry * .86, 0, .1, Math.PI - .1); g.stroke();
  blob(g, cx, botY + 2 * k, rx * 1.1, ry * 1.2, "rgba(60,30,20,.55)");

  // cake side
  const F = CONFIG.frosting, G = CONFIG.glaze;
  g.save(); g.beginPath(); g.moveTo(cx - rx, topY); g.lineTo(cx - rx, botY); g.ellipse(cx, botY, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, topY); g.ellipse(cx, topY, rx, ry, 0, 0, Math.PI, false); g.closePath();

  gr.addColorStop(0, rgb(F, .42)); gr.addColorStop(.16, rgb(F, .78)); gr.addColorStop(.42, rgb(F, 1.03)); gr.addColorStop(.72, rgb(F, .86)); gr.addColorStop(1, rgb(F, .36));
  g.fillStyle = gr; g.fill(); g.clip();

    const y = topY + rnd() * (chH + ry), a0 = rnd() * 2.6, a1 = a0 + .25 + rnd() * .7;
    g.strokeStyle = rnd() < .55 ? `rgba(255,245,240,${.05 + rnd() * .07})` : `rgba(90,40,30,${.04 + rnd() * .06})`;
    g.lineWidth = (.8 + rnd() * 2.4) * k; g.beginPath(); g.ellipse(cx, y, rx, ry, 0, a0, a1); g.stroke();
  }
  gr = g.createLinearGradient(0, botY - 20 * k, 0, botY + ry); gr.addColorStop(0, "rgba(40,15,10,0)"); gr.addColorStop(1, "rgba(40,15,10,.35)");
  g.fillStyle = gr; g.fillRect(cx - rx, botY - 20 * k, 2 * rx, ry + 20 * k);
  g.restore();

  for (let i = 0; i <= 30; i++) { const a = i / 30 * Math.PI, x = cx + Math.cos(a) * rx * .99, y = botY + Math.sin(a) * ry - 3 * k;
    bead(g, x, y, 6 * k * (.75 + .25 * Math.sin(a)), F, 1); }

  for (let i = 0; i < 26; i++) {

    const x = cx + Math.cos(a) * rx * .995, y0 = topY + Math.sin(a) * ry, L = (6 + rnd() * rnd() * 34) * k, w = (6 + rnd() * 6) * k * s;

  gr.addColorStop(0, rgb(G, 1.45)); gr.addColorStop(.55, rgb(G, 1)); gr.addColorStop(1, rgb(G, .55));
  g.fillStyle = gr; g.beginPath(); g.ellipse(cx, topY, rx, ry, 0, 0, 7); g.fill();
  g.save(); g.beginPath(); g.ellipse(cx, topY, rx, ry, 0, 0, 7); g.clip();
  blob(g, cx - rx * .1, topY - ry * .45, rx * .55, ry * .22, "rgba(255,215,205,.16)");
  g.strokeStyle = "rgba(255,210,200,.35)"; g.lineWidth = 1.4 * k; g.beginPath(); g.ellipse(cx, topY + 4 * k, rx * .97, ry * .97, 0, .35, Math.PI - .35); g.stroke();
  for (let i = 0; i < 22; i++) {                                // gold leaf flecks
    const a = rnd() * 7, r = Math.sqrt(rnd()) * .8, x = cx + Math.cos(a) * rx * r, y = topY + Math.sin(a) * ry * r, s = (1 + rnd() * 2.2) * k;
    g.fillStyle = `rgba(232,${190 + rnd() * 30 | 0},120,${.6 + rnd() * .4})`;
    g.beginPath(); g.moveTo(x - s, y); g.lineTo(x + rnd() * s, y - s * .5); g.lineTo(x + s, y + s * .2); g.lineTo(x, y + s * .5); g.fill();
  }

  const ros = []; for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2 + .13; ros.push({ x: cx + Math.cos(a) * rx * .88, y: topY + Math.sin(a) * ry * .86, kind: 0 }); }
  const items = ros.concat(cs.map(c => ({ x: c.bx, y: c.by, kind: 1, c }))).sort((a, b) => a.y - b.y);
  for (const it of items) it.kind ? drawCandle(g, it.c) : rosette(g, it.x, it.y, 11 * k * (.88 + .12 * (it.y - topY + ry) / (2 * ry)));
}
function blob(g, x, y, a, b, col) {

  g.fillStyle = "rgba(255,226,170,.55)"; g.beginPath(); g.ellipse(bx, t + .4 * k, w * .6, w * .2, 0, 0, 7); g.fill();

// ---------- flames ----------
function flamePath(x, y, h, w, lean) {
  X.beginPath();
  for (let side = -1; side <= 1; side += 2) {
    for (let j = 0; j <= 16; j++) {
      const s = side < 0 ? j / 16 : 1 - j / 16;

function drawFlame(c, t) {
  if (c.fh <= .5 * k) return;

  // vignette + grain
  X.setTransform(1, 0, 0, 1, 0, 0); X.drawImage(vig, 0, 0);
  X.globalAlpha = .045; X.globalCompositeOperation = "overlay";
  const ox = (Math.random() * 200) | 0, oy = (Math.random() * 200) | 0;
  X.fillStyle = X.createPattern(grain, "repeat"); X.translate(-ox, -oy); X.fillRect(ox, oy, W * D, H * D); X.setTransform(1, 0, 0, 1, 0, 0);
  X.globalAlpha = 1; X.globalCompositeOperation = "source-over";

  // ui
  const litN = cs.filter(c => c.state === 0).length; num.textContent = String(litN).padStart(2, "0");
  const hd = phase === "name" ? 1 - sm((now - tName) / .8) : 1;
  document.querySelector("header").style.opacity = (.35 + .65 * hd).toFixed(3);
  if (phase === "name" && now - tName > 4.6 && !hint.classList.contains("on")) { hint.classList.add("on"); hint.textContent = CONFIG.againHint; againAt = now; }
  hint.style.opacity = (phase === "lit" ? .55 + .2 * Math.sin(t * 2.2) : phase === "name" ? (hint.classList.contains("on") ? sm((now - againAt) / .8) * .8 : 0) : 0).toFixed(3);
  requestAnimationFrame(frame);
}
addEventListener("resize", layout);
layout();
if (document.fonts && document.fonts.load) document.fonts.load(nameFont(80)).then(() => { if (phase === "name") buildName(); });
requestAnimationFrame(frame);
</script>
</body>
