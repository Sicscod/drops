<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Black hole in your browser</title>
<meta name="description" content="An Interstellar-style black hole that follows your finger. Free code by @sicscod.drops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&display=swap">
<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}
.hint{position:fixed;left:0;right:0;top:18px;text-align:center;font:500 13px "Figtree",system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,220,180,.55);pointer-events:none}
.credit{position:fixed;bottom:14px;left:0;right:0;text-align:center;font:12px "Figtree",system-ui,sans-serif;color:#8a7f76;opacity:.6}
.credit a{color:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint"></div>
<div class="credit">free code by <a href="https://www.instagram.com/sicscod.drops/" target="_blank" rel="noopener">@sicscod.drops</a></div>
<script>
// ===== Black Hole · free code by @sicscod.drops =====
// Drag to move it, tap to feed it stars. Try: yoursite/?hot=%2388b4ff (blue disk)
const url = new URLSearchParams(location.search);
const CONFIG = {
  hint: url.get("hint") || "drag it · tap to feed it",
  hot: url.get("hot") || "#ffd9a0",   // inner disk colour
  cool: url.get("cool") || "#ff5a1f", // outer disk colour
  particles: 16000,                   // disk particles
  stars: 1400,                        // background stars
  size: 0.07,                         // hole radius, × screen width+height
  tilt: 0.17                          // how flat the disk looks (0..1)
};
document.getElementById("hint").textContent = CONFIG.hint;

const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, D, R, stars = [], disk = [], feed = [];
// two layers so the disk can glow: drawn once blurred, once sharp
const layer = [0, 1].map(() => document.createElement("canvas")), lg = layer.map(c => c.getContext("2d"));
const hole = { x: 0, y: 0, tx: 0, ty: 0 };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const HOT = hex(CONFIG.hot), COOL = hex(CONFIG.cool);
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k | 0);

function resize(){
  D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W*D; cv.height = H*D; g.setTransform(D, 0, 0, D, 0, 0);
  layer.forEach((c, i) => { c.width = W*D; c.height = H*D; lg[i].setTransform(D, 0, 0, D, 0, 0); });
  R = (W + H) * CONFIG.size;
  hole.x = hole.tx = W/2; hole.y = hole.ty = H*.47;
  stars = Array.from({length: CONFIG.stars}, () => ({ x: Math.random()*W, y: Math.random()*H, s: Math.random()**4*1.8 + .35, tw: Math.random()*6 }));
  disk = Array.from({length: CONFIG.particles}, () => {
    const r = R * (1.5 + Math.random()**2.2 * 3.6);
    return { r, a: Math.random()*Math.PI*2, w: 1.6 * Math.pow(R / r, 1.5), z: (Math.random() - .5) * R * .04 };
  });
}

// ---- tap = throw a handful of stars into it ----
function feedAt(x, y){
  for (let i = 0; i < 380; i++){
    const dx = x - hole.x, dy = (y - hole.y) / CONFIG.tilt;
    const j = Math.random()*Math.PI*2, q = Math.random()**.5 * 34;   // a little cloud of stars
    const ex = dx + Math.cos(j)*q, ey = dy + Math.sin(j)*q / CONFIG.tilt;
    feed.push({ r: Math.hypot(ex, ey), a: Math.atan2(ey, ex), life: 1 });
  }
}
let down = null;
cv.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, moved: false }; });
addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) down.moved = true;
  if (down.moved){ hole.tx = e.clientX; hole.ty = e.clientY; }
});
addEventListener("pointerup", e => { if (down && !down.moved) feedAt(e.clientX, e.clientY); down = null; });

let last = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000 || .016), t = now / 1000; last = now;
  hole.x += (hole.tx - hole.x) * Math.min(1, dt*5);
  hole.y += (hole.ty - hole.y) * Math.min(1, dt*5);
  g.globalCompositeOperation = "source-over"; g.fillStyle = "#000"; g.fillRect(0, 0, W, H);

  // background stars, bent around the hole (fake gravitational lensing)
  g.globalCompositeOperation = "lighter";
  for (const s of stars){
    let dx = s.x - hole.x, dy = s.y - hole.y, d = Math.hypot(dx, dy) || 1;
    const k = (d + R*R*1.6 / d) / d;
    const x = hole.x + dx*k, y = hole.y + dy*k;
    const a = (.45 + .35*Math.sin(t*2 + s.tw)) * Math.min(1, (d - R*.6) / R);
    if (a <= 0) continue;
    g.fillStyle = `rgba(210,225,255,${a})`;
    g.fillRect(x, y, s.s, s.s);
  }

  // accretion disk: back half, lensed halo, hole, front half
  const tilt = CONFIG.tilt, back = [], front = [];
  for (const p of disk){
    p.a += p.w * dt;
    (Math.sin(p.a) < 0 ? back : front).push(p);
  }
  let ctx = g;
  const dot = (p, x, y, bright) => {
    const heat = Math.min(1, (p.r / R - 1.5) / 3.6);
    const dop = .55 + .45 * -Math.cos(p.a);               // approaching side glows brighter
    const c = mix(HOT, COOL, heat);
    const al = (1 - heat*.75) * dop * bright * .55;
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${al})`;
    const s = .9 + (1 - heat) * .9;
    ctx.fillRect(x, y, s, s);
  };
  for (const c of lg){ c.globalCompositeOperation = "source-over"; c.clearRect(0, 0, W, H); c.globalCompositeOperation = "lighter"; }
  ctx = lg[0];
  for (const p of back) dot(p, hole.x + Math.cos(p.a)*p.r, hole.y + Math.sin(p.a)*p.r*tilt + p.z, 1);
  // light from the far side of the disk bends over the top and under the bottom of the hole
  for (let i = 0; i < back.length; i += 2){
    const p = back[i], rr = R*1.06 + (p.r - R*1.5) * .16;
    dot(p, hole.x + Math.cos(p.a)*rr, hole.y + Math.sin(p.a)*rr, .9);
    if (i % 4 === 0) dot(p, hole.x + Math.cos(p.a)*rr*.97, hole.y - Math.sin(p.a)*rr*.97, .45);
  }
  const glow = c => { g.globalCompositeOperation = "lighter"; g.setTransform(1, 0, 0, 1, 0, 0);
    g.filter = `blur(${7*D}px)`; g.drawImage(c, 0, 0); g.filter = "none"; g.drawImage(c, 0, 0); g.setTransform(D, 0, 0, D, 0, 0); };
  glow(layer[0]);
  // photon ring + the hole itself
  g.globalCompositeOperation = "source-over";
  const ring = g.createRadialGradient(hole.x, hole.y, R*.92, hole.x, hole.y, R*1.35);
  ring.addColorStop(0, "rgba(0,0,0,1)"); ring.addColorStop(.1, `rgba(${HOT.join(",")},.85)`);
  ring.addColorStop(.22, `rgba(${COOL.join(",")},.18)`); ring.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = ring; g.beginPath(); g.arc(hole.x, hole.y, R*1.35, 0, 7); g.fill();
  g.fillStyle = "#000"; g.beginPath(); g.arc(hole.x, hole.y, R*.97, 0, 7); g.fill();
  ctx = lg[1];
  for (const p of front) dot(p, hole.x + Math.cos(p.a)*p.r, hole.y + Math.sin(p.a)*p.r*tilt + p.z, 1.15);
  // fed stars spiral in and vanish
  feed = feed.filter(f => {
    f.r -= (f.r * .9 + R*.6) * dt; f.a += 2.4 * Math.pow(R / Math.max(f.r, R), 1.2) * dt * 3;
    if (f.r < R*.98) return false;
    const x = hole.x + Math.cos(f.a)*f.r, y = hole.y + Math.sin(f.a)*f.r*tilt;
    ctx.fillStyle = `rgba(${HOT.join(",")},.75)`; ctx.fillRect(x, y, 1.6, 1.6);
    return true;
  });
  glow(layer[1]);
  g.globalCompositeOperation = "lighter";

  requestAnimationFrame(frame);
}
addEventListener("resize", resize);
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
