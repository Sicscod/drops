<script>
// ===== Love Lock · free code by @sicscod.drops =====
// Send it: yoursite/?name=Delly&me=you&code=142&msg=for%20as%20long%20as%20this%20bridge%20stands
const P = new URLSearchParams(location.search);
const CONFIG = {
  name: P.get("name") || "Delly",                 // engraved on the lock
  me: P.get("me") || "you",                       // "you + Delly"
  code: P.get("code") || "142",                   // your date as 2-5 digits (1-4-2 → 142), also engraved
  msg: P.get("msg") || "for as long as this bridge stands",   // small line under the ending
  line: "locked. no take-backs.",                 // the ending
  hint: "drag the dials to our date",
  label: ["the bridge", "19:42"],                 // tiny corner labels
  sun: 0.3,          // where the sun goes down, 0 = left … 1 = right
  locks: ["A+M", "J ♥ K", "", "2016", "L & S", "", "forever", "N+T", "", "♥", "M·D", "", "E+O", "", "always"],  // marker scribbles on the other locks
  sound: true,       // dial clicks, the clunk and the splash (and a tiny buzz on phones)

// ---------- setup ----------
const $ = id => document.getElementById(id);
const cv = $("c"), X = cv.getContext("2d");
const CODE = (() => { const d = String(CONFIG.code).replace(/\D/g, "").slice(0, 5); return d.length < 2 ? "142" : d; })();

const SERIF = '"Instrument Serif", Georgia, serif', MONO = '"IBM Plex Mono", ui-monospace, monospace';
window.__ev = [];
const ev = k => window.__ev.push([k, +(performance.now() / 1000).toFixed(3)]);

$("k1").textContent = CONFIG.label[0]; $("k2").textContent = CONFIG.label[1];

const line = $("line"), letters = [...CONFIG.line].map(ch => { const s = document.createElement("span"); s.textContent = ch; line.appendChild(s); return s; });

// ---------- layout ----------

  piv = railY - railR;

  win = { w: ND * dw + (ND - 1) * gap + bw * .05, h: bh * .34 }; win.x = -win.w / 2; win.y = bh * .46;

  line.style.fontSize = fs + "px";
  $("fin").style.top = (closedBottom + bw * .19) + "px";

// ---------- painting helpers ----------

  g.quadraticCurveTo(x, y + h, x, y + h - rb); g.lineTo(x, y + rt); g.quadraticCurveTo(x, y, x + rt, y); g.closePath();

  g.bezierCurveTo(x + s * .1, y + h * .76, x + s * .5, y + h * .58, x + s * .5, y + h * .3);

  lg.addColorStop(.42, m[1]); lg.addColorStop(.78, m[4] || m[1]); lg.addColorStop(1, m[0]);
  g.fillStyle = lg; g.fill();
  const vg = g.createLinearGradient(0, y, 0, y + h);
  vg.addColorStop(0, "rgba(255,238,205,.2)"); vg.addColorStop(.35, "rgba(255,238,205,0)"); vg.addColorStop(1, "rgba(25,12,0,.38)");
  g.fillStyle = vg; g.fill();

// round bar (shackle, rail): stacked strokes, highlight towards the sun

function engrave(g, text, x, y, light = .5, dark = .82) {
  g.fillStyle = `rgba(255,236,186,${light})`; g.fillText(text, x, y + 1.1);
  g.fillStyle = `rgba(52,30,5,${dark})`; g.fillText(text, x, y);
}

// ---------- build the static layers ----------
function build() {
  seed = 35;
  buildCity(); buildBG(); buildFG(); buildHero(); buildFX();
}
function buildCity() {
  cityC = mk(W * D, hy * D); const g = cityC.getContext("2d"); g.scale(D, D);
  const s = W / 540;
  // far haze skyline
  g.fillStyle = "rgba(122,94,116,.72)";
  for (let x = -10; x < W + 10;) { const w = R(16, 40) * s, h = R(.02, .07) * H * (Math.abs(x - sunX) < W * .1 ? .3 : 1); g.fillRect(x, hy - h, w + 1, h); x += w; }
  g.fillStyle = "rgba(122,94,116,.72)"; g.fillRect(W * .86, hy - H * .16, 3 * s, H * .16); g.fillRect(W * .86 - 4 * s, hy - H * .12, 11 * s, 6 * s);

  for (let x = -10; x < W + 10;) {

    g.fillStyle = near; g.fillRect(x, hy - h, w + .6, h);

    for (let wy = hy - h + 3 * s; wy < hy - 3 * s; wy += 4.5 * s) for (let wx = x + 2 * s; wx < x + w - 2 * s; wx += 4 * s)
      if (rnd() < lit * .5) { g.fillStyle = `rgba(255,${R(190, 225) | 0},${R(120, 160) | 0},${R(.45, .95)})`; g.fillRect(wx, wy, 1.6 * s, 2 * s); }

  g.beginPath(); g.arc(dx, db, dr, Math.PI, 0); g.fill(); g.fillRect(dx - 1.5 * s, db - dr - 8 * s, 3 * s, 8 * s);
  g.fillStyle = "rgba(255,190,120,.35)"; g.beginPath(); g.arc(dx, db, dr, Math.PI * 1.05, Math.PI * 1.35); g.lineTo(dx, db); g.fill();

  const tt = tl - 2.75;

function drawDials(bt, glow) {

      X.save(); X.translate(xc, y); X.scale(1, c);

function keyAt(u) {

}
function drawFlyingKey() {
  const u = keyF.u;

    const k = keyAt(Math.max(0, u - g * .018)); if (g && u < .02) continue;
    X.save(); X.globalAlpha = g ? .12 * (4 - g) / 3 : 1; X.translate(k.x, k.y); X.rotate(k.r); X.scale(k.s * (.35 + .65 * Math.abs(k.f)), k.s);

    X.save(); X.globalCompositeOperation = "lighter"; X.translate(k.x, k.y);

    X.fillStyle = `rgba(255,244,220,${.8 * gl})`; X.fillRect(-bw * .25 * gl, -.5, bw * .5 * gl, 1); X.fillRect(-.5, -bw * .14 * gl, 1, bw * .28 * gl);

function spawnDrops() {
  for (let i = 0; i < 20; i++) { const a = -Math.PI / 2 + R(-.75, .75), v = R(40, 120) * bw / 185; drops.push({ x: splash.x, y: splash.y, vx: Math.cos(a) * v * .8, vy: Math.sin(a) * v, r: R(.6, 1.5) }); }

function drawSplash(a) {
