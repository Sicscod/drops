<script>

const P = new URLSearchParams(location.search);
const arg = (k, n) => (P.get(k) || "").trim().slice(0, n);

  name: NAME,
  msg: (arg("msg", 90) || "can't stop thinking about you, {name}").replace(/\{name\}/g, NAME),  // written on the paper
  back: arg("back", 60) || "ok now send this back ✈",   // appears after it lands (✈ is drawn as a doodle)
  hue: P.get("hue") !== null && isFinite(parseFloat(P.get("hue"))) ? parseFloat(P.get("hue")) % 360 : 226,  // pen ink hue (226 = blue biro)
  label: "a note for " + NAME,
  clock: "1:12 am",
  foldStep: .42,      // seconds per fold (6 folds)

// ---------- small math ----------

// ---------- canvas, sizes ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const stepEl = document.getElementById("step"), hintEl = document.getElementById("hint");
let W = 0, H = 0, DPR = 1, S = 1, CX = 0, CY = 0, ZF = .4, HS = 10, HCY = 0, TW = 512;
let desk = null, deskX0 = 0, deskY0 = 0, DS = 1, texF = null, texB = null, layout = null, fontOK = false;
const F = 1100;   // camera focal length (px)
let home = [0, 0, 0], hover = [0, 0, 0];
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  S = Math.min(W * .8, H * .7 / PH, 470); CX = W / 2; CY = H * .48;
  ZF = clamp(CONFIG.planeSize * Math.min(W, H) / (PH * S), .22, .65);
  HS = Math.min(.72 * W / ZF / 32, .62 * H / ZF / 29); HCY = -.03 * H / ZF;
  home = [PIV[0] * S, (PIV[1] - PH / 2) * S, PIV[2] * S]; hover = [0, -.02 * S, home[2] + 36];

  for (const t of [texF, texB]) { t.width = TW; t.height = Math.ceil(TW * PH); }

// ---------- desk at night (world px, drawn once) ----------

let wrote = [0, 0], texDirty = true;
