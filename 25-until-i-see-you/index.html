<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Until I see you</title>
<meta name="description" content="A night globe with a flight path between you and your person, and a live countdown to the day you meet. Free code by @sicscod.drops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
:root{--bg:#060912;--ink:#f3ece0;--mute:#7c8496;--line:rgba(243,236,224,.16)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;color:var(--ink)}
.mail{height:4px;background:repeating-linear-gradient(-45deg,#b8443d 0 9px,transparent 9px 14px,#34508f 14px 23px,transparent 23px 28px);opacity:.75}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px 0;font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.top b{font-weight:500;color:#d8d0c3}
.stage{flex:1;min-height:0}
.count{position:relative;text-align:center;padding:0 16px}
.digits{display:flex;justify-content:center;align-items:flex-start;gap:6px;font:400 clamp(34px,10.5vw,48px)/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.digits i{font-style:normal;color:#4a5164;padding-top:1px}
.cell{display:flex;flex-direction:column;align-items:center;min-width:1.25em}
.cell small{margin-top:7px;font:500 9.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.2em;color:var(--mute)}
.line{margin:12px 0 0;font:italic 300 clamp(19px,5.4vw,24px) "Fraunces",Georgia,serif;color:#cfc5b6}
.line em{font-style:italic;font-weight:400;color:var(--her)}
.fin{position:absolute;left:0;right:0;top:-6px;text-align:center;opacity:0}
.fin p{margin:0;font:italic 300 clamp(52px,15vw,70px)/1 "Fraunces",Georgia,serif;letter-spacing:-.02em}
.fin small{display:block;margin-top:10px;font:500 10.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.act{display:flex;flex-direction:column;align-items:center;padding:18px 0 0}
#kiss{pointer-events:auto;display:inline-flex;align-items:center;gap:9px;padding:11px 20px 11px 17px;border:1px solid var(--line);border-radius:999px;background:rgba(243,236,224,.04);color:var(--ink);font:500 11.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
#kiss svg{width:13px;height:13px;fill:var(--her)}
.sent{height:14px;margin-top:8px;font:400 10px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--mute)}
.credit{padding:6px 0 12px;text-align:center;font:11px "IBM Plex Mono",ui-monospace,monospace;color:var(--mute);opacity:.6;pointer-events:auto}
.credit a{color:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="mail"></div>
  <div class="top"><span id="route"></span><span id="km"></span></div>
  <div class="stage" id="stage"></div>
  <div class="count">
    <div id="cd">
      <div class="digits">
        <div class="cell"><span id="dd">00</span><small>days</small></div><i>:</i>
        <div class="cell"><span id="hh">00</span><small>hrs</small></div><i>:</i>
        <div class="cell"><span id="mm">00</span><small>min</small></div><i>:</i>
        <div class="cell"><span id="ss">00</span><small>sec</small></div>
      </div>
      <p class="line" id="line"></p>
    </div>
    <div class="fin" id="fin"><p id="finally"></p><small id="finsub"></small></div>
  </div>
  <div class="act">
    <button id="kiss" type="button"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.8 1.3 5.3 3.1 1.5-1.8 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg><span id="kisslbl"></span></button>
    <div class="sent" id="sent"></div>
  </div>

</div>
<script>

  "miami":[25.8,-80.2], "mexico city":[19.4,-99.1], "sao paulo":[-23.5,-46.6], "buenos aires":[-34.6,-58.4],
  "london":[51.5,-0.1], "paris":[48.9,2.35], "berlin":[52.5,13.4], "madrid":[40.4,-3.7], "rome":[41.9,12.5],

  "warsaw":[52.2,21], "dubai":[25.2,55.3], "cairo":[30,31.2], "lagos":[6.5,3.4], "almaty":[43.2,76.9],

  "singapore":[1.35,103.8], "shanghai":[31.2,121.5], "beijing":[39.9,116.4], "hong kong":[22.3,114.2],
  "seoul":[37.6,127], "tokyo":[35.7,139.7], "manila":[14.6,121], "jakarta":[-6.2,106.8], "sydney":[-33.9,151.2],

const cv = document.getElementById("c"), g = cv.getContext("2d"), $ = id => document.getElementById(id);
const HER = `hsl(${CONFIG.hue} 85% 66%)`, ME = "#f1c27a";

  const a = Math.random() * 6.283, inner = i > 180 ? Math.sqrt(Math.random()) * .85 : 1;
  const x = 16 * Math.pow(Math.sin(a), 3), y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);

$("kiss").addEventListener("click", () => {
  const now = performance.now() / 1000 - (t0 || 0);
  kisses++; kissT = now;
  for (let i = 0; i < 5; i++) hearts.push({ t: now + i * .13, dur: 1.55 + Math.random() * .3, w: (Math.random() - .5) * 2, sz: 7 + Math.random() * 5 });
  $("sent").textContent = kisses === 1 ? "1 kiss on its way" : `${kisses} kisses on their way`;

// ---------- drawing helpers ----------
function heartPath(x, y, s, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s / 16, s / 16); g.beginPath();

      g.save(); g.translate(p[0], p[1]); g.rotate(ang); g.globalAlpha = plA;
      g.fillStyle = "#f6efe2"; g.beginPath(); g.moveTo(8, 0); g.lineTo(-6, -5.5); g.lineTo(-3, 0); g.lineTo(-6, 5.5); g.closePath(); g.fill();
      g.fillStyle = "#b9b1a4"; g.beginPath(); g.moveTo(8, 0); g.lineTo(-3, 0); g.lineTo(-6, 5.5); g.closePath(); g.fill();
      g.restore(); g.globalCompositeOperation = "lighter";
    }
  }

  // kiss hearts flying the arc
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i], k = (t - h.t) / h.dur; if (k < 0) continue;
    if (k >= 1) { bursts.push({ t, }); hearts.splice(i, 1); continue; }
    let x, y, hid = false, sc = 1;
    if (finT === null) { const e = ease(k), p = proj(arc(e), yaw), q = proj(arc(Math.min(1, e + .02)), yaw);
      const nx = -(q[1] - p[1]), ny = q[0] - p[0], nl = Math.hypot(nx, ny) || 1, wob = Math.sin(k * 9 + h.w * 3) * 7 * h.w * Math.sin(Math.PI * k);
      x = p[0] + nx / nl * wob; y = p[1] + ny / nl * wob; hid = p[3]; }
    else { const m = proj(arc(.5), yaw); x = m[0] + h.w * 60 * k; y = m[1] - R * .2 - k * R * .9; sc = 1 - k * .3; }
    if (hid) continue;
    const a = Math.min(1, k * 6, (1 - k) * 5);
    glow(x, y, h.sz * 2.2, herRGB.join(), .4 * a);
    g.fillStyle = `rgba(${herRGB},${.95 * a})`; heartPath(x, y, h.sz * 1.15 * sc, Math.sin(k * 7 + h.w) * .25); g.fill();
  }

  // city points
  const pA = proj(merge > 0 ? arc(.5 * merge) : VA, yaw), pB = proj(merge > 0 ? arc(1 - .5 * merge) : VB, yaw);
  const pulseB = bursts.reduce((m, b) => Math.max(m, clamp(1 - (t - b.t) / .9)), 0);
  for (const [p, col, name, city, side, pulse] of [[pA, meRGB, "you", A.name, -1, 0], [pB, herRGB, CONFIG.name, B.name, 1, pulseB]]) {
    const vis = p[3] ? 0 : clamp(p[2] * 4 + (merge > 0 ? 1 : .15)), a = vis * (1 - bloom);
    if (a <= 0) continue;
    glow(p[0], p[1], 22 + 16 * pulse, col.join(), (.55 + .4 * pulse) * a);
    const ring = (t * .7 + (side > 0 ? .5 : 0)) % 1;
    g.strokeStyle = `rgba(${col},${.5 * (1 - ring) * a})`; g.lineWidth = 1; g.beginPath(); g.arc(p[0], p[1], 4 + ring * 18, 0, 6.283); g.stroke();
    if (pulse > 0) { g.strokeStyle = `rgba(${col},${.8 * pulse * a})`; g.beginPath(); g.arc(p[0], p[1], 6 + (1 - pulse) * 30, 0, 6.283); g.stroke(); }
    g.fillStyle = `rgba(255,250,240,${a})`; g.beginPath(); g.arc(p[0], p[1], 2.6, 0, 6.283); g.fill();
    // label
    const la = a * (1 - merge);
    if (la > .01) {
      g.globalCompositeOperation = "source-over";
      const lx = p[0] + side * 14, ly = p[1] - 17;
      g.textAlign = side > 0 ? "left" : "right";
      g.font = 'italic 300 17px "Fraunces", Georgia, serif'; g.fillStyle = `rgba(${col},${la})`; g.fillText(name, lx, ly);
      g.font = '500 9px "IBM Plex Mono", monospace'; g.fillStyle = `rgba(160,168,186,${la})`; g.fillText(city.toUpperCase(), lx, ly + 13);
      g.globalCompositeOperation = "lighter";
    }
  }
  for (let i = bursts.length - 1; i >= 0; i--) if (t - bursts[i].t > 1) bursts.splice(i, 1);

  // finale: the two dots meet at the top of the arc and open into a heart
  if (finT !== null) {
    const m = proj(arc(.5), yaw), flash = clamp(1 - Math.abs(F - 1.25) / .45);
    glow(m[0], m[1], R * .6 * flash + 1, "255,225,215", .55 * flash);
    if (bloom > 0) {
      const beat = 1 + .05 * Math.pow(Math.max(0, Math.sin(t * 5.2)), 6), HS = R * .5 * beat;
      const hx = m[0] + (cx - m[0]) * bloom, hy = m[1] + R * .08 + (cy - R * .06 - m[1] - R * .08) * bloom;
      glow(hx, hy, HS * 1.6, herRGB.join(), .18 * bloom);
      for (const q of heartPts) {
        const e = out3((F - 1.1 - q.d) / 1.3); if (e <= 0) continue;
        const x = hx + q.x * HS * e, y = hy + q.y * HS * e, tw = .65 + .35 * Math.sin(t * 3 + q.ph);
        const col = q.mix < .5 ? herRGB : meRGB;
        g.fillStyle = `rgba(${col},${.9 * tw * e})`; g.beginPath(); g.arc(x, y, q.s * (R / 125), 0, 6.283); g.fill();
      }
      g.fillStyle = `rgba(${herRGB},${.2 * bloom})`; g.beginPath();
      for (let i = 0; i < 64; i++) { const a = i / 64 * 6.283, x = 16 * Math.pow(Math.sin(a), 3), y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
        g.lineTo(hx + x / 17 * HS * bloom, hy - y / 17 * HS * bloom); }
      g.fill();
    }
  }
  g.globalCompositeOperation = "source-over";
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
