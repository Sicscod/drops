<!doctype html>
<!--
  Light Mode · drop 53 · free code by @sicscod.drops (MIT)
  A dark code editor at 3:00 AM. A tiny vampire developer is happily typing. Flip the theme toggle and the
  whole editor flashbangs to light mode: he screams, hisses, smokes and shrinks, his coffee boils over and the
  code goes pale. Flip it back and he puffs up again and sips his coffee. Try it one more time... he grabs it.

<script>
// ===== Light Mode · free code by @sicscod.drops =====
// Try: yoursite/?hue=150&time=4:20%20AM   (?auto=1 plays the whole thing by itself)
const P = new URLSearchParams(location.search);
const num = (k, d) => P.get(k) !== null && P.get(k) !== "" && isFinite(+P.get(k)) ? +P.get(k) : d;
const CONFIG = {
  hue: num("hue", 205),                    // hoodie colour, 0-360 (205 navy, 150 green, 0 red, 30 orange)
  time: (P.get("time") || "3:00 AM").slice(0, 10),   // the clock in the corner
  auto: P.get("auto") === "1",             // a cursor plays the whole thing by itself
  file: "night.js",
  code: [
    "// night.js · {time} · one more feature",
    "const sun = null;   // not in this house",
    "let coffee = Infinity;",
    "",
    "function lockIn() {",
    "  while (!sunrise) {",
    "    ship(nextFeature());",
    "  }",
    "}",
    "",
  ],
  typing: "theme.set(\"dark\"); // forever",   // the line he keeps typing
  mug: ["DARK", "ROAST"],                  // printed on the mug
  hoodie: "404 SLEEP",                     // printed on the hoodie
  quips: {
    scream: "AAAAH!",
    hiss: "HSSSSS!",
    phew: "phew...",
    sip: ["much better.", "ahh. dark.", "perfect."],
    hot: "HOT HOT HOT",
    tease: "don't.",
    grab: "nope.",
    lock: "dark mode. forever.",
    rattle: ["nope.", "locked.", "no sun."],
    unlock: "fine. ONE time.",

  toast: "LIGHT MODE",
  lockAfter: 2,                            // after this many flashbangs, the next try gets the toggle locked
  sound: true,
};

// ---------- setup ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = x => (x = clamp(x, 0, 1), x * x * (3 - 2 * x));
const outBack = x => (x = clamp(x, 0, 1), 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2));
const rnd = (a, b) => a + Math.random() * (b - a);
const F = { mono: '"JetBrains Mono", ui-monospace, monospace', ui: '"Fredoka", system-ui, sans-serif' };
const HUE = ((CONFIG.hue % 360) + 360) % 360;
const HOOD = (dl = 0) => `hsl(${HUE},40%,${36 + dl}%)`;
const INK = "#16121c";
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`; };
// two themes; every colour on screen is a blend between them
const DARK = { bg: "#12131a", tab: "#0b0c11", tabOn: "#12131a", line: "#1f2130", gut: "#3c3f54", text: "#d3d6e8", kw: "#ff7eb6", str: "#a3e39a", fn: "#7cc8ff",
  com: "#5f647d", num: "#ffb86b", punc: "#8fdcff", stat: "#0b0c11", statText: "#8c91ab", desk: "#1b1922", deskTop: "#2b2833", kb: "#262833", key: "#33364a", mini: "#2a2d3f" };
const LIGHT = { bg: "#ffffff", tab: "#f2f2f4", tabOn: "#ffffff", line: "#ececf1", gut: "#dcdde5", text: "#cdd0da", kw: "#efc3d6", str: "#c8e2c4", fn: "#c3d9ee",
  com: "#e0e1e7", num: "#f0d8bd", punc: "#cde3ec", stat: "#f4f4f6", statText: "#a7aabb", desk: "#ebe7e0", deskTop: "#f8f5ef", kb: "#dfe0e6", key: "#f4f4f7", mini: "#ececf2" };

const CODE = CONFIG.code.map(l => l.replace("{time}", CONFIG.time));

function tokens(s) {                                        // tiny JS highlighter -> class per char
  const out = Array(s.length).fill("text"); let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (s.startsWith("//", i)) { for (; i < s.length; i++) out[i] = "com"; break; }
    if (ch === '"' || ch === "'") { let j = i + 1; while (j < s.length && s[j] !== ch) j++; for (let k = i; k <= j && k < s.length; k++) out[k] = "str"; i = j + 1; continue; }
    if (/[A-Za-z_$]/.test(ch)) { let j = i; while (j < s.length && /[\w$]/.test(s[j])) j++; const w = s.slice(i, j);
      const c = /^(const|let|var|function|return|if|else|for|while|break|new|true|false|null|Infinity)$/.test(w) ? "kw" : s[j] === "(" ? "fn" : "text";
      for (let k = i; k < j; k++) out[k] = c; i = j; continue; }
    if (/\d/.test(ch)) out[i] = "num"; else if (/[{}()\[\];,.:=+<>!]/.test(ch)) out[i] = "punc";
    i++;

}
const TOK = CODE.map(tokens), TOKT = tokens(CONFIG.typing);

let W = 0, H = 0, DPR = 1, S = 1, FOOT = 24, TABH = 44, SBH = 58, FS = 16, LH = 25, CW = 9, GUT = 40, CY0 = 60, R = 90, VX = 270, DY = 430, SB0 = 480;
let TGL = { x: 0, y: 0, w: 90, h: 44 }, MUG = { x: 0, y: 0, w: 50, h: 60 };
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  S = clamp(Math.min(W / 540, H / 600), .6, 1.6);
  TABH = 44 * S; SBH = 60 * S; SB0 = H - FOOT - SBH;
  ctx.font = `400 100px ${F.mono}`; const ratio = ctx.measureText("M").width / 100;
  const maxc = Math.max(...CODE.map(l => l.length), CONFIG.typing.length);

  const stage = SB0 - TABH;

  TGL = { w: 96 * S, h: 42 * S }; TGL.x = W - 14 * S - TGL.w; TGL.y = SB0 + (SBH - TGL.h) / 2;
  MUG = { w: .62 * R, h: .72 * R }; MUG.x = Math.max(MUG.w * .6 + 6 * S, VX - 1.62 * R); MUG.y = DY + .02 * R;   // x: centre, y: bottom
}

// ---------- state ----------
let now = 0, last = 0, T0 = -1, TH = 0, light = false, lightT = -9, darkT = -9, shrinkAtDark = 1, flashes = 0, shake = 0;
let sipT = -9, grabT = -9, grabPt = null, grabHold = 0, locked = false, lockT = -9, rattleT = -9, rattles = 0, hover = false, susT = -9;
let typed = 0, typeAcc = 0, typePause = 0, scale = 1, kbFlash = [], boilT = 0, smokeT = 0, sparkT = 0;
const parts = [], bubbles = {};
const cur = { x: 0, y: 0, seen: false, pressT: -9 };
const events = window.__events = [];
const ev = (name, extra) => events.push([name, +(now - T0).toFixed(3), extra]);
const later = [];
function after(d, fn) { later.push({ t: now + d, fn }); }     // tiny scheduler driven by the rAF loop (no setTimeout)
function say(text, life = 1, style = "talk", delay = 0) { bubbles.v = { text, t0: now + delay, life, style }; }

// ---------- sound (Web Audio, starts on the first tap) ----------
let AC = null, sizz = null;
function audio() {
  if (!CONFIG.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    if (!sizz) {                                              // the sizzle: looped noise, louder while he burns
      const n = AC.sampleRate * 2, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .03 ? 3 : .5);

      s.buffer = b; s.loop = true; f.type = "highpass"; f.frequency.value = 3500; g.gain.value = 0;
      s.connect(f).connect(g).connect(AC.destination); s.start(); sizz = g;
    }
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, len, vol, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len * .8);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0006, t + len);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + len + .02);
}
function noise(len, vol, fc, q = 1, type = "bandpass", delay = 0, f1) {
  if (!AC) return; const n = AC.sampleRate * len | 0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.5);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime + delay;
  f.type = type; f.frequency.setValueAtTime(fc, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + len); f.Q.value = q; g.gain.value = vol;
  s.buffer = b; s.connect(f).connect(g).connect(AC.destination); s.start(t);

const sfx = {
  click() { tone("square", 1800, 900, .03, .05); noise(.04, .6, 3000, 1.5); },
  flash() { noise(.7, .9, 6000, .7, "highpass"); [1760, 2217, 2637].forEach(f => tone("sawtooth", f, f * 1.02, .9, .025)); tone("sine", 3200, 5200, .5, .04); },
  scream() { tone("sawtooth", 700, 1250, .75, .06); tone("square", 1050, 1600, .7, .02); },
  hiss() { noise(.8, .7, 5200, .8, "highpass"); },
  puff() { noise(.4, .7, 600, .8, "lowpass", 0, 200); tone("sine", 220, 110, .3, .15); },
  sip() { noise(.45, .5, 700, 4, "bandpass", 0, 1600); tone("sine", 330, 260, .3, .04, .45); },
  boil() { tone("sine", rnd(220, 380), rnd(500, 800), .06, .05); },
  grab() { noise(.18, .6, 1500, 1, "bandpass", 0, 400); tone("sine", 160, 60, .15, .25, .12); },
  lock() { tone("square", 2400, 2400, .02, .06); tone("square", 1700, 1700, .03, .06, .06); tone("sine", 90, 38, .8, .5, .06); },
  rattle() { [0, .05, .1].forEach(d => tone("square", 1900 + rnd(-200, 200), 1500, .025, .04, d)); },
};

// ---------- the story ----------
function goLight() {
  light = true; lightT = now; flashes++; shake = 1; typePause = 0;
  say(CONFIG.quips.scream, 1, "shout", .04);
  after(1.05, () => { if (light) { say(CONFIG.quips.hiss, .9, "shout"); sfx.hiss(); } });
  sfx.click(); sfx.flash(); sfx.scream(); ev("light", flashes);
}
function goDark() {
  light = false; darkT = now; shrinkAtDark = scale; shake = .3;
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].kind === "smoke") parts.splice(i, 1);
  for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; parts.push({ kind: "puff", x: VX + Math.cos(a) * R * 1.35, y: DY - 1.9 * R + Math.sin(a) * R * 1.3, vx: Math.cos(a) * 120 * S, vy: Math.sin(a) * 90 * S, r: R * rnd(.12, .2), t0: now, life: .5 }); }
  say(CONFIG.quips.phew, .85, "talk", .1);
  sfx.click(); sfx.puff(); ev("dark");
}
function toggle(x, y) {
  if (locked) { rattleT = now; rattles++; sfx.rattle(); ev("rattle", rattles);
    if (rattles >= 3) { locked = false; rattles = 0; flashes = 0; say(CONFIG.quips.unlock, 1.2); ev("unlock"); }
    else say(CONFIG.quips.rattle[(rattles - 1) % CONFIG.quips.rattle.length], .8);
    return; }
  if (now - grabT < 1.2) return;
  if (light) { goDark(); return; }
  if (!CONFIG.auto && flashes >= CONFIG.lockAfter) { grab(x, y); return; }
  goLight();
}
function sip(quiet) {
  if (now - sipT < 1.3 || now - grabT < .9 && !CONFIG.auto) return;
  sipT = now; sfx.sip(); ev("sip");
  if (light) say(CONFIG.quips.hot, .9, "shout", .35);
  else if (!quiet) { const q = CONFIG.quips.sip; say(q[Math.floor(Math.random() * q.length)], 1.25, "talk", .85); }
}
function grab(x, y) {                                          // he grabs the cursor and locks the toggle
  grabT = now; grabPt = { x, y }; grabHold = CONFIG.auto ? 99 : 2.4; shake = .5;
  if (CONFIG.auto) { cseg = null; cur.x = x; cur.y = y; }
  say(CONFIG.quips.grab, .6, "shout"); sfx.grab(); ev("grab");
  after(.75, () => { locked = true; lockT = now; shake = 1; rattles = 0; sfx.lock(); say(CONFIG.quips.lock, 2.4, "talk", .05); ev("lock");
    for (let k = 0; k < 12; k++) { const a = rnd(0, 7); parts.push({ kind: "spark", x: TGL.x + TGL.w / 2, y: TGL.y + TGL.h / 2, vx: Math.cos(a) * rnd(120, 260) * S, vy: Math.sin(a) * rnd(120, 260) * S - 60 * S, t0: now, life: rnd(.25, .45), c: "#ffd34d" }); } });
}
function reset() {
  light = false; TH = 0; lightT = darkT = sipT = grabT = lockT = rattleT = -9; flashes = 0; locked = false; grabPt = null; scale = 1; shrinkAtDark = 1;

// ---------- input ----------
const inToggle = (x, y) => x > TGL.x - 14 * S && x < TGL.x + TGL.w + 14 * S && y > TGL.y - 14 * S && y < TGL.y + TGL.h + 14 * S;
const onVamp = (x, y) => Math.abs(x - VX) < 1.4 * R && y > DY - 3.3 * R * scale && y < DY + .3 * R || Math.hypot(x - MUG.x, y - (MUG.y - MUG.h / 2)) < MUG.w;

  if (CONFIG.auto) return; audio();

  if (inToggle(x, y)) toggle(x, y); else if (onVamp(x, y)) sip();
});
cv.addEventListener("pointermove", e => { if (CONFIG.auto) return; const h = e.pointerType === "mouse" && inToggle(e.clientX, e.clientY);
  if (h && !hover && !light && !locked && now - susT > 2) { susT = now; say(CONFIG.quips.tease, 1); } hover = h; });

addEventListener("resize", resize);

// ---------- ?auto=1: a scripted cursor plays the story (used for the video) ----------
const tgc = (dx = 0, dy = 0) => () => ({ x: TGL.x + TGL.w * .5 + dx * S, y: TGL.y + TGL.h * .55 + dy * S });

const CUR_AUTO = [     // [time, "move", duration, target, from?] / [time, "do", fn]
  [0.0, "move", .09, tgc(-6, 2), tgc(-30, -26)],
  [AT.flash, "do", () => { cur.pressT = now; goLight(); }],
  [.45, "move", .5, tgc(-70, -40)],
  [1.95, "move", .4, tgc(0, 0)],
  [AT.dark, "do", () => { cur.pressT = now; goDark(); }],
  [2.75, "move", .7, () => ({ x: W * .86, y: TABH + 70 * S })],
  [AT.sip, "do", () => sip()],
  [AT.tease, "move", .55, tgc(-40, -34)],
  [5.25, "do", () => say(CONFIG.quips.tease, 1.1)],
  [5.5, "move", .2, tgc(-6, -2)],
  [5.75, "move", .2, tgc(-36, -24)],
  [6.0, "move", .18, tgc(-22, -2)],
  [6.2, "move", .15, tgc(-30, -12)],
  [AT.grab, "do", () => { const p = tgc(-28, -14)(); grab(p.x, p.y); }],
  [AT.sip2, "do", () => sip(true)],

let ci = 0, cseg = null;
function runAuto() {
  const t = now - T0;
  while (ci < CUR_AUTO.length && t >= CUR_AUTO[ci][0]) {
    const a = CUR_AUTO[ci++];
    if (a[1] === "move") { const from = a[4] ? a[4]() : { x: cur.x, y: cur.y }; cseg = { t0: T0 + a[0], len: a[2], from, to: a[3]() }; cur.seen = true; }
    else a[2]();

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- the vampire ----------
// o: {x, y (desk line), u (size), pose: type|burn|phew|sip|sus|smug, burn 0..1, look {x,y}}
function arm(sx, sy, hx, hy, u, bend, cuff = true) {           // a hoodie sleeve as a thick bendy stroke
  const mx = (sx + hx) / 2 + bend * u, my = (sy + hy) / 2 + Math.abs(bend) * u * .3;
  ctx.lineCap = "round";
  for (const [c, w] of [[INK, .34], [HOOD(4), .25]]) { ctx.strokeStyle = c; ctx.lineWidth = u * w; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, hx, hy); ctx.stroke(); }

}
function hand(x, y, u, skin, big = 1) { ell(x, y, u * .15 * big, u * .14 * big, 0, skin, u * .045); }
function drawVamp(o) {
  const u = o.u, lw = Math.max(1.5, u * .045), pose = o.pose;
  const skin = mix("#ebe3f4", "#ff8a7a", o.burn * .85), skinD = mix("#cfc3dd", "#e8665a", o.burn * .85);
  ctx.save(); ctx.translate(o.x, o.y); ctx.lineJoin = ctx.lineCap = "round";
  // ---- collar + cape (behind)
  for (const sd of [-1, 1]) {

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,214,90,.13)";
  for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6 + now * .25; ctx.beginPath(); ctx.moveTo(W * .5, H * .3); ctx.arc(W * .5, H * .3, H * 1.2, a, a + .14); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function drawToast() {
  if (!light) return; const k = now - lightT; if (k < .08) return;
  const pop = outBack((k - .08) / .25);
  ctx.save(); ctx.font = `700 ${27 * S}px ${F.ui}`; const tw = ctx.measureText(CONFIG.toast).width + 66 * S, th = 50 * S, x = 14 * S, y = TABH + 12 * S;
  ctx.translate(x + tw / 2, y + th / 2); ctx.scale(pop, pop); ctx.rotate(-.04); ctx.translate(-(x + tw / 2), -(y + th / 2));
  rr(x + 3 * S, y + 4 * S, tw, th, th / 2); ctx.fillStyle = INK; ctx.fill();
  rr(x, y, tw, th, th / 2); inkFill("#ffd34d", 2.5 * S);
  sun(x + 27 * S, y + th / 2, 14 * S, "#e07800");
  ctx.fillStyle = INK; ctx.textBaseline = "middle"; ctx.fillText(CONFIG.toast, x + 48 * S, y + th / 2 + 1);
  ctx.restore();
}
function drawBubble(ax, ay) {
  const q = bubbles.v; if (!q || now < q.t0 || now > q.t0 + q.life) return;
  const k = now - q.t0, a = k > q.life - .15 ? (q.life - k) / .15 : 1, pop = outBack(k / .16), shout = q.style === "shout";
  ctx.font = `700 ${(shout ? 31 : 27) * S}px ${F.ui}`; const tw = ctx.measureText(q.text).width + 34 * S, th = (shout ? 54 : 48) * S;
  let bx = ax + tw / 2, by = ay - th;                                   // prefer right of the head
  if (bx + tw / 2 > W - 8 * S) { bx = clamp(VX, tw / 2 + 8 * S, W - tw / 2 - 8 * S); by = Math.min(ay - th, DY - 3.35 * R * scale - th - 6 * S); }
  by = Math.max(by, TABH + 6 * S);
  const jx = shout ? Math.sin(now * 55) * 2 * S : 0;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(bx + jx, by + th / 2); ctx.scale(pop, pop); ctx.rotate(shout ? -.05 : 0);
  const path = () => {
    if (!shout) { rr(-tw / 2, -th / 2, tw, th, 14 * S); return; }
    ctx.beginPath(); const n = 22;
    for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2, r1 = i % 2 ? 1 : 1.18, x = Math.cos(t) * tw * .56 * r1, y = Math.sin(t) * th * .72 * r1; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath();
  };
  ctx.translate(3 * S, 4 * S); path(); ctx.fillStyle = INK; ctx.fill(); ctx.translate(-3 * S, -4 * S);
  path(); ctx.fillStyle = shout ? "#ffffff" : "#fbf7ee"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.6 * S; ctx.lineJoin = "round"; ctx.stroke();
  if (!shout) { const tx = clamp(ax - bx, -tw / 2 + 16 * S, tw / 2 - 16 * S); ctx.beginPath(); ctx.moveTo(tx - 8 * S, th / 2 - 1); ctx.lineTo(tx - 14 * S, th / 2 + 12 * S); ctx.lineTo(tx + 6 * S, th / 2 - 1); ctx.fillStyle = "#fbf7ee"; ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fbf7ee"; ctx.fillRect(tx - 9 * S, th / 2 - 4 * S, 16 * S, 4 * S); }
  ctx.fillStyle = shout ? "#d4142f" : INK; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(q.text, 0, 1.5 * S);
  ctx.restore();
}
function drawCursor(force) {
  if (!CONFIG.auto || !cur.seen) return;
  if (!force && grabPt && now - grabT > .12 && now - grabT < grabHold) return;     // drawn under his hand instead
  const pk = now - cur.pressT, sc = pk < .15 ? lerp(.8, 1, pk / .15) : 1;
  let x = cur.x, y = cur.y;
  if (force) { x += Math.sin(now * 47) * 3 * S; y += Math.cos(now * 39) * 2 * S; }   // struggling to escape
  ctx.save(); ctx.translate(x, y); ctx.scale(sc * 1.7 * S, sc * 1.7 * S);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 17); ctx.lineTo(4.2, 13); ctx.lineTo(7, 19.5); ctx.lineTo(9.6, 18.4); ctx.lineTo(6.9, 12.2); ctx.lineTo(12.2, 12.2); ctx.closePath();
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
  ctx.fillStyle = "#111"; ctx.fill(); ctx.shadowColor = "transparent"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.4; ctx.lineJoin = "round"; ctx.stroke();
  ctx.restore();
  if (pk < .45 && !force) { const k = pk / .45; ctx.strokeStyle = `rgba(255,126,182,${.9 * (1 - k)})`; ctx.lineWidth = 3 * S; ctx.beginPath(); ctx.arc(cur.x, cur.y, (6 + k * 30) * S, 0, 7); ctx.stroke(); }
}
function drawFlash() {                                         // the flashbang: white-out + camera burst from the toggle
  const k = now - lightT; if (k < 0 || k > .9) return;
  const cx = TGL.x + TGL.w * .7, cy = TGL.y + TGL.h / 2;
  ctx.save();
  ctx.globalAlpha = clamp(1 - (k - .05) / .55, 0, 1) ** 1.4;
  ctx.fillStyle = "#fffef6"; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = clamp(1 - k / .7, 0, 1);
  ctx.fillStyle = "#fff6c2";
  for (let i = 0; i < 14; i++) { const a = i * Math.PI / 7 + .2, len = H * (.6 + .5 * (i % 2)) * (.4 + k * 1.2);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a - .05) * len, cy + Math.sin(a - .05) * len); ctx.lineTo(cx + Math.cos(a + .05) * len, cy + Math.sin(a + .05) * len); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = "rgba(255,200,60,.8)"; ctx.lineWidth = 6 * S; ctx.beginPath(); ctx.arc(cx, cy, k * H * 1.3, 0, 7); ctx.stroke();
  ctx.restore();
}

// ---------- one loop for everything ----------
function frame(t) {
  now = t / 1000; const dt = Math.min(.05, last ? now - last : 1 / 60); last = now;
  if (T0 < 0) { T0 = now; }
  if (CONFIG.auto) runAuto();
  for (let i = later.length - 1; i >= 0; i--) if (now >= later[i].t) { const f = later[i].fn; later.splice(i, 1); f(); }

  // ----- simulation -----
  TH = light ? sm((now - lightT) / .08) : 1 - sm((now - darkT) / .22);
  const burnK = light ? clamp((now - lightT) / 2.1, 0, 1) : 0;
  if (light) scale = 1 - .34 * sm(burnK);
  else { const k = now - darkT; scale = darkT < 0 ? 1 : 1 - (1 - shrinkAtDark) * Math.exp(-k * 6) * Math.cos(k * 14); }
  const sipK = clamp((now - sipT) / 1.15, 0, 1), sipping = now - sipT < 1.15;
  const grabbing = grabPt && now - grabT >= 0 && now - grabT < grabHold + .3;
  const tease = CONFIG.auto ? (now - T0 > AT.tease + .3 && now - T0 < AT.grab) : hover && !light && !locked;
  let pose = "type";
  if (light) pose = "burn";
  else if (sipping) pose = "sip";
  else if (grabbing || locked) pose = "smug";
  else if (tease) pose = "sus";
  else if (now - darkT < 1.0) pose = "phew";
  if (pose === "type") {                                       // he types the next line
    typeAcc += dt * 13; while (typeAcc > 1) { typeAcc--; if (typed < CONFIG.typing.length) { typed++; kbFlash = [Math.floor(Math.random() * 24), Math.floor(Math.random() * 24)]; } else { typePause += 1; if (typePause > 22) { typed = 0; typePause = 0; } } }
  } else kbFlash = [];
  if (light) {
    smokeT -= dt; sparkT -= dt; boilT -= dt;
    if (smokeT < 0) { smokeT = .05; const a = rnd(-1, 1); parts.push({ kind: "smoke", x: VX + a * R * scale * .9, y: DY - (2.95 + rnd(0, .25)) * R * scale, vx: a * 40 * S, vy: -rnd(60, 110) * S, r: R * rnd(.13, .2) * (.7 + .5 * burnK), t0: now, life: rnd(.7, 1.1) }); }
    if (sparkT < 0) { sparkT = .035; const a = rnd(0, Math.PI * 2); parts.push({ kind: "spark", x: VX + Math.cos(a) * R * scale, y: DY - 2.08 * R * scale + Math.sin(a) * R * scale * .9, vx: Math.cos(a) * rnd(60, 160) * S, vy: Math.sin(a) * rnd(60, 160) * S - 80 * S, t0: now, life: rnd(.2, .4), c: Math.random() < .5 ? "#ff8a1e" : "#ffd34d" }); }
    if (boilT < 0 && now - lightT > .4) { boilT = rnd(.05, .12); sfx.boil(); }
    if (sizz) sizz.gain.value = .05 + .04 * burnK;
  } else if (sizz) sizz.gain.value = 0;
  shake *= Math.exp(-dt * 6);
  for (const p of parts) { if (p.kind === "smoke") { p.vx *= .99; } }

  // ----- draw -----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = (Math.random() - .5) * 14 * S * shake, sy = (Math.random() - .5) * 14 * S * shake;
  ctx.save(); ctx.translate(sx, sy);
  drawCode(); drawGlare();
  const bob = pose === "type" ? Math.abs(Math.sin(now * Math.PI * 100 / 60)) * -.04 * R : pose === "burn" ? Math.sin(now * 45) * .03 * R : 0;
  const lookAt = CONFIG.auto ? cur : (hover ? { x: TGL.x, y: TGL.y } : null);
  const o = { x: VX + (light ? Math.sin(now * 38) * 3 * S : 0), y: DY, u: R * scale, pose, burn: light ? sm(burnK * 1.5) : Math.max(0, 1 - (now - darkT) * 2) * (darkT > 0 ? 1 : 0), bob, look: (pose === "sus" || pose === "smug") && lookAt ? lookAt : null, sipK: sipping ? sipK : 0 };
  for (const p of parts) { if (p.kind !== "puff") continue; const k = (now - p.t0) / p.life; if (k < 0 || k > 1) continue;
    ctx.strokeStyle = `rgba(235,230,255,${.75 * (1 - k)})`; ctx.lineWidth = 3 * S * (1 - k); ctx.beginPath(); ctx.arc(p.x + p.vx * k * p.life, p.y + p.vy * k * p.life, p.r * (.6 + k), 0, 7); ctx.stroke(); }
  if (darkT > 0 && now - darkT < .5) { const k = (now - darkT) / .5; ctx.strokeStyle = `rgba(235,230,255,${.6 * (1 - k)})`; ctx.lineWidth = 5 * S * (1 - k); ctx.beginPath(); ctx.ellipse(VX, DY - 1.9 * R, R * (1 + k * 1.2), R * (1.2 + k * 1.2), 0, 0, 7); ctx.stroke(); }
  drawVamp(o);
  // smoke + sparks + puffs (behind desk front, in front of him)
  for (const p of parts) { const k = (now - p.t0) / p.life; if (k < 0 || k > 1) continue;
    const x = p.x + p.vx * k * p.life, y = p.y + p.vy * k * p.life;
    if (p.kind === "smoke") { ctx.fillStyle = `rgba(110,108,122,${.38 * (1 - k)})`; ctx.beginPath(); ctx.arc(x + Math.sin(k * 6 + p.t0) * 6 * S, y, p.r * (1 + k * 1.4), 0, 7); ctx.fill(); }
  }
  drawDesk(); drawKeyboard(o); drawMug(o); drawArms(o);
  for (const p of parts) { const k = (now - p.t0) / p.life; if (k < 0 || k > 1 || p.kind !== "spark") continue;
    const x = p.x + p.vx * k * p.life, y = p.y + p.vy * k * p.life + 200 * S * k * k * p.life;
    ctx.strokeStyle = p.c; ctx.lineWidth = 3 * S * (1 - k); ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * .03, y - p.vy * .03); ctx.stroke(); }
  ctx.restore();
  drawTabs(); drawStatus();
  ctx.save(); ctx.translate(sx, sy); drawGrabArm(o); ctx.restore(); drawPadlock();
  drawToast();
  drawBubble(VX + 1.05 * R * scale, DY - 2.55 * R * scale);
  drawCursor(false);
  drawFlash();
  for (let i = parts.length - 1; i >= 0; i--) if (now - parts[i].t0 > parts[i].life + .1) parts.splice(i, 1);
  requestAnimationFrame(frame);
}
resize(); reset();
document.fonts && document.fonts.ready.then(resize);
requestAnimationFrame(frame);
</script>
