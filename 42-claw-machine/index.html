<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>lucky claw</title>
<meta name="description" content="A glowing claw machine full of plushies. The claw is weak. Except the third time. Free code by @sicscod.drops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@600;700&family=DM+Mono:wght@400;500&family=Silkscreen&display=block">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0b0c12;color:#f3ede2}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
.credit{position:fixed;left:0;right:0;bottom:12px;text-align:center;z-index:3;font:400 11px "DM Mono",ui-monospace,monospace;color:#7d8296;letter-spacing:.02em;text-shadow:0 1px 3px #000}
.credit a{color:#c8cbd8}
.pre{position:fixed;left:-999px;top:0;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="credit">free code by <a href="https://www.instagram.com/sicscod.drops/" target="_blank" rel="noopener">@sicscod.drops</a></div>
<span class="pre" style="font:20px Bungee">a</span><span class="pre" style="font:700 20px Caveat">a</span><span class="pre" style="font:500 20px 'DM Mono'">a</span><span class="pre" style="font:8px Silkscreen">a</span>
<script>
// ===== Claw Machine · free code by @sicscod.drops =====
// Send it: yoursite/?name=Delly   (drag to aim, tap to drop. the claw is weak... until the third try)
const P = new URLSearchParams(location.search);
const CONFIG = {
  name: P.get("name") || "Delly",              // written on the little sign the heart is holding
  msg: P.get("msg") || "you won: me",          // printed on the ticket ("label: big word")
  hue: P.has("hue") ? +P.get("hue") : 350,     // heart + neon colour, 0-360 (350 = cherry pink)
  rig: 3,                                      // the try that always wins
  fails: ["nooo", "so close…"],                // what you say when it drops the plush
  rogue: "wait…",                              // what you say when the claw picks for itself
  marquee: "LUCKY CLAW",
  speed: 1,                                    // claw speed (1 = arcade normal)
  sound: true
};

const cv = document.getElementById("c"), g = cv.getContext("2d");
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const ease = x => { x = clamp(x); return x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const spring = x => x <= 0 ? 0 : 1 - Math.exp(-6*x)*Math.cos(10*x);
const mix = (a, b, t) => a + (b - a)*t;
const TAU = Math.PI*2;
const hash = n => { const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };
const HUE = CONFIG.hue;

// machine is drawn in its own units: 360 wide, 520 tall
const MW = 360, MH = 520;
const GL = { x: 16, y: 64, w: 328, h: 296 };           // glass window
const RAIL = 74, REST = 84, CHUTE = { x: 22, y: 258, w: 72, h: 100 };
const DOOR = { x: 26, y: 400, w: 84, h: 62 }, SLOT = { x: 124, y: 404, w: 76 };
const JOY = { x: 256, y: 476 }, BTN = { x: 314, y: 475, r: 16 };
let W, H, DPR, k, ox, oy, bg;
let now = 0, last = 0;

function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  const availH = H - 44;
  k = Math.min(W*.95/MW, (availH - 14)/MH);
  ox = (W - MW*k)/2; oy = 10 + (availH - 10 - MH*k)/2;
  bg = paintBackground();
}
const toM = (x, y) => ({ x: (x - ox)/k, y: (y - oy)/k });

function paintBackground() {
  const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height;
  const x = c.getContext("2d"); x.scale(DPR, DPR);
  const sky = x.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0a0b11"); sky.addColorStop(.7, "#0f0e16"); sky.addColorStop(1, "#16121a");
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  // other machines, out of focus
  const blobs = [[.08, .22, 170, "rgba(64,190,180,.16)"], [.95, .3, 190, `hsla(${HUE},80%,60%,.13)`], [.2, .7, 140, "rgba(240,170,70,.10)"], [.9, .75, 150, "rgba(90,140,255,.09)"], [.5, .05, 220, "rgba(255,220,180,.05)"]];
  for (const [bx, by, r, col] of blobs) {
    const gr = x.createRadialGradient(bx*W, by*H, 0, bx*W, by*H, r);
    gr.addColorStop(0, col); gr.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = gr; x.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < 26; i++) {
    const bx = hash(i)*W, by = hash(i + 40)*H*.8, r = 3 + hash(i + 80)*9;
    if (Math.abs(bx - W/2) < MW*k*.45 && by > oy) continue;
    x.fillStyle = `hsla(${[175, HUE, 38, 220][i % 4]},80%,70%,${.05 + hash(i + 9)*.09})`;
    x.beginPath(); x.arc(bx, by, r, 0, TAU); x.fill();
  }
  // floor
  const fy = oy + MH*k;
  const fl = x.createLinearGradient(0, fy - 20, 0, H);
  fl.addColorStop(0, "rgba(30,24,34,0)"); fl.addColorStop(.2, "#16131c"); fl.addColorStop(1, "#0c0b10");
  x.fillStyle = fl; x.fillRect(0, fy - 20, W, H);
  const pool = x.createRadialGradient(W/2, fy, 0, W/2, fy, MW*k*.8);
  pool.addColorStop(0, "rgba(120,220,200,.16)"); pool.addColorStop(1, "rgba(120,220,200,0)");
  x.save(); x.translate(W/2, fy); x.scale(1, .25); x.translate(-W/2, -fy); x.fillStyle = pool; x.fillRect(0, fy - MW*k, W, MW*k*2); x.restore();
  return c;
}

// ---------- plushies ----------
const KINDS = {
  bear:  { c: "#c9925c", d: "#a8733f", in: "#e8c39a" },
  bunny: { c: "#f2e7e2", d: "#d9c6c0", in: "#f4b5c0" },
  chick: { c: "#f6cd47", d: "#dfae22", in: "#f39a3a" },
  frog:  { c: "#8cc56a", d: "#6aa24b", in: "#f2f0d8" },
  cat:   { c: "#a3abbf", d: "#848ca2", in: "#f2bcc4" },
  ginger:{ c: "#e9a15a", d: "#c97f3a", in: "#f6cfa8" },
  heart: { c: `hsl(${HUE},78%,62%)`, d: `hsl(${HUE},70%,46%)`, in: "#fff" }
};
const PILE = [ // kind, x, y, rot, radius, grabbable
  ["cat", 334, 330, .3, 26], ["bunny", 114, 332, -.2, 26], ["frog", 162, 334, .15, 27], ["ginger", 210, 331, -.1, 26],
  ["chick", 256, 334, .2, 25], ["bear", 298, 331, -.25, 27],
  ["chick", 134, 302, -.3, 24], ["cat", 320, 296, .2, 25], ["frog", 240, 300, -.2, 25], ["bunny", 186, 297, .25, 25],
  ["bear", 205, 262, .05, 27, 1], ["bunny", 142, 268, -.15, 26, 1], ["chick", 252, 270, .25, 23, 1], ["heart", 282, 258, .08, 29, 1]
];
let toys, claw, tries, busy, seq, bubbles, fx, confetti, led, prize, ticket, finale, drag, joyTilt, chaseFast, flash, shake;
function reset() {
  toys = PILE.map((p, i) => ({ id: i, kind: p[0], x: p[1], y: p[2], rot: p[3], r: p[4], grab: !!p[5], hx: p[1], hy: p[2], hr: p[3], face: "calm", faceT: 0, mode: "rest", vy: 0, vx: 0, vr: 0, jig: 0, hidden: false }));
  claw = { x: 205, y: REST, open: .25, aim: 205, held: null, wob: 0 };
  tries = 0; busy = false; seq = []; bubbles = []; fx = []; confetti = []; flash = 0; shake = 0;
  led = { text: `TRY 1 OF ${CONFIG.rig}`, t: now, blink: false };
  prize = null; ticket = null; finale = null; drag = null; joyTilt = 0; chaseFast = 0;
}

// a tiny timeline: each step runs for d seconds with u = 0..1
function run(steps) { seq = steps.map(s => ({ ...s })); seq.t0 = now; busy = true; }
function tickSeq() {
  while (seq.length) {
    const s = seq[0];
    if (s.start === undefined) s.start = now;
    if (!s.began) { s.began = true; s.begin && s.begin(); }
    const d = (s.d || 0)*1000/CONFIG.speed, u = d ? clamp((now - s.start)/d) : 1;
    s.f && s.f(u);
    if (u < 1) return;
    s.end && s.end(); seq.shift();
    if (seq.length) seq[0].start = s.start + d;     // keep exact timing
  }
  busy = false;
}

// ---------- sound ----------
let AC = null;
function sfx(kind) {
  if (!CONFIG.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), v = AC.createGain();
    o.connect(v); v.connect(AC.destination);
    const set = (f0, f1, d, gain, type) => { o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); v.gain.setValueAtTime(gain, t); v.gain.exponentialRampToValueAtTime(.0001, t + d); o.start(t); o.stop(t + d + .02); };
    if (kind === "drop") set(300, 160, .3, .06, "square");
    if (kind === "clunk") set(140, 70, .12, .12, "triangle");
    if (kind === "nooo") set(620, 180, .7, .07, "triangle");
    if (kind === "win") set(523, 1568, .7, .07, "square");
    if (kind === "tick") set(1800, 1500, .03, .03, "square");
  } catch (e) {}
}

// ---------- the game ----------
function nearestToy(x) {
  let best = null, bd = 1e9;
  for (const t of toys) { if (!t.grab || t.hidden || t.kind === "heart" || t.mode !== "rest") continue; const d = Math.abs(t.x - x); if (d < bd) { bd = d; best = t; } }
  return best;
}
const heartToy = () => toys.find(t => t.kind === "heart");
const CS = 1.3;                                  // claw size
const grabY = t => t.y - t.r - 15*CS;
function say(s, x, y, hot) { bubbles.push({ s, x, y, t: now, hot }); }
function setLed(text, blink) { led = { text, t: now, blink: !!blink }; }

function drop() {
  if (busy || finale) return;
  tries++;
  const rigged = tries >= CONFIG.rig;
  const target = rigged ? heartToy() : nearestToy(claw.x);
  if (!target) return;
  sfx("drop");
  const steps = [];
  let y0, x0;
  if (rigged) {
    setLed("???");
    steps.push({ d: .12 });
    steps.push({ d: .2 + Math.abs(target.x - claw.x)/650, begin() { x0 = claw.x; say(CONFIG.rogue, claw.x + 30, 118); shake = .5; }, f(u) { claw.x = mix(x0, target.x, ease(u)); claw.wob = Math.sin(u*TAU*2)*.08; },
      end() { setLed("RIGGED!", true); } });
  } else setLed(`TRY ${tries} OF ${CONFIG.rig}`);
  steps.push({ d: .38, begin() { y0 = claw.y; }, f(u) { claw.y = mix(y0, grabY(target), ease(u)); claw.open = mix(.25, 1, clamp(u*3)); } });
  steps.push({ d: .2, begin() { x0 = target.x; }, f(u) { claw.open = mix(1, rigged ? .1 : .3, easeOut(u)); target.x = mix(x0, claw.x, easeOut(u)); target.rot = mix(target.hr, 0, u); },
    end() { claw.held = target; target.mode = "held"; target.face = rigged ? "happy" : "calm"; sfx("clunk"); } });
  if (rigged) {
    steps.push({ d: .38, begin() { y0 = claw.y; for (let i = 0; i < 10; i++) sparkle(claw.x, claw.y + 40); }, f(u) { claw.y = mix(y0, REST + 6, ease(u)); } });
    steps.push({ d: .2 + Math.abs(claw.x - (CHUTE.x + CHUTE.w/2))/700, begin() { x0 = claw.x; }, f(u) { claw.x = mix(x0, CHUTE.x + CHUTE.w/2, ease(u)); claw.wob = Math.sin(u*Math.PI)*.12; } });
    steps.push({ d: .16, f(u) { claw.open = mix(.1, 1, easeOut(u)); }, end() { release(claw.held, CHUTE.x + CHUTE.w/2, CHUTE.y + CHUTE.h - 22, 0, true); claw.held = null; } });
    steps.push({ d: .32 });
    steps.push({ d: 0, end() { popPrize(); } });
    steps.push({ d: .5, begin() { x0 = claw.x; y0 = claw.y; }, f(u) { claw.x = mix(x0, 205, ease(u)); claw.open = mix(1, .25, u); } });
  } else if (tries % 2 === 1) {                       // fail 1: it slips out while lifting
    steps.push({ d: .2, begin() { y0 = claw.y; }, f(u) { claw.y = mix(y0, y0 - 34, ease(u)); } });
    steps.push({ d: 0, end() {
      const t = claw.held; claw.held = null; claw.open = .55; release(t, t.hx, t.hy, t.hr);
      t.face = "shock"; t.faceT = now; say(CONFIG.fails[0], t.x + (t.x > 180 ? -54 : 54), t.y - 46, true); setLed("NOOOOO", true); sfx("nooo"); shake = 1;
    } });
    steps.push({ d: .5, begin() { y0 = claw.y; }, f(u) { claw.y = mix(y0, REST, ease(u)); claw.open = mix(.55, .25, u); } });
    steps.push({ d: .25, end() { setLed(`TRY ${tries + 1} OF ${CONFIG.rig}`); } });
  } else {                                            // fail 2: drops it on the way to the chute
    const cx = CHUTE.x + CHUTE.w/2;
    steps.push({ d: .4, begin() { y0 = claw.y; }, f(u) { claw.y = mix(y0, REST + 6, ease(u)); } });
    steps.push({ d: .36, begin() { x0 = claw.x; }, f(u) { claw.x = mix(x0, x0 + (cx - x0)*.5, ease(u)*.9 + u*.1); claw.wob = Math.sin(u*Math.PI)*.1; } });
    steps.push({ d: 0, end() {
      const t = claw.held; claw.held = null; claw.open = .7;
      const lx = CHUTE.x + CHUTE.w + 16, ly = 300;
      t.hx = lx; t.hy = ly; t.hr = -.5; release(t, lx, ly, -.5);
      t.face = "shock"; t.faceT = now; say(CONFIG.fails[1], lx + 70, t.y + 30, true); setLed("SO CLOSE", true); sfx("nooo"); shake = 1;
    } });
    steps.push({ d: .2 });
    steps.push({ d: .45, begin() { x0 = claw.x; }, f(u) { claw.x = mix(x0, claw.aim, ease(u)); claw.open = mix(.7, .25, u); } });
    steps.push({ d: .1, end() { setLed(`TRY ${tries + 1} OF ${CONFIG.rig}`); } });
  }
  steps.push({ d: 0, end() { claw.aim = claw.x; } });
  run(steps);
}
function release(t, lx, ly, lr, intoChute) {
  t.mode = "fall"; t.vy = 0; t.vx = (lx - t.x)*1.6; t.vr = (lr - t.rot)*2.4; t.land = { x: lx, y: ly, r: lr }; t.chute = !!intoChute; t.bounces = 0;
}
function sparkle(x, y) {
  const a = Math.random()*TAU, s = 30 + Math.random()*90;
  fx.push({ x: x + Math.cos(a)*10, y: y + Math.sin(a)*10, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 30, t: now, life: 700 + Math.random()*500 });
}
function popPrize() {
  const h = heartToy(); h.hidden = true;
  prize = { t: now };
  finale = { t: now };
  setLed("WINNER! WINNER!", true); sfx("win"); chaseFast = 1; flash = 1; shake = 1.4;
  burst(DOOR.x + DOOR.w/2, DOOR.y + 10, 70, 1);
}
function burst(x, y, n, up) {
  const cols = [`hsl(${HUE},85%,64%)`, "#ffe08a", "#7fe0cf", "#fff6ea", `hsl(${HUE + 30},90%,72%)`, "#8fb4ff"];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (Math.random() - .5)*2.4*up, s = 160 + Math.random()*320;
    confetti.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, rot: Math.random()*TAU, vr: (Math.random() - .5)*14, c: cols[i % cols.length], w: 3 + Math.random()*4, h: 5 + Math.random()*5, heart: i % 7 === 0, t: now, ph: Math.random()*TAU });
  }
}

// ---------- input ----------
cv.addEventListener("pointerdown", e => {
  const m = toM(e.clientX, e.clientY);
  if (finale) { if (now - finale.t > 2500) reset(); return; }
  const onGlass = m.x > GL.x && m.x < GL.x + GL.w && m.y > GL.y - 30 && m.y < GL.y + GL.h;
  const onJoy = Math.hypot(m.x - JOY.x, m.y - JOY.y) < 40;
  drag = { x0: m.x, y0: m.y, cx0: claw.x, glass: onGlass, joy: onJoy, moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const m = toM(e.clientX, e.clientY);
  if (Math.hypot(m.x - drag.x0, m.y - drag.y0) > 7) drag.moved = true;
  if (!drag.moved || busy) return;
  claw.x = clamp(drag.glass ? m.x : drag.cx0 + (m.x - drag.x0)*1.8, 40, 322); claw.aim = claw.x;
});
function up() {
  if (!drag) return;
  if (!drag.moved) drop();
  drag = null;
}
cv.addEventListener("pointerup", up);
cv.addEventListener("pointercancel", () => drag = null);
addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") drop(); if (!busy && e.key === "ArrowLeft") claw.aim = claw.x = clamp(claw.x - 12, 40, 322); if (!busy && e.key === "ArrowRight") claw.aim = claw.x = clamp(claw.x + 12, 40, 322); });

// ---------- update ----------
let prevClawX = 205;
function update(dt) {
  tickSeq();
  const vx = (claw.x - prevClawX)/Math.max(dt, .001); prevClawX = claw.x;
  joyTilt = mix(joyTilt, clamp(vx/260, -1, 1), clamp(dt*12));
  claw.wob *= Math.pow(.02, dt);
  for (const t of toys) {
    if (t.mode === "held") { t.x = claw.x; t.y = claw.y + 16*CS + t.r*.85; t.rot = Math.sin(now*.012)*.06 + claw.wob; }
    if (t.mode === "fall") {
      t.vy += 1500*dt; t.y += t.vy*dt; t.x = mix(t.x, t.land.x, clamp(dt*5)); t.rot += t.vr*dt;
      if (t.y >= t.land.y) {
        t.y = t.land.y;
        if (t.chute) { t.mode = "chuted"; sfx("clunk"); continue; }
        if (t.vy > 200 && t.bounces < 2) { t.vy = -t.vy*.32; t.bounces++; t.vr *= -.5; sfx("clunk"); for (const o of toys) if (o !== t && Math.hypot(o.x - t.x, o.y - t.y) < 60) o.jig = 1; }
        else { t.mode = "rest"; t.x = t.land.x; t.rot = t.land.r; t.vy = 0; }
      }
    }
    if (t.face !== "calm" && t.face !== "happy" && now - t.faceT > 1600) t.face = "calm";
    t.jig *= Math.pow(.01, dt);
  }
  for (const f of fx) { f.vy += 120*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= .97; }
  fx = fx.filter(f => now - f.t < f.life);
  for (const c of confetti) { c.vy += 520*dt; c.vx *= Math.pow(.25, dt); c.vy = Math.min(c.vy, 150 + Math.sin(now*.004 + c.ph)*40); c.x += (c.vx + Math.sin(now*.003 + c.ph)*30)*dt; c.y += c.vy*dt; c.rot += c.vr*dt; }
  confetti = confetti.filter(c => c.y < MH + 140);
  bubbles = bubbles.filter(b => now - b.t < 1500);
  if (rigBurstAt && now > rigBurstAt) { burst(180, 250, 60, 2.6); rigBurstAt = 0; }
  flash *= Math.pow(.05, dt); shake *= Math.pow(.02, dt);
  if (prize && !ticket && now - prize.t > 260) { ticket = { t: now, ticks: 0 }; }
  if (ticket) { const n = Math.floor(clamp((now - ticket.t)/700)*14); while (ticket.ticks < n) { ticket.ticks++; sfx("tick"); } }
}
let rigBurstAt = 0;

// ---------- drawing ----------
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function heartPath(cx, cy, s) {
  g.beginPath(); g.moveTo(cx, cy + s*.42);
  g.bezierCurveTo(cx - s*1.05, cy - s*.2, cx - s*.5, cy - s*1.0, cx, cy - s*.45);
  g.bezierCurveTo(cx + s*.5, cy - s*1.0, cx + s*1.05, cy - s*.2, cx, cy + s*.42);
  g.closePath();
}
const INK = "#3a2422";
function face(R, kind, fc, cy) {
  g.fillStyle = INK; g.strokeStyle = INK; g.lineCap = "round"; g.lineWidth = 1.4;
  const ex = R*.26, ey = cy;
  if (fc === "shock") {
    for (const s of [-1, 1]) { g.fillStyle = "#fff"; g.beginPath(); g.arc(s*ex, ey, R*.15, 0, TAU); g.fill(); g.lineWidth = 1.1; g.stroke(); g.fillStyle = INK; g.beginPath(); g.arc(s*ex, ey + .5, R*.07, 0, TAU); g.fill(); }
    g.beginPath(); g.ellipse(0, ey + R*.33, R*.09, R*.12, 0, 0, TAU); g.fill();
  } else if (fc === "happy") {
    g.lineWidth = 1.6;
    for (const s of [-1, 1]) { g.beginPath(); g.arc(s*ex, ey + R*.05, R*.11, Math.PI*1.1, Math.PI*1.9); g.stroke(); }
    g.beginPath(); g.arc(0, ey + R*.16, R*.13, Math.PI*.15, Math.PI*.85); g.stroke();
  } else {
    const blink = (now + R*300) % 4200 < 110;
    for (const s of [-1, 1]) {
      if (blink) { g.beginPath(); g.moveTo(s*ex - 2, ey); g.lineTo(s*ex + 2, ey); g.stroke(); }

  g.strokeStyle = "#2a2d36"; g.lineWidth = 4; g.lineCap = "round"; g.beginPath(); g.moveTo(JOY.x, JOY.y + 2); g.lineTo(jx, jy); g.stroke();
  const kg = g.createRadialGradient(jx - 3, jy - 4, 1, jx, jy, 10); kg.addColorStop(0, `hsl(${HUE},90%,80%)`); kg.addColorStop(1, `hsl(${HUE},75%,48%)`);
  g.fillStyle = kg; g.strokeStyle = "#2a2d36"; g.lineWidth = 1.2; g.beginPath(); g.arc(jx, jy, 9, 0, TAU); g.fill(); g.stroke();
  // big button
  const pressed = busy && now - (seq.t0 || 0) < 180;
  g.fillStyle = "#1b1d24"; g.beginPath(); g.ellipse(BTN.x, BTN.y + 3, BTN.r + 3, (BTN.r + 3)*.5, 0, 0, TAU); g.fill();
  const by = BTN.y - (pressed ? 0 : 4);
  g.fillStyle = `hsl(${HUE},70%,40%)`; g.beginPath(); g.ellipse(BTN.x, by + 3, BTN.r, BTN.r*.5, 0, 0, TAU); g.fill();
  g.fillRect(BTN.x - BTN.r, by, BTN.r*2, 3);
  const bgd = g.createRadialGradient(BTN.x - 5, by - 4, 1, BTN.x, by, BTN.r); bgd.addColorStop(0, `hsl(${HUE},95%,78%)`); bgd.addColorStop(1, `hsl(${HUE},80%,55%)`);
  g.fillStyle = bgd; g.strokeStyle = "#2a2d36"; g.lineWidth = 1.2; g.beginPath(); g.ellipse(BTN.x, by, BTN.r, BTN.r*.5, 0, 0, TAU); g.fill(); g.stroke();
  if (!busy && !finale) { g.fillStyle = `hsla(${HUE},100%,70%,${.15 + .12*Math.sin(now*.006)})`; g.beginPath(); g.ellipse(BTN.x, by, BTN.r + 6, BTN.r*.5 + 4, 0, 0, TAU); g.fill(); }
  g.fillStyle = "#173a36"; g.font = "7px Silkscreen"; g.textAlign = "center"; g.fillText("DROP", BTN.x, 496); g.fillText("MOVE", JOY.x, 496);
}
function star(x, y, r) { g.beginPath(); for (let i = 0; i < 8; i++) { const a = i/8*TAU, rr2 = i % 2 ? r*.35 : r; g.lineTo(x + Math.cos(a)*rr2, y + Math.sin(a)*rr2); } g.fill(); }

function drawBubbles() {
  for (const b of bubbles) {
    const age = now - b.t, s = spring(age/420)*clamp((1500 - age)/200);
    g.save(); g.translate(b.x, b.y); g.scale(s, s); g.rotate(b.hot ? -.08 : .05);
    g.font = "700 26px Caveat, cursive"; const tw = g.measureText(b.s).width;
    g.fillStyle = "#fffaf0"; g.strokeStyle = INK; g.lineWidth = 1.6;
    rr(-tw/2 - 12, -18, tw + 24, 34, 16); g.fill(); g.stroke();
    g.fillStyle = b.hot ? `hsl(${HUE},65%,42%)` : INK; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(b.s, 0, 0);
    g.restore();
  }
}

function drawTicket() {
  if (!ticket) return;
  const L = 96*easeOut(clamp((now - ticket.t)/700)), w = SLOT.w - 8, x = SLOT.x + 4, y = SLOT.y + 4;
  const pres = ease((now - ticket.t - 760)/420);         // printed: it tears off and comes to the front
  const sway = Math.sin(now*.003)*.02*clamp(L/96);
  g.save(); g.translate(mix(x + w/2, MW/2 + 6, pres), mix(y, 338, pres)); g.rotate(mix(sway, -.06 + Math.sin(now*.002)*.015, pres)); g.scale(mix(1, 1.55, pres), mix(1, 1.55, pres));
  if (pres > 0) { g.fillStyle = `rgba(0,0,0,${.3*pres})`; g.fillRect(-w/2 + 3, 4, w, 96); }
  if (pres <= 0) { g.beginPath(); g.rect(-w/2 - 2, 0, w + 4, L + 2); g.clip(); }
  g.translate(0, L - 96);
  g.fillStyle = "#fdf6e6"; g.strokeStyle = "rgba(58,36,34,.6)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-w/2, 0); g.lineTo(w/2, 0); g.lineTo(w/2, 96);
  for (let i = 0; i <= 8; i++) g.lineTo(w/2 - i*w/8, 96 + (i % 2 ? 3 : 0));
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = `hsl(${HUE},70%,55%)`; g.fillRect(-w/2, 6, w, 3); g.fillRect(-w/2, 86, w, 3);
  const [lab, big] = CONFIG.msg.includes(":") ? [CONFIG.msg.split(":")[0].trim() + ":", CONFIG.msg.split(":").slice(1).join(":").trim()] : ["", CONFIG.msg];
  g.fillStyle = "#3a2422"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "6px Silkscreen"; g.fillText("ADMIT ONE", 0, 16);
  g.font = "500 9px 'DM Mono', monospace"; g.fillText(lab.toUpperCase(), 0, 34);
  let fs = 34; g.font = `700 ${fs}px Caveat, cursive`; const bw = g.measureText(big).width; if (bw > w - 8) { fs *= (w - 8)/bw; g.font = `700 ${fs}px Caveat, cursive`; }
  g.fillStyle = `hsl(${HUE},65%,42%)`; g.fillText(big, 0, 60);
  g.fillStyle = "#3a2422"; g.font = "6px Silkscreen"; g.fillText("NO REFUNDS", 0, 79);
  g.restore();
}

function drawPrize() {
  if (!prize) return;
  const age = (now - prize.t)/1000;
  const dim = .58*easeOut(age/.5);
  g.fillStyle = `rgba(8,6,12,${dim})`; g.fillRect(-ox/k - 10, -oy/k - 10, W/k + 20, H/k + 20);
  const u = clamp(age/.6), arc = Math.sin(u*Math.PI)*60;
  const x = mix(DOOR.x + DOOR.w/2, MW/2 - 14, easeOut(u)), y = mix(DOOR.y + 20, 200, easeOut(u)) - arc;
  const sc = mix(.8, 2.35, spring(age/.75)), rot = Math.sin(age*3)*.06*(1 + clamp(1 - age));
  const h = heartToy();
  // glow behind
  const gl = g.createRadialGradient(x, y, 0, x, y, 120*clamp(age*2)); gl.addColorStop(0, `hsla(${HUE},90%,65%,.45)`); gl.addColorStop(1, `hsla(${HUE},90%,65%,0)`);
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, 140, 0, TAU); g.fill();
  // rays
  g.save(); g.translate(x, y); g.rotate(age*.4); g.fillStyle = `hsla(45,100%,85%,${.08*clamp(age*2)})`;
  for (let i = 0; i < 12; i++) { g.rotate(TAU/12); g.beginPath(); g.moveTo(0, 0); g.lineTo(170, -14); g.lineTo(170, 14); g.fill(); }
  g.restore();
  drawToy(h, x, y + Math.sin(age*2.2)*3, rot, sc, "happy");
}
function drawConfetti() {
  for (const c of confetti) {
    g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.fillStyle = c.c;
    if (c.heart) { heartPath(0, 0, 5); g.fill(); } else { g.scale(1, Math.cos(now*.01 + c.ph)); g.fillRect(-c.w/2, -c.h/2, c.w, c.h); }
    g.restore();
  }
}

function frame(t) {
  now = t; const dt = Math.min(.05, (t - last)/1000 || 0); last = t;
  if (prize && !prize.b2 && now - prize.t > 520) { prize.b2 = true; burst(MW/2 - 14, 195, 90, 2.8); }
  update(dt);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.drawImage(bg, 0, 0, W, H);
  const sh = shake > .02 ? Math.sin(now*.09)*shake*2.2 : 0;
  g.setTransform(DPR*k, 0, 0, DPR*k, DPR*(ox + sh), DPR*oy);
  // machine glow on the wall
  const halo = g.createRadialGradient(MW/2, 200, 40, MW/2, 200, 340); halo.addColorStop(0, "rgba(127,218,200,.16)"); halo.addColorStop(1, "rgba(127,218,200,0)");
  g.fillStyle = halo; g.fillRect(-200, -200, MW + 400, MH + 300);
  drawMachine();
  drawBubbles();
  drawPrize();
  drawTicket();
  drawConfetti();
  // hint under the machine on tall screens
  const space = H - (oy + MH*k) - 40;
  if (space > 26 && !finale) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.font = "500 11px 'DM Mono', monospace"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "rgba(220,224,235,.5)";
    g.fillText("drag to aim  ·  tap to drop", W/2, oy + MH*k + Math.min(space, 60)*.55 + 4);
  }
  if (finale && now - finale.t > 2500) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const a = clamp((now - finale.t - 2500)/600)*(.55 + .2*Math.sin(now*.004));
    g.font = "500 11px 'DM Mono', monospace"; g.textAlign = "center"; g.fillStyle = `rgba(230,232,240,${a})`;
    g.fillText("tap to play again", W/2, H - 34);
  }
  requestAnimationFrame(frame);
}
addEventListener("resize", layout);
layout(); reset();
requestAnimationFrame(frame);
</script>
