  pix(g, HEART, x + w - 62, y + 36, 3.4, { X: H(60, 85) }); floppy(g, x + w - 44, y + 52, 2);
  fr(g, "#808080", x + 3, y + 83, w - 6, 1); fr(g, "#fff", x + 3, y + 84, w - 6, 1);

  const pct = Math.floor(p * 100 + 1e-6);

  if (doneT >= 0) st = "Done."; else if (stuckT >= 0 && dropT < 0) st = "waiting for " + CONFIG.missing + ".".repeat(1 + Math.floor(now * 3) % 3);
  txt(g, st, x + 17, y + 104, F.vt(19), "#111");

  fr(g, "#fff", x + 16, y + 110, w - 32, 22); bevel(g, x + 16, y + 110, w - 32, 22, true);
  const N = 34, bw = (w - 38 - (N - 1) * 2) / N, n = Math.floor(p * N + 1e-6);
  for (let i = 0; i < N; i++) {

    if (on) fr(g, i === N - 1 && p >= 1 ? H(52, 85) : H(46, 72), x + 19 + i * (bw + 2), y + 113, bw, 16);
  }

  const LX = x + 16, LY = y + 140, LW = w - 32, LH = 110, RH = 17.5;

  g.save(); g.beginPath(); g.rect(LX + 2, LY + 2, LW - 4, LH - 4); g.clip();
  for (let i = 0; i < logL.length; i++) {
    const L = logL[i], yy = LY + 18 + i * RH - scroll, a = clamp((now - L.t) / .06, 0, 1);
    if (yy < LY - RH || yy > LY + LH + RH) continue;

    if (L.err) { fr(g, "rgba(212,32,47,.12)", LX + 2, yy - 13, LW - 4, RH); txt(g, "ERROR  " + L.s, LX + 9, yy, F.vt(18), "#c0182a"); }
    else { txt(g, "> " + L.s, LX + 9, yy, F.vt(18), "#222"); if (L.ok) txt(g, "OK", LX + LW - 10, yy, F.vt(18), "#1d8a45", "right"); }
  }

  button(g, x + 274, y + 262, 72, 26, doneT >= 0 ? "Finish" : "Next >", { off: doneT < 0, def: doneT >= 0, focus: doneT >= 0 });
  button(g, x + 356, y + 262, 68, 26, "Cancel", { down: now - nopeT < .12 });
}
function drawError() {
  if (!errOpen()) return;
  const a = now - errT, k = dropT >= 0 ? 1 - clamp((now - dropT) / .16, 0, 1) : 1;
  const sc = (.7 + .3 * outBack(a / .22)) * (.6 + .4 * k), x = 60, y = 140, w = 320, h = 150;
  ctx.save(); ctx.translate(220, 215); ctx.scale(sc, sc); ctx.translate(-220, -215); ctx.globalAlpha = clamp(a / .06, 0, 1) * k;
  fr(ctx, "rgba(0,0,0,.35)", x + 5, y + 6, w, h);
  fr(ctx, "#c3c3c3", x, y, w, h); bevel(ctx, x, y, w, h, false); titleBar(ctx, x + 3, y + 3, w - 6, "love.exe", false);
  errIcon(ctx, x + 32, y + 52);
  txt(ctx, "missing file: " + CONFIG.missing, x + 58, y + 50, F.px(700, 16), "#111");
  txt(ctx, "can't finish without it. drag it in.", x + 58, y + 69, F.vt(18), "#333");
  const over = drag && drag.moved && (inR({ x: drag.x, y: drag.y }, WIN) || inR({ x: drag.x, y: drag.y }, { x, y, w, h }));
  const S2 = SLOT; fr(ctx, over ? H(92, 90) : "#d4d4d4", S2.x, S2.y, S2.w, S2.h);
  ctx.strokeStyle = over ? H(45, 75) : "#6b6b6b"; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -now * 18;
  ctx.strokeRect(S2.x + .5, S2.y + .5, S2.w - 1, S2.h - 1); ctx.setLineDash([]);
  if (!fly) {
    ctx.globalAlpha *= .45; ctx.strokeStyle = "#555"; ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
    ctx.strokeRect(S2.x + 22, S2.y + 10, 22, 30); ctx.setLineDash([]); ctx.globalAlpha /= .45;
  }
  txt(ctx, over ? "yes. right there." : "drop " + CONFIG.missing + " here", S2.x + 58, S2.y + 31, F.vt(20), over ? H(32, 70) : "#444");
  ctx.restore();
}
function drawIcons() {
  const bw = Math.exp(-(now - binHit) * 6) * Math.sin((now - binHit) * 30) * .18 * (now > binHit ? 1 : 0);
  binIcon(ctx, BIN.x, BIN.y - 4, exT >= 0 && now > exT + .55, bw); label(ctx, "Recycle Bin", BIN.x, BIN.y + 42);
  if (!iconGone && !drag) {
    const hop = errT >= 0 ? Math.abs(Math.sin((now - errT) * 5.2)) * 7 * (Math.floor((now - errT) * 5.2 / Math.PI) % 3 < 2 ? 1 : 0) : 0;
    if (errT >= 0) { ctx.strokeStyle = H(80, 90); ctx.lineWidth = 1; ctx.setLineDash([2, 2]); ctx.strokeRect(ICON.x - 30.5, ICON.y - 26.5, 61, 76); ctx.setLineDash([]); }
    fileIcon(ctx, ICON.x, ICON.y - hop);
    if (errT >= 0) { fr(ctx, H(38, 70), ICON.x - 30, ICON.y + 32, 60, 17); txt(ctx, CONFIG.missing, ICON.x, ICON.y + 45, F.vt(18), "#fff", "center"); }
    else label(ctx, CONFIG.missing, ICON.x, ICON.y + 45);
  } else if (drag) { ctx.globalAlpha = .35; fileIcon(ctx, ICON.x, ICON.y); ctx.globalAlpha = 1; }
  if (exT >= 0 && now < exT + .6) {            // ex.dll flies into the bin
    const u = clamp((now - exT) / .55, 0, 1), x = 150 + (BIN.x - 150) * u, y = 215 + (BIN.y - 30 - 215) * u - Math.sin(u * Math.PI) * 120;
    ctx.save(); ctx.translate(x, y); ctx.rotate(u * 5); ctx.scale(1 - u * .45, 1 - u * .45);
    fr(ctx, "#fff", -11, -14, 22, 28); ctx.strokeStyle = "#222"; ctx.lineWidth = 1; ctx.strokeRect(-11, -14, 22, 28);
    txt(ctx, "ex", 0, 0, F.vt(15), "#c0182a", "center"); txt(ctx, ".dll", 0, 10, F.vt(13), "#555", "center"); ctx.restore();
  }
}
function drawDragged() {
  if (drag && drag.moved) {
    ctx.save(); ctx.translate(drag.x - drag.dx, drag.y - drag.dy); ctx.rotate(clamp(drag.vx * .02, -.3, .3));
    fr(ctx, "rgba(0,0,0,.25)", -13, -16, 32, 42); fileIcon(ctx, 0, 0, 1.08); ctx.restore();
  }
  if (fly) {
    const u = clamp((now - fly.t0) / fly.dur, 0, 1), e = inOut(u), sh = fly.then === accept ? 1 - .55 * e : 1;
    const x = fly.x0 + (fly.x1 - fly.x0) * e, y = fly.y0 + (fly.y1 - fly.y0) * e - Math.sin(u * Math.PI) * (fly.dur > .4 ? 60 : 10);
    fileIcon(ctx, x, y, sh * 1.05);

}
function drawCell(c, x, y, w, h, rot, tint, col, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
  if (tint < 1) ctx.drawImage(snap, c.sx * S * DPR, c.sy * S * DPR, c.cw * S * DPR, c.ch * S * DPR, -w / 2, -h / 2, w, h);
  if (tint > 0) { ctx.globalAlpha = alpha * tint; fr(ctx, col, -w / 2, -h / 2, w, h); }
  ctx.restore();
}
function heartScale() {
  if (heartT < 0) return 1;
  const u = now - heartT, pop = 1 + .24 * Math.sin(u * 15) * Math.exp(-u * 6);
  const running = runT >= 0, per = running ? .6 : 1.05, ph = (u % per) / per;
  const beat = (running ? .09 : .05) * (Math.exp(-(((ph - .04) / .045) ** 2)) + .6 * Math.exp(-(((ph - .22) / .045) ** 2)));
  return pop * (1 + (u > .45 ? beat : 0));
}
function drawHeart() {
  const u = now - breakT;
  const gap = clamp(u / .08, 0, 1) * 1.4;
  for (const s of shards) {        // the rest of the window flies apart
    const t = u - s.d; if (t < 0) { drawCell(s, s.x, s.y, s.cw - gap, s.ch - gap, 0, 0); continue; }
    const a = 1 - clamp((t - .45) / .5, 0, 1); if (a <= 0) continue;
    drawCell(s, s.x + s.vx * t, s.y + s.vy * t + 900 * t * t, (s.cw - gap) * (1 - t * .3), (s.ch - gap) * (1 - t * .3), s.vr * t, clamp(t * 2, 0, .5), "#c3c3c3", a);
  }
  const hs = heartScale();
  ctx.save(); ctx.translate(HEART_C.x, HEART_C.y); ctx.scale(hs, hs); ctx.translate(-HEART_C.x, -HEART_C.y);
  if (heartT >= 0) { ctx.globalAlpha = .22 + .12 * (hs - 1) * 6; const rg = ctx.createRadialGradient(HEART_C.x, HEART_C.y, 10, HEART_C.x, HEART_C.y, 150); rg.addColorStop(0, H(70, 90)); rg.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = rg; ctx.fillRect(HEART_C.x - 160, HEART_C.y - 160, 320, 320); ctx.globalAlpha = 1; }
  for (const c of cells) {
    const t = clamp((u - c.d) / .5, 0, 1), e = inOut(t);
    const x = c.x0 + (c.x1 - c.x0) * e, y = c.y0 + (c.y1 - c.y0) * e - Math.sin(t * Math.PI) * 26;
    const w = (c.cw + (CELL - c.cw) * e) - gap * (1 - e) - .9 * e, h = (c.ch + (CELL - c.ch) * e) - gap * (1 - e) - .9 * e;
    drawCell(c, x, y, w, h, c.rot * Math.sin(t * Math.PI), sm((t - .05) / .6), c.col);
  }
  ctx.restore();
}
function drawCard() {
  if (heartT < 0) return;
  const a = now - heartT - .45; if (a < 0) return;
  const { x, y, w, h } = CARD, sc = .75 + .25 * outBack(a / .3);
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(sc, sc); ctx.translate(-x - w / 2, -y - h / 2); ctx.globalAlpha = clamp(a / .08, 0, 1);
  fr(ctx, "rgba(0,0,0,.35)", x + 5, y + 6, w, h);
  fr(ctx, "#c3c3c3", x, y, w, h); bevel(ctx, x, y, w, h, false); titleBar(ctx, x + 3, y + 3, w - 6, "Setup complete");
  txt(ctx, "love.exe installed for", x + w / 2, y + 48, F.vt(20), "#333", "center");
  ctx.font = F.px(700, 26); const nw = ctx.measureText(CONFIG.name).width, tot = nw + 8 + 24 + 4 + 21, sx = x + w / 2 - tot / 2;
  txt(ctx, CONFIG.name, sx, y + 79, F.px(700, 26), "#111");
  floppy(ctx, sx + nw + 8, y + 59, 2); miniHeart(ctx, sx + nw + 36, y + 62, 3);
  const blink = Math.floor((now - heartT) * 2.2) % 2 === 0;
  button(ctx, RUN.x, RUN.y, RUN.w, RUN.h, runT >= 0 ? "Run again" : "Run", { def: true, focus: runT >= 0 || blink, down: now - runDown < .14, bold: true, size: 15 });
  ctx.restore();
}
function drawBalloon() {
  if (runT < 0) return;
  const a = now - runT; if (a < 0) return;
  const x = 36, y = 400, w = 336, h = 54, sc = .8 + .2 * outBack(a / .25);
  ctx.save(); ctx.translate(x + w - 40, y + h + 14); ctx.scale(sc, sc); ctx.translate(-(x + w - 40), -(y + h + 14)); ctx.globalAlpha = clamp(a / .06, 0, 1);

  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 7) : ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w - 66, y + h - .5); ctx.lineTo(x + w - 40, y + h + 14); ctx.lineTo(x + w - 46, y + h - .5); ctx.fill(); ctx.stroke();
  fr(ctx, "#ffffe1", x + w - 65, y + h - 1.5, 18, 2.5);
  miniHeart(ctx, x + 11, y + 10, 1.8);
  txt(ctx, "love.exe", x + 28, y + 20, F.px(700, 13), "#111");
  const n = Math.floor(clamp((a - .15) * 30, 0, CONFIG.msg.length)), cur = n < CONFIG.msg.length || Math.floor(now * 2.5) % 2 ? "_" : "";
  txt(ctx, CONFIG.msg.slice(0, n) + cur, x + 11, y + 42, F.vt(20), "#111");
  ctx.restore();
}
function drawParticles(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i], t = now - c.t0; if (t > c.life) { confetti.splice(i, 1); continue; }
    c.vx *= Math.pow(.25, dt); c.vy = c.vy * Math.pow(.4, dt) + 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
    const a = 1 - clamp((t - c.life + .4) / .4, 0, 1), fl = Math.cos(c.ph + t * c.spin);
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(fl, 1); ctx.globalAlpha = a;
    if (c.heart) pix(ctx, MINI, -3.5 * c.s, -3 * c.s, c.s, { X: c.c, h: c.c, d: c.c }); else fr(ctx, c.c, -3, -2, 6, 4);
    ctx.restore();
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i], t = now - f.t0; if (t < 0) continue; if (t > 2.2) { floaters.splice(i, 1); continue; }
    const a = Math.min(1, t * 5) * (1 - clamp((t - 1.4) / .8, 0, 1));
    ctx.globalAlpha = a; pix(ctx, MINI, f.x + Math.sin(f.ph + t * 3) * 12 - 3.5 * f.s, f.y - f.sp * t - 3 * f.s, f.s, { X: f.c, h: "#fff", d: f.c }); ctx.globalAlpha = 1;
  }
}

// ---------- main loop ----------
let lastW = 0, lastH = 0, lastClock = "";
function frame(ms) {
  const t = (ms - T0) / 1000, dt = clamp(t - now, 0, .05); now = t;
  if (innerWidth !== lastW || innerHeight !== lastH) { lastW = innerWidth; lastH = innerHeight; resize(); }
  // install
  if (dropT >= 0) { p = Math.max(p, .99 + .01 * sm((now - dropT) / .3)); if (p >= 1 - 1e-9 && doneT < 0) { p = 1; doneT = now; addLog("installation complete"); sfx.done(); ev("done"); } }
  else if (stuckT < 0) {
    p = prog(now);
    while (nextLine < CONFIG.log.length && p >= thr(nextLine)) { addLog(nm(CONFIG.log[nextLine])); ev("line"); if (nextLine === 2) { exT = now; binHit = now + .55; } nextLine++; }
    if (p >= .99) { p = .99; stuckT = now; addLog("looking for " + CONFIG.missing + "…", "wait"); ev("stuck"); if (haveYou) { dropT = now + .25; addLog("found " + CONFIG.missing); } }
  }
  if (stuckT >= 0 && errT < 0 && dropT < 0 && now > stuckT + .35) { errT = now; addLog("missing file: " + CONFIG.missing, "err"); sfx.nope(); ev("error"); }
  if (doneT >= 0 && breakT < 0 && now > doneT + .35) { breakT = now; breakWindow(); ev("break"); }

  scroll += (Math.max(0, logL.length - 6) * 17.5 - scroll) * (1 - Math.exp(-dt * 22));

  drawIcons();
  if (breakT < 0) {
    const e = errT >= 0 ? now - errT : 9, sh = Math.sin(e * 46) * 5 * Math.exp(-e * 7);
    ctx.save(); ctx.translate(sh, 0); fr(ctx, "rgba(0,0,0,.3)", WIN.x + 6, WIN.y + 7, WIN.w, WIN.h); drawWindow(ctx); ctx.restore();

  } else drawHeart();

  if (c !== lastClock) { lastClock = c; clockEl.textContent = c; }
  requestAnimationFrame(frame);
}
resize();
