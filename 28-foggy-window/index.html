<body>
<canvas id="glass"></canvas>
<div class="bar"><span id="clock">11:48 pm</span><span id="wx">rain · 9°</span></div>

<script>
// ===== Foggy Window · free code by @sicscod.drops =====
// Send it: yoursite/?name=Delly&msg=missing%20you%20on%20nights%20like%20this&hue=335
const P = new URLSearchParams(location.search);
const CONFIG = {
  name: P.get("name") || "Delly",                          // what appears in the fog
  msg: P.get("msg") || "missing you on nights like this",  // the line under the window
  hue: +(P.get("hue") || 335),       // main neon colour of the city (0-360)
  clock: "11:48 pm", weather: "rain · 9°",
  strokesToReveal: 3,  // wipes before the name writes itself
  autoAfter: 9,        // seconds; writes anyway if nobody touches the glass
  finger: 21,          // wipe radius in px
  refog: 0.36,         // how fast wiped glass fogs back (per second)
  writeTime: 2.3,      // seconds to write the name
  rain: 7,             // drops running down the glass at once
};

// ---------- setup ----------
const $ = id => document.getElementById(id);
const cv = $("glass"), ctx = cv.getContext("2d");
$("msg").textContent = CONFIG.msg; $("clock").textContent = CONFIG.clock; $("wx").textContent = CONFIG.weather;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const sst = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const H0 = CONFIG.hue, neon = (l = 62, a = 1) => `hsla(${H0},100%,${l}%,${a})`;

let W = 0, H = 0, DPR = 1, G = 3, gw = 0, gh = 0;
let sharp, blur, fog, vign, tmp, T, mask, M, grid, G2, gimg, clear, noise, nameFull, nameMask, N2;
let lights = [], cars = [], drops = [], beads = [], drips = [];
const sprites = {};
const S = { down: false, lx: 0, ly: 0, len: 0, strokes: 0, wiped: 0, trigger: -1, writeT: -1, cols: null, nb: null, front: -1, fy: 0, last: 0, t: 0 };

// ---------- the city behind the glass (drawn once, sharp) ----------
function buildCity(c, w, h) {
  const r = seeded(28), x = c.getContext("2d"); x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hz = h * .7; lights = [];
  let g = x.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, "#121731"); g.addColorStop(.5, "#252b4b"); g.addColorStop(1, `hsl(${H0},45%,33%)`);
  x.fillStyle = g; x.fillRect(0, 0, w, hz);
  const glow = (cx, cy, rad, col) => { const q = x.createRadialGradient(cx, cy, 0, cx, cy, rad); q.addColorStop(0, col); q.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = q; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2); };
  glow(w * .3, hz, w * .7, `hsla(${H0},70%,50%,.22)`); glow(w * .85, hz, w * .5, "hsla(190,70%,50%,.14)");
  for (let i = 0; i < 14; i++) {   // low clouds lit by the city
    const cx = r() * w, cy = h * (.05 + r() * .4), rw = 60 + r() * 140;
    x.save(); x.translate(cx, cy); x.scale(1, .32); glow(0, 0, rw, `hsla(${r() < .6 ? H0 : 215},40%,${36 + r() * 16}%,.3)`); x.restore();
  }
  const win = (bx, by, bw, bh, p, dim) => {
    const cw = 7, ch = 9;
    for (let yy = by + 8; yy < by + bh - 6; yy += ch) {
      const floor = r() < .12;
      for (let xx = bx + 5; xx < bx + bw - 6; xx += cw) {
        if (!(floor || r() < p)) continue;
        const k = r(), col = k < .55 ? [255, 206, 140] : k < .85 ? [170, 214, 255] : [255, 120, 170];
        const a = dim * (.45 + .55 * r());
        x.fillStyle = `rgba(${col},${a})`; x.fillRect(xx, yy, 3.2, 4.6);
        if (a > .8 && r() < .14) lights.push({ x: xx + 1.6, y: yy + 2.3, col: `rgb(${col})`, r: rnd(7, 15), a: .3 });
      }
    }
  };
  // far skyline
  for (let bx = -10; bx < w + 10;) {
    const bw = 18 + r() * 40, bh = h * (.14 + r() * .24);
    x.fillStyle = "#121628"; x.fillRect(bx, hz - bh, bw, bh); win(bx, hz - bh, bw, bh, .12, .4); bx += bw + 2;
  }
  // back towers, then front towers
  for (let bx = -10; bx < w + 10;) {
    const bw = 34 + r() * 50, bh = h * (.42 + r() * .4);
    x.fillStyle = "#161b33"; x.fillRect(bx, hz - bh, bw, bh); win(bx, hz - bh, bw, bh, .26, .7);
    x.fillStyle = `hsla(${r() < .5 ? H0 : 200},70%,60%,.14)`; x.fillRect(bx + bw - 1, hz - bh, 1, bh);
    bx += bw + 4 + r() * 22;
  }
  const towers = [];
  for (let bx = -20; bx < w + 20;) {
    const bw = 44 + r() * 64, bh = h * (.24 + r() * .32);
    g = x.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, "#10142a"); g.addColorStop(1, "#090b16");
    x.fillStyle = g; x.fillRect(bx, hz - bh, bw, bh);
    x.fillStyle = `hsla(${r() < .5 ? H0 : 195},80%,62%,.3)`; x.fillRect(bx, hz - bh, 1, bh);
    win(bx, hz - bh, bw, bh, .44, 1); towers.push([bx, bw, bh]); bx += bw + 5 + r() * 14;
  }
  const tall = towers.reduce((a, b) => b[2] > a[2] ? b : a);
  x.fillStyle = "#ff3b3b"; x.fillRect(tall[0] + tall[1] / 2 - 1.5, hz - tall[2] - 6, 3, 3);
  lights.push({ x: tall[0] + tall[1] / 2, y: hz - tall[2] - 5, col: "#ff4040", r: 9, a: .5, blink: 1 });
  // neon signs
  const sign = (sx, sy, txt, hue, vert, size) => {
    x.save(); x.font = `600 ${size}px "DM Mono", monospace`; x.textAlign = "center"; x.textBaseline = "middle";
    const chars = vert ? txt.split("") : [txt], step = size * 1.08;
    const bw = vert ? size * 1.5 : x.measureText(txt).width + size * 1.1, bh = vert ? step * chars.length + size * .6 : size * 1.7;
    x.fillStyle = "rgba(4,5,9,.92)"; x.fillRect(sx - bw / 2, sy - bh / 2, bw, bh);
    for (const [blurPx, a, l] of [[22, .9, 55], [7, 1, 70], [0, 1, 90]]) {
      x.shadowColor = `hsla(${hue},100%,55%,${a})`; x.shadowBlur = blurPx * DPR;
      x.strokeStyle = `hsla(${hue},100%,${l}%,${a})`; x.lineWidth = 1.5; x.strokeRect(sx - bw / 2 + 2, sy - bh / 2 + 2, bw - 4, bh - 4);
      x.fillStyle = `hsla(${hue},100%,${l}%,1)`;
      chars.forEach((ch, i) => x.fillText(ch, sx, vert ? sy - bh / 2 + size * .3 + step * (i + .5) : sy));
    }
    x.restore();
    lights.push({ x: sx, y: sy, col: `hsl(${hue},100%,62%)`, r: Math.max(bw, bh) * .45, a: .6, sign: 1 });
    return [sx, sy, bh, hue];
  };
  const on = fx => towers.find(tw => tw[0] <= fx * w && tw[0] + tw[1] >= fx * w) || towers[0];
  const tA = on(.16), tB = on(.47), tC = on(.8);
  const signs = [
    sign(tA[0] + tA[1] - 9, hz - tA[2] * .62, "HOTEL", H0, true, 13),
    sign(tB[0] + 10, hz - tB[2] * .7, "DINER", 38, true, 12),
    sign(tC[0] + tC[1] * .5, hz - tC[2] * .82, "LIVE", (H0 + 300) % 360, false, 13),
    sign(w * .2, hz - 22, "OPEN", 186, false, 12),
    sign(w * .7, hz - 30, "BAR 24", 34, false, 11),
  ];
  // street
  g = x.createLinearGradient(0, hz, 0, h); g.addColorStop(0, "#1a1c2b"); g.addColorStop(.3, "#0e1019"); g.addColorStop(1, "#08090e");
  x.fillStyle = g; x.fillRect(0, hz, w, h - hz);
  x.globalCompositeOperation = "lighter";
  for (const s of signs) {   // neon puddles on the wet road
    const q = x.createRadialGradient(s[0], hz + 40, 0, s[0], hz + 40, 90);
    q.addColorStop(0, `hsla(${s[3]},100%,55%,.22)`); q.addColorStop(1, "rgba(0,0,0,0)");
    x.save(); x.translate(s[0], hz + 40); x.scale(1, 2.2); x.translate(-s[0], -(hz + 40)); x.fillStyle = q; x.fillRect(s[0] - 90, hz - 50, 180, 180); x.restore();
  }
  for (const L of lights) {  // reflections on the wet road
    if (L.y < hz - h * .4 && !L.sign) continue;
    const len = 30 + (L.sign ? 150 : 60 * r()), ww = L.sign ? 10 : 2;
    const q = x.createLinearGradient(0, hz + 2, 0, hz + len);
    q.addColorStop(0, L.col.replace("rgb", "rgba").replace("hsl", "hsla").replace(")", ",.5)")); q.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = q; x.fillRect(L.x - ww / 2 + (r() - .5) * 2, hz + 2, ww, len);
  }
  x.globalCompositeOperation = "source-over";
  // street lamps
  for (const lx of [w * .08, w * .6, w * 1.02]) {
    const top = hz - h * .27;
    x.strokeStyle = "#0b0c10"; x.lineWidth = 3; x.beginPath(); x.moveTo(lx, hz + 6); x.lineTo(lx, top); x.lineTo(lx - 16, top - 4); x.stroke();
    x.globalCompositeOperation = "lighter"; glow(lx - 16, top + 1, 46, "rgba(255,170,90,.38)"); glow(lx - 16, top + 1, 9, "rgba(255,226,180,.95)");
    const q = x.createLinearGradient(0, hz, 0, hz + 140); q.addColorStop(0, "rgba(255,170,90,.35)"); q.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = q; x.fillRect(lx - 20, hz + 2, 8, 140); x.globalCompositeOperation = "source-over";
    lights.push({ x: lx - 16, y: top, col: "rgb(255,176,96)", r: 26, a: .5 });
  }
  x.fillStyle = "rgba(255,255,255,.05)"; x.fillRect(0, hz + 4, w, 1);
}

// blur by halving down and scaling back up (works in every browser)
function makeBlur(src) {
  let c = src; const steps = [];
  for (let i = 0; i < 5; i++) { const n = mk(c.width / 2, c.height / 2), x = n.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(c, 0, 0, n.width, n.height); steps.push(n); c = n; }
  for (let i = steps.length - 2; i >= 0; i--) { const n = mk(steps[i].width, steps[i].height), x = n.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(c, 0, 0, n.width, n.height); c = n; }
  const out = mk(src.width, src.height), x = out.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(c, 0, 0, out.width, out.height);
  return out;
}

function sprite(col) {   // one bokeh disc: flat body, brighter rim
  if (sprites[col]) return sprites[col];
  const s = mk(96, 96), x = s.getContext("2d"), q = x.createRadialGradient(48, 48, 0, 48, 48, 47);
  q.addColorStop(0, "rgba(255,255,255,.42)"); q.addColorStop(.78, "rgba(255,255,255,.5)"); q.addColorStop(.92, "rgba(255,255,255,.85)"); q.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = q; x.beginPath(); x.arc(48, 48, 47, 0, 7); x.fill();
  x.globalCompositeOperation = "source-in"; x.fillStyle = col; x.fillRect(0, 0, 96, 96);
  return sprites[col] = s;
}

// the condensation: haze + thousands of tiny beads
function buildFog(c, w, h) {
  const r = seeded(7), x = c.getContext("2d"); x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(140,152,176,.32)"); g.addColorStop(.6, "rgba(152,162,184,.38)"); g.addColorStop(1, "rgba(170,178,196,.5)");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const cx = r() * w, cy = r() * h, rad = 40 + r() * 140, q = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    q.addColorStop(0, r() < .5 ? "rgba(200,210,225,.10)" : "rgba(20,24,34,.10)"); q.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = q; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
  const n = w * h / 14;
  for (let i = 0; i < n; i++) {
    const bx = r() * w, by = r() * h, br = .35 + r() * r() * 1.5;
    x.fillStyle = "rgba(20,26,36,.22)"; x.fillRect(bx - br * .2, by + br * .35, br * 2, br * 2);
    x.fillStyle = `rgba(222,230,240,${.16 + r() * .22})`; x.fillRect(bx, by, br * 1.6, br * 1.6);
  }
  for (let i = 0; i < w * h / 900; i++) {
    const bx = r() * w, by = r() * h, br = 1.2 + r() * 1.6;
    x.fillStyle = "rgba(14,18,26,.28)"; x.beginPath(); x.arc(bx + .3, by + .5, br, 0, 7); x.fill();
    x.fillStyle = "rgba(226,234,244,.30)"; x.beginPath(); x.arc(bx, by, br * .85, 0, 7); x.fill();
    x.fillStyle = "rgba(255,255,255,.7)"; x.fillRect(bx - br * .4, by - br * .45, .8, .8);
  }
}

function buildVign(c, w, h) {
  const x = c.getContext("2d"); x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const q = x.createRadialGradient(w / 2, h * .45, Math.min(w, h) * .35, w / 2, h * .45, Math.hypot(w, h) * .62);
  q.addColorStop(0, "rgba(0,0,0,0)"); q.addColorStop(1, "rgba(0,0,0,.55)"); x.fillStyle = q; x.fillRect(0, 0, w, h);
  for (const [a, b, c2, d] of [[0, 0, 0, 1], [0, 0, 1, 0], [w, 0, -1, 0], [0, h, 0, -1]]) {
    const L = 22, g = x.createLinearGradient(a, b, a + c2 * L, b + d * L);
    g.addColorStop(0, "rgba(0,0,0,.6)"); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g;
    if (d) x.fillRect(0, d > 0 ? 0 : h - L, w, L); else x.fillRect(c2 > 0 ? 0 : w - L, 0, L, h);
  }
}

function build() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = W * DPR; cv.height = H * DPR;
  sharp = mk(W * DPR, H * DPR); buildCity(sharp, W, H); blur = makeBlur(sharp);
  fog = mk(W * DPR, H * DPR); buildFog(fog, W, H);
  vign = mk(W * DPR, H * DPR); buildVign(vign, W, H);
  tmp = mk(W * DPR, H * DPR); T = tmp.getContext("2d");
  mask = mk(W * DPR, H * DPR); M = mask.getContext("2d");
  nameMask = mk(W * DPR, H * DPR); N2 = nameMask.getContext("2d");
  gw = Math.ceil(W / G) + 1; gh = Math.ceil(H / G) + 1;
  grid = mk(gw, gh); G2 = grid.getContext("2d"); gimg = G2.createImageData(gw, gh);
  for (let i = 0; i < gimg.data.length; i += 4) gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = 255;
  clear = new Float32Array(gw * gh); noise = new Float32Array(gw * gh);
  const r = seeded(3); for (let i = 0; i < noise.length; i++) noise[i] = .65 + r() * .7;
  for (let k = 0; k < 2; k++) for (let i = gw + 1; i < noise.length - gw - 1; i++) noise[i] = (noise[i] * 2 + noise[i - 1] + noise[i + 1] + noise[i - gw] + noise[i + gw]) / 6;
  const hz = H * .7;
  cars = [0, 1, 2, 3].map(i => ({ x: rnd(0, W), v: (i % 2 ? -1 : 1) * rnd(38, 70), y: hz + (i % 2 ? 14 : 26) }));
  drops = []; beads = []; drips = []; S.cols = null;
  if (S.writeT >= 0) prepName();
}

// ---------- wiping ----------
function stamp(px, py, rad, val) {
  const x0 = Math.max(0, Math.floor((px - rad) / G)), x1 = Math.min(gw - 1, Math.ceil((px + rad) / G));
  const y0 = Math.max(0, Math.floor((py - rad) / G)), y1 = Math.min(gh - 1, Math.ceil((py + rad) / G));
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
    const d = Math.hypot(gx * G - px, gy * G - py), v = val * (1 - sst(rad * .72, rad, d)), i = gy * gw + gx;
    if (v > clear[i]) clear[i] = v;
  }
}
function wipe(ax, ay, bx, by, rad, val, beady) {
  const L = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(L / (rad * .3)));
  for (let k = 1; k <= n; k++) stamp(ax + (bx - ax) * k / n, ay + (by - ay) * k / n, rad, val);
  if (beady && L > 0) {  // water pushed to the edges of the finger
    const nx = -(by - ay) / L, ny = (bx - ax) / L;
    for (let k = 0; k < L / 7; k++) {
      const u = Math.random(), s = Math.random() < .5 ? -1 : 1, o = rad * rnd(.82, 1.02);
      beads.push({ x: ax + (bx - ax) * u + nx * o * s, y: ay + (by - ay) * u + ny * o * s, r: rnd(.7, 2), life: rnd(4, 8), age: 0 });
    }
    if (beads.length > 260) beads.splice(0, beads.length - 260);
  }
  return L;
}
const pt = e => [e.clientX, e.clientY];
addEventListener("pointerdown", e => { const [x, y] = pt(e); S.down = true; S.lx = x; S.ly = y; S.len = 0; stamp(x, y, CONFIG.finger, 1.55); });
addEventListener("pointermove", e => {
  if (!S.down) return; const [x, y] = pt(e);
  const L = wipe(S.lx, S.ly, x, y, CONFIG.finger, 1.55, true); S.len += L; S.wiped += L; S.lx = x; S.ly = y;
});
const up = () => { if (!S.down) return; S.down = false; if (S.len > 40) S.strokes++; };
addEventListener("pointerup", up); addEventListener("pointercancel", up);

// ---------- rain on the glass ----------
function spawnDrop(t, anyY) {
  drops.push({ x: rnd(10, W - 10), y: anyY ? rnd(-20, H * .6) : rnd(-30, H * .35), r: rnd(2.6, 5.2), v: 0, stick: rnd(0, 1.2), wob: rnd(0, 9), lx: 0, ly: 0, born: t });
}
function lens(x, y, rx, ry, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.ellipse(x * DPR, y * DPR, rx * DPR, ry * DPR, 0, 0, 7); ctx.clip();
  const s = 3.2; ctx.translate(x * DPR, y * DPR); ctx.scale(-1, -1);
  ctx.drawImage(sharp, (x - rx * s) * DPR, (y - ry * s) * DPR, rx * s * 2 * DPR, ry * s * 2 * DPR, -rx * DPR, -ry * DPR, rx * 2 * DPR, ry * 2 * DPR);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let q = ctx.createRadialGradient((x - rx * .25) * DPR, (y - ry * .3) * DPR, 0, x * DPR, y * DPR, Math.max(rx, ry) * DPR);
  q.addColorStop(0, "rgba(255,255,255,.06)"); q.addColorStop(.7, "rgba(0,0,0,.08)"); q.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = q; ctx.fillRect((x - rx) * DPR, (y - ry) * DPR, rx * 2 * DPR, ry * 2 * DPR);
  q = ctx.createRadialGradient(x * DPR, (y + ry * .55) * DPR, 0, x * DPR, (y + ry * .55) * DPR, rx * .8 * DPR);
  q.addColorStop(0, "rgba(255,240,235,.32)"); q.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = q; ctx.fillRect((x - rx) * DPR, (y - ry) * DPR, rx * 2 * DPR, ry * 2 * DPR);
  ctx.restore();
  ctx.fillStyle = `rgba(255,255,255,${.85 * a})`; ctx.beginPath(); ctx.arc((x - rx * .35) * DPR, (y - ry * .4) * DPR, Math.max(.6, rx * .2) * DPR, 0, 7); ctx.fill();
}

// ---------- the name, written from the other side ----------
let NM = null;
function prepName() {
  const fsz = Math.min(W * .34, 150), x = nameFull ? nameFull.getContext("2d") : null;
  nameFull = mk(W * DPR, H * DPR); const c = nameFull.getContext("2d"); c.setTransform(DPR, 0, 0, DPR, 0, 0);
  let f = fsz; c.font = `700 ${f}px Caveat, cursive`;
  let tw = c.measureText(CONFIG.name).width; const maxW = W * .8 - f * .35;
  if (tw > maxW) { f *= maxW / tw; c.font = `700 ${f}px Caveat, cursive`; tw = c.measureText(CONFIG.name).width; }
  const heartW = f * .42, x0 = (W - tw - heartW) / 2, base = H * .43 + f * .3;
  c.fillStyle = c.strokeStyle = "#fff"; c.lineJoin = c.lineCap = "round"; c.lineWidth = f * .06;
  c.textBaseline = "alphabetic"; c.fillText(CONFIG.name, x0, base); c.strokeText(CONFIG.name, x0, base);
  // column extents (css px) to steer the invisible fingertip and place the drips
  const sw = Math.ceil(W), img = c.getImageData(0, 0, nameFull.width, nameFull.height).data, cols = [];
  for (let cx = 0; cx < sw; cx++) {
    const px = Math.min(nameFull.width - 1, Math.round(cx * DPR)); let top = -1, bot = -1;
    for (let py = 0; py < nameFull.height; py += 2) if (img[(py * nameFull.width + px) * 4 + 3] > 128) { if (top < 0) top = py; bot = py; }
    cols.push(top < 0 ? null : [top / DPR, bot / DPR]);
  }
  let first = cols.findIndex(v => v), last = cols.length - 1; while (last > 0 && !cols[last]) last--;
  const hx = x0 + tw + heartW * .55, hy = base - f * .66, hs = f * .0155;
  const heart = []; for (let k = 0; k <= 80; k++) { const a = k / 80 * Math.PI * 2; heart.push([hx + 16 * Math.sin(a) ** 3 * hs, hy - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * hs]); }
  const dr = [], R = seeded(9);
  for (let cx = first + 6; cx < last - 4; cx++) {
    const v = cols[cx]; if (!v) continue;
    let isLow = true; for (let k = -10; k <= 10; k++) { const u = cols[cx + k]; if (u && u[1] > v[1]) { isLow = false; break; } }
    if (isLow && (!dr.length || cx - dr[dr.length - 1].x > 24)) dr.push({ x: cx, y0: v[1] - f * .02, len: 14 + R() * 46, sp: 10 + R() * 16, y: 0, on: false });
  }
  NM = { f, x0: first, x1: last, cols, heart, lw: f * .075, dr };
  S.fy = cols[first] ? (cols[first][0] + cols[first][1]) / 2 : H * .4;
}
function drawName(t) {
  const n = NM; N2.setTransform(1, 0, 0, 1, 0, 0); N2.clearRect(0, 0, nameMask.width, nameMask.height);
  const p = clamp((t - S.writeT) / CONFIG.writeTime), e = p + .045 * Math.sin(p * Math.PI * 10) / Math.PI;
  const fx = n.x0 + (n.x1 - n.x0 + 4) * clamp(e);
  N2.save(); N2.beginPath(); N2.rect(0, 0, fx * DPR, nameMask.height); N2.clip(); N2.drawImage(nameFull, 0, 0); N2.restore();
  N2.setTransform(DPR, 0, 0, DPR, 0, 0); N2.fillStyle = N2.strokeStyle = "#fff"; N2.lineCap = N2.lineJoin = "round";
  const col = n.cols[Math.round(fx)];
  if (col && p < 1) S.fy += ((col[0] + col[1]) / 2 + Math.sin(t * 19) * (col[1] - col[0]) * .35 - S.fy) * .35;
  S.front = p < 1 ? fx : -1;
  // heart, drawn in two strokes like a real finger
  const hp = clamp((t - S.writeT - CONFIG.writeTime - .15) / .75);
  if (hp > 0) {
    N2.lineWidth = n.lw * .95; const k = n.heart.length - 1, a = Math.round(hp * k / 2);
    for (const dir of [1, -1]) { N2.beginPath(); for (let i = 0; i <= a; i++) { const q = n.heart[dir > 0 ? i : k - i]; i ? N2.lineTo(q[0], q[1]) : N2.moveTo(q[0], q[1]); } N2.stroke(); }
    if (hp < 1) S.heartTip = n.heart[Math.round(hp * k / 2)]; else S.heartTip = null;
  }
  // drips run down from the bottoms of the letters
  for (const d of n.dr) {
    if (!d.on && fx > d.x + 4) { d.on = true; d.t0 = t; }
    if (!d.on) continue;
    const u = t - d.t0, y = d.y0 + d.len * (1 - Math.exp(-u * d.sp / d.len));
    const g = N2.createLinearGradient(0, d.y0, 0, y); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(1, "rgba(255,255,255,.8)");
    N2.strokeStyle = g; N2.lineWidth = n.lw * .32; N2.beginPath(); N2.moveTo(d.x, d.y0); N2.lineTo(d.x, y); N2.stroke();
    N2.fillStyle = "#fff"; N2.beginPath(); N2.arc(d.x, y, n.lw * .3, 0, 7); N2.fill(); d.tip = y;
  }
}

// ---------- loop ----------
function frame(now) {
  requestAnimationFrame(frame);
  if (innerWidth !== W || innerHeight !== H) build();
  const t = now / 1000, dt = Math.min(.05, t - (S.last || t)); S.last = t; S.t = t;
  if (S.t0 === undefined) S.t0 = t; const lt = t - S.t0;

  // trigger the name
  if (S.trigger < 0 && (S.strokes >= CONFIG.strokesToReveal || S.wiped > 1700 || (lt > CONFIG.autoAfter && S.wiped < 1))) S.trigger = t;
  if (S.trigger >= 0 && S.writeT < 0 && !S.down && t - S.trigger > .45) { S.writeT = t; prepName(); }
  const named = S.writeT >= 0;

  // fog creeps back
  const rate = CONFIG.refog * (named ? 2 : 1) * dt, d = gimg.data;
  for (let i = 0; i < clear.length; i++) {
    let c = clear[i]; if (c > 0) { c -= rate * noise[i]; clear[i] = c = c < 0 ? 0 : c; }
    d[i * 4 + 3] = c >= .9 ? 255 : c <= 0 ? 0 : 255 * sst(0, .9, c);
  }
  G2.putImageData(gimg, 0, 0);

  // rain on the glass
  if (!S.seeded) { S.seeded = 1; for (let i = 0; i < CONFIG.rain; i++) spawnDrop(t, true); }
  const sliding = drops.filter(o => o.y < H + 12).length;
  if (sliding < CONFIG.rain && Math.random() < dt * 3) spawnDrop(t, false);
  for (const o of drops) {
    o.stick -= dt;
    if (o.stick > 0) { o.v *= .8; }
    else {
      o.v = Math.min(o.v + dt * 260, 40 + o.r * 26);
      if (Math.random() < dt * 1.3) o.stick = rnd(.08, .5);
    }
    const ox = o.x, oy = o.y; o.y += o.v * dt; o.x += Math.sin(o.y * .05 + o.wob) * .25 * o.v * dt * .2;
    if (o.v > 4) { wipe(ox, oy, o.x, o.y, o.r * .62, 1.05, false); if (Math.random() < dt * 4) beads.push({ x: o.x + rnd(-1, 1), y: o.y - o.r * 1.8, r: rnd(.6, 1.3), life: rnd(3, 6), age: 0 }); }
  }
  drops = drops.filter(o => o.y < H + 20);

  // ---- compose ----
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(blur, 0, 0);
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < lights.length; i++) {
    const L = lights[i], br = L.r * 1.25 + 6, a = L.a * (L.blink ? (Math.sin(t * 3.4) > .2 ? 1 : .15) : .85 + .15 * Math.sin(t * .9 + i));
    ctx.globalAlpha = a; ctx.drawImage(sprite(L.col), (L.x - br) * DPR, (L.y - br) * DPR, br * 2 * DPR, br * 2 * DPR);
  }
  for (const c of cars) {
    c.x += c.v * dt; if (c.x > W + 60) c.x = -60; if (c.x < -60) c.x = W + 60;
    const col = c.v > 0 ? "rgb(255,60,60)" : "rgb(255,240,214)";
    ctx.globalAlpha = .55; for (const s of [-7, 7]) ctx.drawImage(sprite(col), (c.x + s - 15) * DPR, (c.y - 15) * DPR, 30 * DPR, 30 * DPR);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(fog, 0, 0);

  // what you see through the wiped glass
  T.setTransform(1, 0, 0, 1, 0, 0); T.globalCompositeOperation = "source-over"; T.globalAlpha = 1;
  T.drawImage(sharp, 0, 0);
  T.globalCompositeOperation = "lighter";
  for (const c of cars) {
    const col = c.v > 0 ? "255,60,60" : "255,240,214";
    for (const s of [-6, 6]) {
      const q = T.createRadialGradient((c.x + s) * DPR, c.y * DPR, 0, (c.x + s) * DPR, c.y * DPR, 10 * DPR);
      q.addColorStop(0, `rgba(${col},1)`); q.addColorStop(.18, `rgba(${col},.8)`); q.addColorStop(1, `rgba(${col},0)`);
      T.fillStyle = q; T.fillRect((c.x + s - 10) * DPR, (c.y - 10) * DPR, 20 * DPR, 20 * DPR);
      const g = T.createLinearGradient(0, c.y * DPR, 0, (c.y + 60) * DPR); g.addColorStop(0, `rgba(${col},.4)`); g.addColorStop(1, `rgba(${col},0)`);
      T.fillStyle = g; T.fillRect((c.x + s - 1.5) * DPR, (c.y + 3) * DPR, 3 * DPR, 60 * DPR);
    }
  }
  T.strokeStyle = "rgba(200,215,235,.16)"; T.lineWidth = DPR;   // rain outside
  T.beginPath();
  for (let i = 0; i < 70; i++) { const sx = ((i * 97.3 + t * 40) % (W + 40)) - 20, sy = ((i * 61.7 + t * 620) % (H + 60)) - 60; T.moveTo(sx * DPR, sy * DPR); T.lineTo((sx - 3) * DPR, (sy + 22) * DPR); }
  T.stroke();
  M.setTransform(1, 0, 0, 1, 0, 0); M.globalCompositeOperation = "copy"; M.imageSmoothingQuality = "high";
  M.drawImage(grid, 0, 0, gw * G * DPR, gh * G * DPR);
  M.globalCompositeOperation = "source-over";
  if (named) { drawName(t); M.drawImage(nameMask, 0, 0); }
  T.globalCompositeOperation = "destination-in"; T.globalAlpha = 1; T.drawImage(mask, 0, 0);
  ctx.drawImage(tmp, 0, 0);

  // fingertip of whoever is writing from the other side
  if (named && S.front > 0) {
    const q = ctx.createRadialGradient(S.front * DPR, S.fy * DPR, 0, S.front * DPR, S.fy * DPR, 16 * DPR);
    q.addColorStop(0, "rgba(255,255,255,.22)"); q.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = q; ctx.fillRect((S.front - 16) * DPR, (S.fy - 16) * DPR, 32 * DPR, 32 * DPR);
  }
  // beads and drops sit on the glass
  for (const b of beads) b.age += dt;
  beads = beads.filter(b => b.age < b.life);
  for (const b of beads) lens(b.x, b.y, b.r, b.r * 1.05, clamp(Math.min(b.age * 6, (b.life - b.age) / 1.5)));
  if (named && NM) for (const dd of NM.dr) if (dd.on) lens(dd.x, dd.tip + 1, NM.lw * .42, NM.lw * .5, 1);
  for (const o of drops) {
    const st = clamp(o.v / 60), rx = o.r * (1 - .12 * st), ry = o.r * (1 + .3 * st);
    lens(o.x, o.y, rx, ry, clamp((t - o.born) * 3));
  }
  ctx.globalAlpha = 1; ctx.drawImage(vign, 0, 0);

  // text under the glass
  const mt = named ? clamp((t - S.writeT - CONFIG.writeTime - .5) / 1.1) : 0, msg = $("msg");
  msg.style.opacity = sst(0, 1, mt).toFixed(3);
  msg.style.transform = `translateY(${((1 - sst(0, 1, mt)) * 10).toFixed(2)}px)`;
  msg.style.filter = mt < 1 ? `blur(${((1 - mt) * 6).toFixed(2)}px)` : "none";
  const hk = named ? clamp(1 - (t - S.writeT) / .6) : 1;
  $("hint").style.opacity = (hk * (S.down || S.wiped > 0 ? .55 : .75 + .25 * Math.sin(t * 2.4))).toFixed(3);
}
build();
document.fonts && document.fonts.load('700 100px Caveat').then(() => { if (S.writeT >= 0) prepName(); });
requestAnimationFrame(frame);
</script>
</body>
