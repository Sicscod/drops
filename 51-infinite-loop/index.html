  ctx.fillStyle = "#15161c"; ctx.font = `700 ${7.5 * S}px ${F.mono}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("JS", 19 * S, TABH / 2 + .5 * S);
  ctx.textAlign = "left"; ctx.font = `600 ${13 * S}px ${F.ui}`; ctx.fillStyle = "#d6d8e5"; ctx.fillText(CONFIG.file, 32 * S, TABH / 2 + .5 * S);
  const run = mode === "run", t = ok ? "exited · 0" : run ? "running" : "stopping", fs = 11 * S;
  ctx.font = `700 ${fs}px ${F.mono}`; const bw = ctx.measureText(t).width + 30 * S, bh = 21 * S, bx = W - 10 * S - bw, by = TABH / 2 - bh / 2;
  const col = ok ? C.ok : C.hot, rgb = ok ? "143,224,122" : "255,90,78";
  rr(bx, by, bw, bh, bh / 2); ctx.fillStyle = `rgba(${rgb},.14)`; ctx.fill(); ctx.strokeStyle = `rgba(${rgb},.5)`; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = col; ctx.globalAlpha = run ? .55 + .45 * Math.abs(Math.sin(now * 5)) : 1; ctx.beginPath(); ctx.arc(bx + 11 * S, TABH / 2, 3.5 * S, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.textAlign = "left"; ctx.fillText(t, bx + 20 * S, TABH / 2 + .5 * S);
  ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(tw, TABH - .5); ctx.lineTo(W, TABH - .5); ctx.stroke();
}
function drawPanel() {
  const y0 = CODEB + panelHit, ok = mode === "done", dk = ok ? now - exitT : -1;
  ctx.fillStyle = C.bar; ctx.fillRect(0, y0, W, PANH + 4 * S);
  ctx.strokeStyle = ok ? "rgba(143,224,122,.35)" : C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, y0 + .5); ctx.lineTo(W, y0 + .5); ctx.stroke();
  const px = 16 * S, hy = y0 + 15 * S;
  ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = `600 ${10.5 * S}px ${F.ui}`;
  let tx = px; for (const [name, on] of [["TERMINAL", 1], ["OUTPUT", 0]]) { ctx.fillStyle = on ? "#d6d8e5" : C.dim; ctx.fillText(name, tx, hy); const w = ctx.measureText(name).width; if (on) { ctx.fillStyle = "#d6d8e5"; ctx.fillRect(tx, hy + 9 * S, w, 1.5 * S); } tx += w + 24 * S; }
  const r1 = y0 + 42 * S, r2 = r1 + 22 * S;
  ctx.font = `400 ${12 * S}px ${F.mono}`; ctx.fillStyle = "#d6d8e5"; ctx.fillText(CONFIG.run, px, r1);
  if (mode === "run" || mode === "fly") {
    const sp = "|/-\\"[Math.floor(now * 12) % 4];
    ctx.fillStyle = C.hot; ctx.fillText(mode === "run" ? sp : "", px + ctx.measureText(CONFIG.run + " ").width, r1);
    if (echo) { ctx.fillStyle = C.warn; ctx.font = `700 ${12 * S}px ${F.mono}`; ctx.fillText(echo, px, r2); }
    else if (!CONFIG.auto) { ctx.fillStyle = C.dim; ctx.font = `400 ${11 * S}px ${F.mono}`; ctx.fillText(CONFIG.hint, px, r2); }
  } else {
    if (dk < .5) { ctx.fillStyle = `rgba(143,224,122,${.14 * (1 - dk / .5)})`; ctx.fillRect(0, y0 + 26 * S, W, PANH - 26 * S - STH); }
    const n = Math.floor(clamp(dk / .3, 0, 1) * CONFIG.exit.length);
    ctx.fillStyle = C.ok; ctx.font = `700 ${12 * S}px ${F.mono}`; ctx.fillText("✓ " + CONFIG.exit.slice(0, n), px, r2);
    if (!CONFIG.auto && now - modeT > THUMB + .4) { ctx.fillStyle = C.dim; ctx.font = `400 ${10.5 * S}px ${F.mono}`; ctx.fillText(CONFIG.again, px, r2 + 17 * S); }
  }
  drawKeys();
  const sy = y0 + PANH - STH; ctx.fillStyle = ok ? "#1d3324" : "#3a1d1d"; ctx.fillRect(0, sy, W, STH);
  ctx.font = `500 ${11 * S}px ${F.mono}`; ctx.fillStyle = ok ? "#b9f28a" : "#ffb3a8"; ctx.textAlign = "left";
  ctx.fillText(ok ? "✓ loop exited" : "● while (true) · not responding", px, sy + STH / 2 + .5 * S);
  ctx.textAlign = "right"; ctx.fillStyle = "rgba(230,232,245,.7)"; ctx.fillText(`fan ${ok ? "quiet" : "100%"}`, W - px, sy + STH / 2 + .5 * S);
}
function drawBubble(owner, x, y) {
  const q = bubbles[owner]; if (!q || now < q.t0 || now > q.t0 + q.life) return;
  const k = now - q.t0, a = k > q.life - .15 ? (q.life - k) / .15 : 1, pop = outBack(k / .16);
  ctx.font = `700 ${13 * S}px ${F.mono}`; const tw = ctx.measureText(q.text).width + 18 * S, th = 25 * S;
  let bx = clamp(x, tw / 2 + 6 * S, W - tw / 2 - 6 * S), by = Math.max(y - th, TABH + 4 * S);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(bx, by + th); ctx.scale(pop, pop); ctx.translate(-bx, -(by + th));
  rr(bx - tw / 2, by + 2.5 * S, tw, th, 8 * S); ctx.fillStyle = C.ink; ctx.fill();
  rr(bx - tw / 2, by, tw, th, 8 * S); ctx.fillStyle = "#f4f1e8"; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6 * S; ctx.stroke();
  const tx = clamp(x - 14 * S, bx - tw / 2 + 10 * S, bx + tw / 2 - 10 * S);
  ctx.beginPath(); ctx.moveTo(tx - 6 * S, by + th - 1); ctx.lineTo(tx - 9 * S, by + th + 8 * S); ctx.lineTo(tx + 6 * S, by + th - 1); ctx.fillStyle = "#f4f1e8"; ctx.fill();
  ctx.fillStyle = "#15161c"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(q.text, bx, by + th / 2 + .5 * S);
  ctx.restore();
}
function drawCursor() {
  if (!CONFIG.auto || !cur.seen) return;
  const pk = now - cur.pressT, sc = pk < .15 ? lerp(.8, 1, pk / .15) : 1;
  ctx.save(); ctx.translate(cur.x, cur.y); ctx.scale(sc * 1.25 * S, sc * 1.25 * S);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 17); ctx.lineTo(4.2, 13); ctx.lineTo(7, 19.5); ctx.lineTo(9.6, 18.4); ctx.lineTo(6.9, 12.2); ctx.lineTo(12.2, 12.2); ctx.closePath();
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fillStyle = "#fff"; ctx.fill(); ctx.shadowColor = "transparent"; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.2; ctx.lineJoin = "round"; ctx.stroke();
  ctx.restore();
  if (pk < .45) { const k = pk / .45; ctx.strokeStyle = `rgba(255,255,255,${.7 * (1 - k)})`; ctx.lineWidth = 2 * S; ctx.beginPath(); ctx.arc(cur.x, cur.y, (6 + k * 22) * S, 0, 7); ctx.stroke(); }
}

// ---------- one loop for everything ----------
function frame(t) {
  now = t / 1000; const dt = Math.min(.05, last ? now - last : 1 / 60); last = now;
  if (T0 < 0) { T0 = now; modeT = now; }
  if (CONFIG.auto) runAuto();
  for (let i = later.length - 1; i >= 0; i--) if (now >= later[i].t) { const f = later[i].fn; later.splice(i, 1); f(); }
  if (autoType && now > autoType && mode === "run") { typeKey(); autoType = mode === "run" ? now + .11 : 0; }

  // ----- simulation -----
  if (prewarm) {                                               // start mid-chaos: smoke already rising
    prewarm = false; const f = fanPos();
    for (let k = 1; k < 14; k++) parts.push({ kind: "smoke", x: f.x + rnd(-6, 6) * S, y: f.y - f.r * .7, vx: rnd(-8, 14) * S, vy: -rnd(26, 46) * S, r: rnd(7, 11) * S, t0: now - k * .1, life: rnd(1, 1.5), g: rnd(150, 200) });
  }
  levelS += (level - levelS) * Math.min(1, dt * 7); boost *= Math.exp(-dt * 1.6);
  const L = Math.min(1.999, levelS), spd = lerp(SPD[Math.floor(L)], SPD[Math.floor(L) + 1], L % 1) * (1 + boost) * Math.max(.2, CONFIG.speed);
  if (mode === "run") {
    omega = 5.6 * spd; ang += omega * dt; legPh += 27 * Math.pow(spd, .75) * dt;
    count += CONFIG.counter.perSec * Math.pow(spd, 2.2) * dt;
    heat = Math.min(1, heat + dt * .2); cpuT -= dt; if (cpuT < 0) { cpu = 97 + Math.floor(Math.random() * 3); cpuT = .14; }
    fanW = 30 + 10 * levelS; smokeT -= dt * (1 + levelS * .8); sparkT -= dt * (1 + levelS * 1.6 + boost * 2); sweatT -= dt * (1 + levelS);
    if (smokeT < 0) { smokeT = .1; const f = fanPos(); parts.push({ kind: "smoke", x: f.x + rnd(-6, 6) * S, y: f.y - f.r * .7, vx: rnd(-8, 14) * S, vy: -rnd(26, 46) * S, r: rnd(7, 11) * S * (1 + levelS * .25), t0: now, life: rnd(1, 1.5), g: rnd(150, 200) - levelS * 30 }); }
    if (sparkT < 0) { sparkT = .09; spark(1); }
    if (sweatT < 0) { sweatT = .32; parts.push({ kind: "sweat", x: hamX + HU * .1, y: hamY - HU * 1.0, vx: -rnd(90, 160) * S, vy: -rnd(60, 130) * S, t0: now, life: .55, r: HU * .07 }); }
    if (AC && whirr) { whirr.f.frequency.value = 260 + omega * 36; whirr.g.gain.value = .02 + .025 * levelS; if (Math.floor(ang / (Math.PI * 2)) !== Math.floor((ang - omega * dt) / (Math.PI * 2)) && levelS < .5) sfx.squeak(); }
  } else {
    if (AC && whirr) whirr.g.gain.value = 0;
    omega = 0; ang = ang + Math.sin((now - wobT) * 22) * wob * Math.exp(-(now - wobT) * 6) * dt * 22;
    cpu = lerp(cpu, 3, Math.min(1, dt * 5)); heat = Math.max(0, heat - dt * 1.2); fanW *= Math.exp(-dt * 1.4);
  }
  fanA += fanW * dt;
  shake *= Math.exp(-dt * 7); panelHit *= Math.exp(-dt * 14);

  // the hamster's place: running in the wheel / flying / sitting on the terminal
  const climb = .1 + .09 * levelS + .05 * boost, rin = WR * .93;
  const wx = WCX + Math.sin(climb) * rin, wy = WCY + Math.cos(climb) * rin;
  const LX = clamp(W * .7, HU * 1.2, W - HU * 1.4), LY = CODEB;
  let ham = null;
  if (mode === "run") { hamX = wx; hamY = wy; ham = { pose: "run", x: wx, y: wy, rot: -climb, ph: legPh, exp: levelS > 1.4 ? "blur" : "go", blur: clamp(levelS - 1.3, 0, .7) / .7 * .85 }; }
  else {
    const k = now - modeT;
    if (mode === "fly" && k < FLY) {
      const u = k / FLY, p0 = { x: hamX, y: hamY }, p2 = { x: LX - 18 * S, y: LY }, pk = WCY - WR * 1.05;
      const p1 = { x: lerp(p0.x, p2.x, .35), y: 2 * pk - (p0.y + p2.y) / 2 };
      const x = (1 - u) ** 2 * p0.x + 2 * u * (1 - u) * p1.x + u * u * p2.x, y = (1 - u) ** 2 * p0.y + 2 * u * (1 - u) * p1.y + u * u * p2.y;
      hamRot = -climb + u * Math.PI * 2 * 1.5;
      ham = { pose: "fly", x, y, rot: hamRot, exp: "shock" };
      if (Math.random() < .5) parts.push({ kind: "trail", x, y: y - HU * .5, t0: now, life: .25 });
    } else {
      const q = now - modeT;                                       // modeT stays the break time
      if (mode === "fly" && q >= SIT) { mode = "done"; exitT = now; }
      let x = LX, y = LY, sq = 0, exp = "dizzy", rot = 0;
      if (q < FLY + B1) { const u = (q - FLY) / B1; x = lerp(LX - 18 * S, LX - 6 * S, u); y = LY - 4 * u * (1 - u) * HU * .75; sq = u < .18 ? Math.sin(u / .18 * Math.PI) * .45 : 0; rot = (1 - u) * .5; }
      else if (q < SIT) { const u = (q - FLY - B1) / HOP; x = lerp(LX - 6 * S, LX, u); y = LY - 4 * u * (1 - u) * HU * .2; sq = u < .25 ? Math.sin(u / .25 * Math.PI) * .25 : 0; }
      else { const u = q - SIT; sq = u < .2 ? Math.sin(u / .2 * Math.PI) * .12 : 0; rot = Math.sin(u * 7) * .07 * clamp(1 - (q - THUMB + .3) / .3, 0, 1); }
      const th = q > THUMB ? outBack((q - THUMB) / .3) : 0;
      if (q > THUMB - .1) exp = "happy";
      ham = { pose: "sit", x, y, sq, rot, exp, thumb: th, dizzy: clamp((THUMB - q) / .25, 0, 1) * clamp((q - FLY) / .1, 0, 1) };
      hamX = x; hamY = y;
    }
  }
  // landing events (one-shot via flags on the mode clock)
  if (mode !== "run") {
    const q = now - modeT;
    for (const [tm, name] of [[FLY, "land"], [FLY + B1, "land2"], [SIT, "sit"], [THUMB, "thumb"]]) {
      if (q >= tm && q - dt < tm) {
        ev(name);
        if (name === "land") { sfx.boing(1); panelHit = 6 * S; shake = .6; for (let k = 0; k < 12; k++) parts.push({ kind: "dust", x: LX - 18 * S + rnd(-HU * .6, HU * .6), y: LY - rnd(0, 4) * S, vx: rnd(-110, 110) * S, vy: -rnd(20, 70) * S, r: rnd(4, 9) * S, t0: now, life: rnd(.3, .55) }); }
        if (name === "land2") { sfx.boing(1.5); panelHit = 3 * S; }
        if (name === "sit") { sfx.twinkle(); sfx.ding(); }
        if (name === "thumb") { say("h", CONFIG.quips.ok, 1.6); for (let k = 0; k < 8; k++) { const a = rnd(0, 7); parts.push({ kind: "twinkle", x: LX + HU * .66 + Math.cos(a) * HU * .4, y: LY - HU * .9 + Math.sin(a) * HU * .4, t0: now + k * .03, life: .5 }); } }
      }
    }
  }

  // ----- draw -----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const sx = rnd(-1, 1) * shake * 3 * S, sy = rnd(-1, 1) * shake * 3 * S;
  ctx.save(); ctx.translate(sx, sy);
  if (mode === "run") { ctx.fillStyle = `rgba(255,70,50,${.035 * heat * (1 + levelS)})`; ctx.fillRect(0, AR, W, A); }
  drawCode(); drawHUD();
  for (const p of parts) if (p.kind === "smoke") { const k = (now - p.t0) / p.life; if (k < 0 || k > 1) continue; const r = p.r * (1 + k * 1.8);
    ctx.fillStyle = `rgba(${p.g | 0},${p.g | 0},${(p.g + 12) | 0},${.42 * (1 - k) * Math.min(1, k * 6)})`; ctx.beginPath(); ctx.arc(p.x + p.vx * k * p.life, p.y + p.vy * k * p.life, r, 0, 7); ctx.fill(); }
  drawFan();
  drawStand(); drawWheelBack(); drawWheelFront();
  if (ham && mode === "run") {
    if (ham.blur > .05) for (const g of [.42, .24]) drawHamster({ ...ham, u: HU, x: ham.x - g * HU * ham.blur, alpha: (.5 - g * .7) * ham.blur, exp: "blur" });
    drawHamster({ ...ham, u: HU, x: ham.x + (ham.blur ? rnd(-1, 1) * S * 1.5 : 0) });
  }
  drawPlate();
  if (ham && mode === "run") drawBubble("h", ham.x + HU * 1.2, ham.y - HU * 1.25);
  for (const p of parts) {
    const k = (now - p.t0) / p.life; if (k < 0 || k > 1 || p.kind === "smoke") continue;
    if (p.kind === "spark") { const x = p.x + p.vx * k * p.life, y = p.y + p.vy * k * p.life + 300 * S * (k * p.life) ** 2;
      ctx.strokeStyle = `rgba(255,${200 + 55 * (1 - k) | 0},120,${1 - k})`; ctx.lineWidth = 2 * S; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * .025, y - p.vy * .025); ctx.stroke(); }
    if (p.kind === "sweat") { const x = p.x + p.vx * k * p.life, y = p.y + p.vy * k * p.life + 500 * S * (k * p.life) ** 2, a = Math.atan2(p.vy + 1000 * S * k * p.life, p.vx);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a - Math.PI / 2); ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.moveTo(0, -p.r * 1.8); ctx.quadraticCurveTo(p.r, 0, 0, p.r); ctx.quadraticCurveTo(-p.r, 0, 0, -p.r * 1.8);
      ctx.fillStyle = "#8fd3ff"; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2 * S; ctx.stroke(); ctx.restore(); }
  }
  ctx.restore();
  ctx.save(); ctx.translate(sx * .5, sy * .5);
  drawPanel();
  ctx.restore();
  drawTabs();
  // flying / landed hamster on top of everything
  if (ham && mode !== "run") {
    for (const p of parts) if (p.kind === "trail") { const k = (now - p.t0) / p.life; if (k < 0 || k > 1) continue; ctx.fillStyle = `rgba(255,255,255,${.25 * (1 - k)})`; ctx.beginPath(); ctx.arc(p.x, p.y, HU * .2 * (1 - k), 0, 7); ctx.fill(); }
    for (const p of parts) if (p.kind === "dust") { const k = (now - p.t0) / p.life; if (k < 0 || k > 1) continue; ctx.fillStyle = `rgba(200,200,212,${.5 * (1 - k)})`; ctx.beginPath(); ctx.arc(p.x + p.vx * k * p.life, p.y + p.vy * k * p.life, p.r * (1 + k), 0, 7); ctx.fill(); }
    ctx.fillStyle = "rgba(0,0,0,.35)"; if (ham.pose === "sit") { ctx.beginPath(); ctx.ellipse(ham.x, LY + panelHit + 2 * S, HU * .55, HU * .08, 0, 0, 7); ctx.fill(); }
    drawHamster({ ...ham, u: HU, y: ham.y + (ham.pose === "sit" ? panelHit : 0) });
    for (const p of parts) if (p.kind === "twinkle") { const k = (now - p.t0) / p.life; if (k < 0 || k > 1) continue; star(p.x, p.y - k * 14 * S, HU * .09 * Math.sin(k * Math.PI), k * 3, "#ffe28a"); }

}

document.fonts && document.fonts.ready.then(resize);
requestAnimationFrame(frame);
</script>
