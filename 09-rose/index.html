<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A rose that never dies</title>
<meta name="description" content="A 3D rose made of 18,000 glowing particles. Free code by @sicscod.drops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Dancing+Script:wght@600&display=block">
<style>
html,body{height:100%;margin:0;background:#07030a;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
.words{position:fixed;left:0;right:0;bottom:11%;text-align:center;padding:0 24px;pointer-events:none;color:#ffe9ee}
.to{margin:0;font:600 clamp(34px,10vw,52px) "Dancing Script",cursive;text-shadow:0 0 22px rgba(255,60,100,.55)}
.sub{margin:6px 0 0;font:400 clamp(13px,3.6vw,16px) "Figtree",system-ui,sans-serif;color:#c49aa6;letter-spacing:.02em}
.to,.sub{opacity:0}
.credit{position:fixed;bottom:14px;left:0;right:0;text-align:center;font:12px "Figtree",system-ui,sans-serif;color:#8a6f78;opacity:.6}
.credit a{color:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="words"><p class="to" id="to"></p><p class="sub" id="sub"></p></div>
<div class="credit">free code by <a href="https://www.instagram.com/sicscod.drops/" target="_blank" rel="noopener">@sicscod.drops</a></div>
<script>
// ===== 3D Rose · free code by @sicscod.drops =====
// Send it: yoursite/?name=Delly&sub=a%20rose%20that%20never%20dies
const url = new URLSearchParams(location.search);
const CONFIG = {
  name: url.get("name") || "Delly",
  sub: url.get("sub") || "a rose that never dies · tap for petals",
  petal: url.get("petal") || "#ff2f55",  // petal colour
  tip: url.get("tip") || "#ffb3c4",      // petal edge colour
  stem: "#3ddc84",
  particles: 18000,
  bloom: 0.62,                           // how far it opens (0 bud .. 1 wide open)
  spin: 0.35                             // turns per ~18 s
};
document.getElementById("to").textContent = "for " + CONFIG.name;
document.getElementById("sub").textContent = CONFIG.sub;

const cv = document.getElementById("c"), g = cv.getContext("2d");
const layer = document.createElement("canvas"), lg = layer.getContext("2d");
let W, H, D, S, pts = [], falling = [], t0 = 0;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const PET = hex(CONFIG.petal), TIP = hex(CONFIG.tip), STEM = hex(CONFIG.stem);
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k | 0);
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;

// ---- the rose: layers of petals, each petal a curved sheet around the centre ----
// layer L: how many petals, how long, how open when fully bloomed
const LAYERS = [
  { n: 2, len: .26, open: .06, curl: .1, twist: 1.2 },
  { n: 3, len: .31, open: .14, curl: .3, twist: .8 },
  { n: 3, len: .36, open: .26, curl: .6, twist: .4 },
  { n: 4, len: .40, open: .40, curl: 1.0, twist: .2 },
  { n: 5, len: .47, open: .58, curl: 1.4, twist: 0 },
  { n: 5, len: .47, open: .80, curl: 1.8, twist: 0 },
  { n: 6, len: .5, open: 1.05, curl: 2.0, twist: 0 }
];
const petals = [];
LAYERS.forEach((L, li) => { for (let k = 0; k < L.n; k++)
  petals.push({ ...L, li, phi: k / L.n * Math.PI * 2 + li * 2.4, width: Math.PI * 2 / L.n * 1.45 }); });

// point on a petal: u = base→top, v = -1..1 across, bloom = 0 (bud) .. 1 (open)
function petalPoint(P, u, v, bloom){
  const open = P.open * (.3 + .7*bloom), curl = P.curl * bloom;
  u *= 1 - .28*v*v;                                            // rounded top edge
  // walk up the petal: round bowl at the bottom, then it rises at angle "open", the rim rolls outward
  let x = .012 * P.li, y = 0, steps = 10, ds = P.len * u / steps;
  for (let i = 1; i <= steps; i++){
    const s = u * i / steps, k = Math.min(1, s / .3);
    const th = 1.45 + (open - 1.45) * (1 - (1 - k)*(1 - k)) + curl * s*s*s;
    x += Math.sin(th) * ds; y += Math.cos(th) * ds;
  }
  const a = P.phi + v * P.width * .5 + P.twist * u * (1 - bloom*.5); // inner petals wrap in a spiral
  const r = x - v*v * .035 * u;                         // cupped: edges fold inward
  return [Math.cos(a) * r, -y, Math.sin(a) * r];
}

function build(){
  pts = [];
  const nStem = CONFIG.particles * .1 | 0, nLeaf = CONFIG.particles * .08 | 0;
  const nPet = CONFIG.particles - nStem - 2*nLeaf;
  for (let i = 0; i < nPet; i++){
    const P = petals[Math.random() * petals.length | 0];
    const rim = Math.random() < .3;                              // 30% outline the rim, so each petal reads
    const u = rim ? 1 : .06 + .94*Math.pow(Math.random(), .7), v = Math.random()*2 - 1;
    const edgeK = u * (1 - .28*v*v);                            // rims are paler
    pts.push({ kind: 0, P, u, v, c: mix(PET, TIP, Math.pow(edgeK, 4)), s: Math.random(), a: P.li < 2 && !rim ? .45 : 1 });
  }
  for (let i = 0; i < nStem; i++){                            // stem: gentle S-curve down
    const k = Math.random(), a = Math.random()*Math.PI*2;
    pts.push({ kind: 1, x: .02*Math.sin(k*3) + Math.cos(a)*.012, y: .02 + k*1.05, z: Math.sin(a)*.012, c: STEM, s: Math.random() });
  }
  for (const side of [-1, 1]) for (let i = 0; i < nLeaf; i++){ // two leaves
    const u = Math.random(), v = Math.random()*2 - 1, w = Math.sin(Math.PI*u) * .07;
    const y0 = side < 0 ? .55 : .72;
    pts.push({ kind: 1, x: side * (.02 + u*.26), y: y0 - u*.12 + u*u*.08 + v*w*.3, z: v*w + side*.03, c: mix(STEM, [180,255,200], Math.abs(v)*.3), s: Math.random() });
  }
  // every particle starts scattered and flies home
  for (const p of pts){ p.sx = (Math.random()-.5)*3; p.sy = (Math.random()-.5)*3.4; p.sz = (Math.random()-.5)*2; p.d = Math.random()*.9; }
}

function resize(){
  D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = layer.width = W*D; cv.height = layer.height = H*D;
  g.setTransform(D, 0, 0, D, 0, 0); lg.setTransform(D, 0, 0, D, 0, 0);
  S = Math.min(W * .8, H * .56);
}

// ---- falling petals (tap for more) ----
function dropPetal(x, y, burst){
  falling.push({ x, y, vx: burst ? (Math.random()-.5)*160 : (Math.random()-.5)*20, vy: burst ? -60 - Math.random()*120 : 10,
    r: 7 + Math.random()*7, rot: Math.random()*6, vr: (Math.random()-.5)*3, sw: Math.random()*6, c: mix(PET, TIP, Math.random()*.5) });
}
cv.addEventListener("pointerdown", e => { for (let i = 0; i < 14; i++) dropPetal(e.clientX, e.clientY, true); });

function drawPetal(f){
  g.save(); g.translate(f.x, f.y); g.rotate(f.rot); g.scale(1, .55 + .45*Math.sin(f.sw*2));
  const gr = g.createRadialGradient(0, -f.r*.3, 0, 0, 0, f.r);
  gr.addColorStop(0, `rgba(${TIP.join(",")},.95)`); gr.addColorStop(1, `rgba(${f.c.join(",")},.85)`);
  g.fillStyle = gr; g.beginPath();
  g.moveTo(0, f.r); g.bezierCurveTo(f.r*1.1, f.r*.2, f.r*.7, -f.r, 0, -f.r*.6);
  g.bezierCurveTo(-f.r*.7, -f.r, -f.r*1.1, f.r*.2, 0, f.r); g.fill();
  g.restore();
}

let last = 0, lastDrop = 0;
function frame(now){
  if (!t0) t0 = now;
  const t = (now - t0) / 1000, dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
  g.globalCompositeOperation = "source-over";
  const bg = g.createRadialGradient(W/2, H*.4, 0, W/2, H*.4, H*.7);
  bg.addColorStop(0, "#1c0612"); bg.addColorStop(1, "#07030a");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  const bloom = ease(clamp((t - 2.2) / 4.5)) * CONFIG.bloom;
  const yaw = t * CONFIG.spin, cy = Math.cos(yaw), sy = Math.sin(yaw);
  const pitch = .62, cp = Math.cos(pitch), sp = Math.sin(pitch);
  const ox = W/2, oy = H*.36, cam = 2.6;
  lg.globalCompositeOperation = "source-over"; lg.clearRect(0, 0, W, H);
  lg.globalCompositeOperation = "lighter";
  for (const p of pts){
    let x, y, z;
    if (p.kind === 0) [x, y, z] = petalPoint(p.P, p.u, p.v, bloom); else { x = p.x; y = p.y; z = p.z; }
    const k = ease(clamp((t - .2 - p.d) / 2.2));
    x = p.sx + (x - p.sx)*k; y = p.sy + (y - p.sy)*k; z = p.sz + (z - p.sz)*k;
    // spin around the stem, tilt towards the camera
    const x1 = x*cy - z*sy, z1 = x*sy + z*cy;
    const y2 = y*cp - z1*sp, z2 = y*sp + z1*cp;
    const f = cam / (cam + z2);
    const px = ox + x1*S*f, py = oy + y2*S*f;
    const shade = .45 + .55*clamp(.6 - z2*1.2);                  // closer = brighter
    const tw = .75 + .25*Math.sin(t*3 + p.s*20);
    lg.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${.5*shade*tw*(p.a || 1)})`;
    const s = (1 + p.s*.9) * f;
    lg.fillRect(px, py, s, s);
  }
  g.globalCompositeOperation = "lighter"; g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = `blur(${6*D}px)`; g.drawImage(layer, 0, 0); g.filter = "none"; g.drawImage(layer, 0, 0);
  g.setTransform(D, 0, 0, D, 0, 0); g.globalCompositeOperation = "source-over";

  // petals drift down after the bloom
  if (t > 6.5 && now - lastDrop > 650){ dropPetal(ox + (Math.random()-.5)*S*.5, oy - S*.1, false); lastDrop = now; }
  falling = falling.filter(f => {
    f.vy += 60*dt; f.vy = Math.min(f.vy, 70); f.vx *= .985; f.sw += dt*2;
    f.x += (f.vx + Math.sin(f.sw)*28)*dt; f.y += f.vy*dt; f.rot += f.vr*dt;
    drawPetal(f);
    return f.y < H + 30;
  });

  document.getElementById("to").style.opacity = clamp((t - 6) / 1.2);
  document.getElementById("sub").style.opacity = clamp((t - 7.2) / 1) * .85;
  requestAnimationFrame(frame);
}
addEventListener("resize", () => resize());
resize(); build();
document.fonts.load('40px "Dancing Script"').finally(() => requestAnimationFrame(frame));
</script>
</body>
</html>
