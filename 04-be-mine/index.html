<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A question for you</title>
<meta name="description" content="One question. The No button is shy. Free code by @sicscod.drops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#09060D;--ink:#FFF4F7;--pink:#FF4D8D;--pink2:#FF9EC1;--mute:#B9A6B3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 60% at 50% 38%,#3A0D24 0%,#16070F 55%,var(--bg) 100%);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0} #fx{z-index:10}
.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center}
.heart{width:92px;height:92px;filter:drop-shadow(0 0 18px rgba(255,77,141,.8)) drop-shadow(0 0 42px rgba(255,77,141,.45));animation:beat 1.26s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.14)}24%{transform:scale(1)}36%{transform:scale(1.08)}}
.ask,.done{display:flex;flex-direction:column;align-items:center;gap:22px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:clamp(34px,9vw,60px);line-height:1.04;margin:0;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 0 30px rgba(255,77,141,.35)}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--pink),var(--pink2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:-8px 0 0;font-size:16px;color:var(--mute)}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:70px}
button{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:999px;padding:15px 36px;cursor:pointer;color:#fff}
#yes{background:linear-gradient(135deg,#FF3D7F,#FF77A8);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 0 26px rgba(255,61,127,.55);transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
#no{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);white-space:nowrap}
#no.run{position:fixed;z-index:5;transition:left .3s cubic-bezier(.2,.9,.3,1.3),top .3s cubic-bezier(.2,.9,.3,1.3),transform .3s}
.done{display:none}
.yes .ask{display:none} .yes .done{display:flex;animation:pop .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.done h1{font-size:clamp(46px,13vw,84px)}
.credit{position:fixed;z-index:2;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute);opacity:.6}
.credit a{color:inherit}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main class="stage" id="stage">
  <svg class="heart" viewBox="0 0 100 90" aria-hidden="true"><path d="M50 86C22 64 4 48 4 28 4 14 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 10 24 24 0 20-18 36-46 58z" fill="none" stroke="#FF4D8D" stroke-width="6" stroke-linejoin="round"/></svg>
  <div class="ask">
    <h1 id="q"></h1>
    <p class="sub" id="sub"></p>
    <div class="btns"><button id="yes" type="button">Yes</button><button id="no" type="button">No</button></div>
  </div>
  <div class="done">
    <h1 id="doneTitle"></h1>
    <p class="sub" id="doneSub" style="margin:0"></p>
  </div>
</main>
<canvas id="fx"></canvas>
<div class="credit">free code by <a href="https://www.instagram.com/sicscod.drops/" target="_blank" rel="noopener">@sicscod.drops</a></div>
<script>
// ===== Be Mine · free code by @sicscod.drops =====
// Share it without coding: yoursite/?name=Delly&date=Friday,%207pm
const url = new URLSearchParams(location.search);
const CONFIG = {
  name: url.get("name") || "Delly",
  date: url.get("date") || "Friday, 7 pm",
  question: "Will you be my girlfriend, <em>{name}</em>?",
  sub: "(choose wisely)",
  noTexts: ["No", "Are you sure?", "Really sure?", "Think again 🥺", "Last chance", "Error 404", "Button broken", "Just press Yes"],
  doneTitle: "YAY ❤️",
  doneSub: "I knew it. See you {date}."
};

const $ = id => document.getElementById(id);
const safe = s => s.replace(/[<>&"]/g, "");
$("q").innerHTML = CONFIG.question.replace("{name}", safe(CONFIG.name));
$("sub").textContent = CONFIG.sub;
$("doneTitle").textContent = CONFIG.doneTitle;
$("doneSub").textContent = CONFIG.doneSub.replace("{date}", CONFIG.date);

// ---- the No button runs away ----
const no = $("no"), yes = $("yes");
let tries = 0;
function flee(px, py){
  const r = no.getBoundingClientRect();
  if (!no.classList.contains("run")){ no.style.left = r.left + "px"; no.style.top = r.top + "px"; no.classList.add("run"); }
  const W = innerWidth, H = innerHeight, pad = 16;
  let x, y, n = 0;
  do { x = pad + Math.random()*(W - r.width - pad*2); y = pad + Math.random()*(H - r.height - pad*2); }
  while (++n < 50 && (Math.hypot(x + r.width/2 - px, y + r.height/2 - py) < 170 || nearYes(x, y, r)));
  sparks(r.left + r.width/2, r.top + r.height/2, 14, .5);
  no.style.left = x + "px"; no.style.top = y + "px";
  tries++;
  no.textContent = CONFIG.noTexts[Math.min(tries, CONFIG.noTexts.length - 1)];
  no.style.transform = `scale(${Math.max(.6, 1 - tries*.05)})`;
  yes.style.transform = `scale(${Math.min(1.8, 1 + tries*.11)})`;
}
function nearYes(x, y, r){ const b = yes.getBoundingClientRect(); return !(x + r.width < b.left - 24 || x > b.right + 24 || y + r.height < b.top - 24 || y > b.bottom + 24); }
no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") flee(e.clientX, e.clientY); });
no.addEventListener("pointerdown", e => { e.preventDefault(); flee(e.clientX, e.clientY); });
no.addEventListener("click", e => e.preventDefault());

// ---- Yes: heart fireworks ----
yes.addEventListener("click", () => {
  const b = yes.getBoundingClientRect();
  sparks(b.left + b.width/2, b.top + b.height/2, 160, 1.6);
  no.style.display = "none"; raining = true;
  setTimeout(() => document.body.classList.add("yes"), 200);
});

// ---- background: stars + floating hearts; fx: heart particles ----
const sky = $("sky"), sg = sky.getContext("2d"), fx = $("fx"), fg = fx.getContext("2d");
let W, H, stars = [], floaters = [], parts = [], raining = false;
function resize(){
  const d = devicePixelRatio; W = innerWidth; H = innerHeight;
  for (const c of [sky, fx]){ c.width = W*d; c.height = H*d; c.getContext("2d").setTransform(d, 0, 0, d, 0, 0); }
  stars = Array.from({length: 120}, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.3 + .3, p: Math.random()*6 }));
}
resize(); addEventListener("resize", resize);
function heartPath(g, x, y, s){
  g.beginPath(); g.moveTo(x, y + s*.3);
  g.bezierCurveTo(x - s, y - s*.5, x - s*.5, y - s*1.2, x, y - s*.55);
  g.bezierCurveTo(x + s*.5, y - s*1.2, x + s, y - s*.5, x, y + s*.3);
}
const COLS = ["#FF4D8D", "#FF9EC1", "#FF1F6B", "#FFD1E1", "#ffffff"];
function sparks(x, y, n, power){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = (1 + Math.random()*6)*power;
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 2*power, s: 3 + Math.random()*7, c: COLS[i % 5], life: 1, heart: power > 1 || i % 3 === 0 });
  }
}
function loop(t){
  sg.clearRect(0, 0, W, H);
  for (const s of stars){ sg.globalAlpha = .25 + .6*Math.abs(Math.sin(t/900 + s.p)); sg.fillStyle = "#fff"; sg.fillRect(s.x, s.y, s.r, s.r); }
  if (Math.random() < (raining ? .5 : .05)) floaters.push({ x: Math.random()*W, y: H + 20, s: 4 + Math.random()*8, v: .4 + Math.random()*(raining ? 2.4 : .8), p: Math.random()*6 });
  floaters = floaters.filter(f => f.y > -30);
  for (const f of floaters){ f.y -= f.v; sg.globalAlpha = .55; sg.fillStyle = "#FF4D8D"; heartPath(sg, f.x + Math.sin(t/700 + f.p)*10, f.y, f.s); sg.fill(); }
  sg.globalAlpha = 1;
  fg.clearRect(0, 0, W, H);
  parts = parts.filter(p => (p.life -= .012) > 0);
  for (const p of parts){
    p.vy += .12; p.vx *= .985; p.x += p.vx; p.y += p.vy;
    fg.globalAlpha = Math.min(1, p.life*1.5); fg.fillStyle = p.c;
    if (p.heart){ heartPath(fg, p.x, p.y, p.s); fg.fill(); } else fg.fillRect(p.x, p.y, 3, 3);
  }
  fg.globalAlpha = 1;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
