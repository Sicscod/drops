<script>
// ===== Love Captcha · free code by @sicscod.drops =====
// Try: yoursite/?name=Delly&msg=just%20in%20love%20with%20Delly%20%E2%99%A5&hue=345   (?auto=1 plays it by itself)
const P = new URLSearchParams(location.search);
const hueP = parseFloat(P.get("hue"));
const CONFIG = {
  name: (P.get("name") || "Delly").slice(0, 14),                       // the person in the squares
  msg: (P.get("msg") || "just in love with {name} ♥").slice(0, 44),   // the last line after "verified"
  hue: isFinite(hueP) ? ((hueP % 360) + 360) % 360 : 345,               // 345 pink, 0 red, 280 purple, 200 blue
  auto: P.get("auto") === "1",                                          // a cursor plays the whole thing
  // round 1: the 3x3 grid, left to right, top to bottom. one of them is { person: true }
  tiles: [
    { label: "cat", emoji: "🐈", bg: "#e9e1f6" },
    { label: "pizza", emoji: "🍕", bg: "#fbe4c9" },
    { label: "laptop", emoji: "💻", bg: "#dde7f0" },
    { label: "my ex", ex: true, bg: "#e4e2df" },
    { label: "{name}", person: true },
    { label: "coffee", emoji: "☕", bg: "#eadbcc" },
    { label: "bed", emoji: "🛏️", bg: "#dcebe4" },
    { label: "phone", emoji: "📱", bg: "#e2e4ea" },
    { label: "dog", emoji: "🐕", bg: "#f5e6c8" },
  ],
  // round 2: every square is them. poses: badge wink shades laugh oh bow kiss crown hearteyes
  poses: ["wink", "shades", "laugh", "bow", "hearteyes", "oh", "kiss", "crown", "badge"],
  lines: {
    check: "I'm not a robot",
    ask: ["Select all squares with", "the person you love", "if you have to think, you're a robot"],
    again: ["Please also select", "all squares with {name}", "yes. all of them."],
    nudge: "please also select…",
    empty: "{name} is right there.",
    wrongTile: "that's a {what}. try again.",
    missed: "you missed {n}. look closer.",
    done: "verified: definitely not a robot.",
    score: "human 100% · robot 0% · in love: very",

  beat: 1.0,                                                            // seconds per heartbeat (lub-dub)

// ---------- setup ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const T0 = performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sm = x => (x = clamp(x, 0, 1), x * x * (3 - 2 * x));

const H = (l, s = 80, a = 1, dh = 0) => `hsla(${CONFIG.hue + dh},${s}%,${l}%,${a})`;
const nm = s => s.replace(/\{name\}/g, CONFIG.name);
const C = { bg: "#f3ece3", card: "#fffdfa", line: "#e3d9cd", ink: "#2a211d", mute: "#8a7c71", dim: "#b9ab9f", red: "#d9473f", skin: "#f7d5bd", hair: "#3d2721" };
const F = { ui: (w, s) => `${w} ${s}px "DM Sans", system-ui, sans-serif`, mono: (w, s) => `${w} ${s}px "DM Mono", ui-monospace, monospace`, serif: s => `italic 400 ${s}px "Instrument Serif", Georgia, serif`, emo: s => `${s}px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif` };

const CH = 540, CW = 338, T = 106, G = 4;
let W = 0, Hh = 0, DPR = 1, S = 1, OX = 0, OY = 0, DW = 400, X0 = 31;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; Hh = Math.max(240, innerHeight - 30);
  cv.width = Math.round(W * DPR); cv.height = Math.round(Hh * DPR);

  OX = (W - DW * S) / 2; OY = (Hh - CH * S) / 2;

addEventListener("resize", resize);
const toU = (x, y) => ({ x: (x - OX) / S, y: (y - OY) / S });
const inR = (p, r) => p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h;

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function heart(cx, cy, s, col) { heartPath(cx, cy, s); ctx.fillStyle = col; ctx.fill(); }
// text where every ♥ is drawn as a real heart (fonts draw ♥ very differently)
function measure(str, font, fs) { ctx.font = font; return str.split("♥").reduce((w, p, i) => w + ctx.measureText(p).width + (i ? fs * .78 : 0), 0); }

  ctx.fillStyle = col; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

    if (i) { heart(cx + fs * .39, y - fs * .33, fs * .56, hcol || col); cx += fs * .78; ctx.fillStyle = col; }
    ctx.fillText(p, cx, y); cx += ctx.measureText(p).width;

}
function check(x, y, s, k, col, lw) {      // a check mark drawn in by k (0..1)
  if (k <= 0) return; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const a = [x - s * .5, y], b = [x - s * .14, y + s * .36], c = [x + s * .55, y - s * .4];

// ---------- the person, drawn (9 poses) ----------
function person(cx, cy, s, pose, t, seed) {
  const r = s * .2, hx = cx, hy = cy - s * .03;
  ctx.save(); ctx.translate(hx, hy + s * .2); ctx.rotate(Math.sin(t * 3.1 + seed) * .055); ctx.translate(-hx, -hy - s * .2);
  // shoulders / top
  ctx.fillStyle = H(62, 70, 1, 10); rr(hx - r * 1.55, hy + r * 1.08, r * 3.1, r * 2, r * .9); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.moveTo(hx - r * .38, hy + r * 1.08); ctx.lineTo(hx, hy + r * 1.42); ctx.lineTo(hx + r * .38, hy + r * 1.08); ctx.fill();
  // hair (bob), neck, face
  ctx.fillStyle = C.hair; ctx.beginPath(); ctx.arc(hx, hy - r * .05, r * 1.22, Math.PI, 0); ctx.lineTo(hx + r * 1.22, hy + r * .95); ctx.quadraticCurveTo(hx + r * 1.2, hy + r * 1.1, hx + r * .9, hy + r * 1.05); ctx.lineTo(hx - r * .9, hy + r * 1.05); ctx.quadraticCurveTo(hx - r * 1.2, hy + r * 1.1, hx - r * 1.22, hy + r * .95); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ecc2a6"; ctx.fillRect(hx - r * .25, hy + r * .7, r * .5, r * .45);
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(hx, hy + r * .05, r * .92, r * .98, 0, 0, Math.PI * 2); ctx.fill();
  // bangs
  ctx.fillStyle = C.hair; ctx.beginPath(); ctx.moveTo(hx - r * 1.02, hy + r * .1); ctx.quadraticCurveTo(hx - r * 1.05, hy - r * 1.1, hx, hy - r * 1.06);
  ctx.quadraticCurveTo(hx + r * 1.05, hy - r * 1.1, hx + r * 1.02, hy + r * .1); ctx.quadraticCurveTo(hx + r * .7, hy - r * .42, hx + r * .1, hy - r * .48);
  ctx.quadraticCurveTo(hx - r * .25, hy - r * .2, hx - r * .45, hy - r * .5); ctx.quadraticCurveTo(hx - r * .8, hy - r * .3, hx - r * 1.02, hy + r * .1); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.beginPath(); ctx.ellipse(hx - r * .45, hy - r * .78, r * .28, r * .08, -.5, 0, 7); ctx.fill();
  // blush
  ctx.fillStyle = H(70, 90, pose === "oh" || pose === "kiss" ? .65 : .45, 0);
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(hx + sx * r * .55, hy + r * .38, r * .19, r * .11, 0, 0, 7); ctx.fill(); }
  // eyes
  const ey = hy + r * .12, ex = r * .37, ink = C.ink;
  const dot = (x, big) => { ctx.fillStyle = ink; ctx.beginPath(); ctx.ellipse(x, ey, r * (big ? .13 : .095), r * (big ? .15 : .12), 0, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + r * .04, ey - r * .05, r * (big ? .05 : .035), 0, 7); ctx.fill(); };
  const arcEye = (x, up) => { ctx.strokeStyle = ink; ctx.lineWidth = r * .1; ctx.lineCap = "round"; ctx.beginPath(); up ? ctx.arc(x, ey + r * .06, r * .15, Math.PI * 1.15, Math.PI * 1.85) : ctx.arc(x, ey - r * .06, r * .15, Math.PI * .15, Math.PI * .85); ctx.stroke(); };
  if (pose === "wink") { dot(-ex + hx); arcEye(hx + ex, true); }

  else if (pose === "kiss") { arcEye(hx - ex, false); arcEye(hx + ex, false); }
  else if (pose === "hearteyes") { for (const sx of [-1, 1]) heart(hx + sx * ex, ey + r * .02, r * .42 * (1 + .12 * Math.max(0, Math.sin(t * 9))), H(55, 85)); }
  else if (pose === "shades") {
    for (const sx of [-1, 1]) { heart(hx + sx * ex * 1.05, ey + r * .02, r * .62, "#2a1f24"); heart(hx + sx * ex * 1.05 - r * .05, ey - r * .05, r * .22, H(70, 80, .55)); }
    ctx.strokeStyle = "#2a1f24"; ctx.lineWidth = r * .08; ctx.beginPath(); ctx.moveTo(hx - r * .14, ey - r * .05); ctx.lineTo(hx + r * .14, ey - r * .05); ctx.stroke();

  // mouth
  const my = hy + r * .48; ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = r * .09; ctx.lineCap = "round";

    ctx.beginPath(); ctx.arc(hx, my - r * .06, r * .22, 0, Math.PI); ctx.closePath(); ctx.fillStyle = "#8e2f3a"; ctx.fill();
    ctx.fillStyle = "#f28a9a"; ctx.beginPath(); ctx.arc(hx, my + r * .1, r * .1, Math.PI, 0); ctx.fill();
  } else if (pose === "oh") { ctx.fillStyle = "#8e2f3a"; ctx.beginPath(); ctx.ellipse(hx, my + r * .02, r * .09, r * .12, 0, 0, 7); ctx.fill(); }
  else if (pose === "kiss") { heart(hx, my + r * .02, r * .3, "#d9475d"); }
  else if (pose === "shades") { ctx.beginPath(); ctx.arc(hx + r * .05, my - r * .1, r * .2, Math.PI * .25, Math.PI * .8); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(hx, my - r * .12, r * .2, Math.PI * .2, Math.PI * .8); ctx.stroke(); }

    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - r * .5, by - r * .32); ctx.lineTo(bx - r * .42, by + r * .3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + r * .5, by - r * .26); ctx.lineTo(bx + r * .38, by + r * .34); ctx.closePath(); ctx.fill();

    ctx.lineTo(hx, by - r * .55); ctx.lineTo(hx + r * .25, by - r * .15); ctx.lineTo(hx + r * .55, by - r * .45); ctx.lineTo(hx + r * .5, by + r * .1); ctx.closePath(); ctx.fill();

  ctx.restore();

}
// "my ex": a grey silhouette with a tiny skull
function ex(cx, cy, s, t) {
  const r = s * .2, hy = cy - s * .03;
  ctx.fillStyle = "#b3ada7"; rr(cx - r * 1.5, hy + r * 1.08, r * 3, r * 2, r * .9); ctx.fill();
  ctx.fillStyle = "#c4beb8"; ctx.beginPath(); ctx.arc(cx, hy, r * .95, 0, 7); ctx.fill();
  ctx.strokeStyle = "#7d766f"; ctx.lineWidth = r * .09; ctx.lineCap = "round";
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + sx * r * .5, hy + r * .08); ctx.lineTo(cx + sx * r * .22, hy + r * .08); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx - r * .22, hy + r * .5); ctx.lineTo(cx + r * .22, hy + r * .5); ctx.stroke();

// ---------- sound (tiny Web Audio blips, start after the first tap) ----------
let AC = null;
function audio() { if (!CONFIG.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { AC = null; } }

  tick() { tone("sine", 1200, 700, .07, .08); },

  nope() { tone("square", 150, 110, .22, .06); tone("square", 157, 116, .22, .045, .02); },
  yes() { [784, 988, 1175, 1568].forEach((f, i) => tone("triangle", f, f, .4, .08, i * .07)); },

const EV = window.__ev = [];                         // event log (the video renderer reads it to sync the music)

// ---------- state ----------
const PERSON = Math.max(0, CONFIG.tiles.findIndex(t => t.person));

function reset() {
  openT = -1; stage = 0; swapT = -1; doneT = -1; msgT = -9; shakeT = -9; hits = 0; beatN = 0; burstDone = false; parts = []; floaters = [];
  tiles = CONFIG.tiles.map((t, i) => ({ cur: t.person ? { pose: "badge" } : { tile: t }, prev: null, flipAt: -9, sel: false, selT: -9, i }));
}
reset();

// ---------- layout ----------
const barY = () => openT < 0 ? 206 : lerp(206, 8, inOut((now - openT) / .3));

const BOX = () => { const b = BAR(); return { x: b.x + 16, y: b.y + 14, w: 28, h: 28 }; };
const PAN = { y: 72, h: 456, head: 72 };
const tileR = i => ({ x: X0 + 6 + (i % 3) * (T + G), y: PAN.y + PAN.head + 6 + Math.floor(i / 3) * (T + G), w: T, h: T });
const FOOT_Y = PAN.y + PAN.head + 6 + 3 * T + 2 * G + 6;
const VERIFY = () => ({ x: X0 + CW - 6 - 104, y: FOOT_Y, w: 104, h: 38 });
const CARD = () => { const w = Math.min(DW - 28, 372); return { x: (DW - w) / 2, y: 120, w, h: 296 }; };
const HEART_C = () => { const c = CARD(); return { x: DW / 2, y: c.y + 98 }; };
const panelOpen = () => openT >= 0 && now - openT > .3 && doneT < 0;

// ---------- actions ----------
function say(s, bad = true) { msg = s; msgT = now; msgBad = bad; }
function tick() { if (openT >= 0) return; openT = now; stage = 1; sfx.tick(); ev("check"); }
function tapTile(i) {
  const t = tiles[i]; if (stage === 2 && now < t.flipAt + .3) return;

  pressV = now;
  if (stage === 1) {
    const wrong = tiles.filter(t => t.sel && !t.cur.pose);
    if (wrong.length) { wrong.forEach(t => { t.sel = false; t.selT = now; }); hits = tiles.filter(t => t.sel).length; say(nm(CONFIG.lines.wrongTile.replace("{what}", nm(wrong[0].cur.tile.label)))); shakeT = now; sfx.nope(); ev("nope"); return; }
    if (!tiles[PERSON].sel) { say(nm(CONFIG.lines.empty)); shakeT = now; sfx.nope(); ev("nope"); return; }

    stage = 2; swapT = now; shakeT = now; hits = 0; say(CONFIG.lines.nudge); sfx.nope(); ev("again");

    tiles.forEach((t, i) => { t.sel = false; t.selT = now; t.prev = t.cur; t.cur = { pose: CONFIG.poses[i % CONFIG.poses.length] }; t.flipAt = now + .22 + order.indexOf(i) * .05; });
    return;
  }

// ---------- ?auto=1: a scripted cursor plays the story (used for the video) ----------
const cur = { on: false, x: 0, y: 0, down: -9, seg: null };
const ctr = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
const SNAKE = [0, 1, 2, 5, 4, 3, 6, 7, 8];
const AUTO = [
  [0.00, "move", .07, () => ({ x: X0 + 30, y: 222 }), () => ({ x: X0 + 74, y: 262 })],

let autoT0 = 0, autoI = 0;

// ---------- input ----------

// ---------- particles ----------
function burstAt(r, n) {

function burst(n) {

function drawFloaters(dt, on) {

}

function drawBar() {

function drawTileContent(cnt, r, t, seed) {

function drawPanel() {

  const c = doneT >= 0 ? inOut((now - doneT - .18) / .32) : 0;

  ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(x + 22, y); ctx.lineTo(x + 30, y - 7); ctx.lineTo(x + 38, y); ctx.stroke();

  text(hd[0], x + 20 + sh, y + 27, F.ui(500, 13), 13, "rgba(255,255,255,.88)");
  text(nm(hd[1]), x + 20 + sh, y + 52, F.ui(700, 22), 22, "#fff");

}
function drawCursor() {

function frame() {

  const glow = ctx.createRadialGradient(W / 2, OY + 260 * S, 10, W / 2, OY + 260 * S, Math.max(W, Hh) * .75);
  glow.addColorStop(0, H(90, 80, doneT >= 0 ? .55 * sm((now - doneT - .5) / .6) + .2 : .2)); glow.addColorStop(1, "rgba(243,236,227,0)");
