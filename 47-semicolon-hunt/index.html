<html lang="en">

<body>

<script>
// ===== Semicolon Hunt · free code by @sicscod.drops =====
// Try: yoursite/?speed=1.5&hue=46   (?auto=1 plays the whole thing by itself)
const P = new URLSearchParams(location.search);
const num = (k, d) => P.get(k) !== null && P.get(k) !== "" && isFinite(+P.get(k)) ? +P.get(k) : d;
const CONFIG = {
  hue: num("hue", 46),                                   // the bug's colour, 0-360 (46 gold, 0 red, 200 blue)
  speed: Math.max(.3, Math.min(3, num("speed", 1))),     // how fast it runs, 0.3-3
  auto: P.get("auto") === "1",                           // a swatter plays it by itself
  file: "app.js",
  // the snippet. write it WITH all its semicolons: the one on line `missing` runs away
  code: [
    "// TODO: find the missing ;",
    "const motto = \"works on my machine\";",
    "function ship(feature) {",
    "  const coffee = brew();",
    "  if (feature.works) {",
    "    deploy(feature, { env: \"prod\" });",
    "  }",
    "  let status = \"shipped\";",
    "  return status;",
    "}",
  ],
  missing: 8,                                            // line number (1-based) that loses its ';'
  // where it hides. find = text in the code. paren: squeezes between ( and ), brace: perches on { or },
  // string: dives into the string and peeks out
  hide: [
    { find: "brew()",   kind: "paren"  },
    { find: "works) {", kind: "brace"  },
    { find: "{ env",    kind: "brace"  },
    { find: "\" }",     kind: "brace"  },
    { find: "on my",    kind: "string" },
  ],
  dodges: 2,                                             // it always dodges the first N swats
  quips: { miss: ["nope!", "too slow", "missed me", "lol", "again?"], hide: ["shh", "not here", "..."], caught: "eek!" },
  error: "Expected ';'",
  build: "npm run build",
  success: "Build succeeded",
  hint: "tap the bug to swat it",
  sound: true,

// ---------- setup ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const outBack = x => (x = clamp(x, 0, 1), 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2));
const rnd = (a, b) => a + Math.random() * (b - a);
const F = { mono: '"JetBrains Mono", ui-monospace, monospace', ui: '"Space Grotesk", system-ui, sans-serif' };
const C = { bg: "#16161e", bar: "#101017", line: "#1f2030", gut: "#3b3e56", text: "#c0caf5", kw: "#bb9af7", str: "#9ece6a", fn: "#7aa2f7",
  com: "#565f89", punc: "#89ddff", prop: "#73daca", num: "#ff9e64", err: "#f7768e", ok: "#9ece6a", dim: "#5d6280" };
const HUE = ((CONFIG.hue % 360) + 360) % 360;
const BUG = `hsl(${HUE},96%,60%)`, BUGD = `hsl(${HUE},80%,38%)`, SWAT = `hsl(${(HUE + 140) % 360},62%,48%)`, SWATD = `hsl(${(HUE + 140) % 360},70%,28%)`;
const N = CONFIG.code.length, ML = clamp(CONFIG.missing | 0, 1, N) - 1;
const LINES = CONFIG.code.map((l, i) => i === ML ? l.replace(/;\s*$/, "") : l);
const SLOT = LINES[ML].length;                        // the column where ';' belongs
const MAXLEN = Math.max(...LINES.map(l => l.length), SLOT + 3 + CONFIG.error.length);
let W = 0, H = 0, DPR = 1, S = 1, FOOT = 26, TABH = 36, PANH = 110, STH = 22, FS = 16, LH = 26, CW = 10, GUT = 40, CX0 = 0, CY0 = 0, U = 30, CODEB = 0;
let SPOTS = [];
const cx = c => CX0 + c * CW, lineTop = l => CY0 + l * LH, base = l => CY0 + l * LH + LH * .68;

function colorize(s) {
  const out = Array(s.length).fill(C.text); let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (s.startsWith("//", i)) { for (; i < s.length; i++) out[i] = C.com; break; }
    if (ch === '"' || ch === "'" || ch === "`") { let j = i + 1; while (j < s.length && s[j] !== ch) j++; for (let k = i; k <= j && k < s.length; k++) out[k] = C.str; i = j + 1; continue; }
    if (/[A-Za-z_$]/.test(ch)) { let j = i; while (j < s.length && /[\w$]/.test(s[j])) j++; const w = s.slice(i, j);
      const col = /^(const|let|var|function|return|if|else|for|while|new|await|async|true|false|null|import|export|from|class)$/.test(w) ? C.kw
        : s[j] === "(" ? C.fn : s[i - 1] === "." || s[j] === ":" ? C.prop : C.text;
      for (let k = i; k < j; k++) out[k] = col; i = j; continue; }
    if (/\d/.test(ch)) out[i] = C.num; else if (/[{}()\[\];,.:=]/.test(ch)) out[i] = C.punc;
    i++;
  }
  return out;
}
// every character is a little spring so the bug can knock it over
const G = LINES.map(l => { const cols = colorize(l); return [...l].map((ch, k) => ({ ch, col: cols[k], x: 0, y: 0, r: 0, vx: 0, vy: 0, vr: 0, tx: 0, ty: 0, tr: 0, kn: false, back: -1 })); });

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  S = clamp(Math.min(W / 500, H / 560), .7, 1.4);
  TABH = 36 * S; STH = 22 * S; PANH = clamp(H * .2, 100 * S, 150 * S);
  CODEB = H - FOOT - PANH;
  ctx.font = `400 100px ${F.mono}`; const ratio = ctx.measureText("M").width / 100;
  const padX = 10 * S;
  const fsW = (W - padX * 2) / ((MAXLEN + 1) * ratio + 2.4);
  const fsH = (CODEB - TABH - 14 * S) / (N * 1.6);
  FS = clamp(Math.min(fsW, fsH), 9, 24); LH = FS * 1.6; CW = FS * ratio; GUT = FS * 2.4;
  CX0 = Math.max(padX, (W - GUT - (MAXLEN + 1) * CW) / 2) + GUT;
  CY0 = TABH + Math.max(7 * S, (CODEB - TABH - N * LH) / 2);
  U = LH * 2.0;
  SPOTS = [];
  for (const h of CONFIG.hide) {
    for (let l = 0; l < N; l++) {
      const i = LINES[l].indexOf(h.find); if (i < 0) continue;
      if (h.kind === "paren") { const k = LINES[l].indexOf("(", i); if (k >= 0) SPOTS.push({ kind: "paren", l, k, c: k + 1, fo: .9, s: .56 }); }
      else if (h.kind === "brace") { let k = i; while (k < i + h.find.length && !"{}".includes(LINES[l][k])) k++; if ("{}".includes(LINES[l][k])) SPOTS.push({ kind: "brace", l, k, c: k + .5, fo: .14, s: .84 }); }
      else SPOTS.push({ kind: "string", l, k: i, c: i + h.find.length / 2, fo: 1.04, s: .8, k0: i - 3, k1: i + h.find.length + 3 });
      break;
    }
  }
}

// ---------- state ----------
let now = 0, last = 0, mode = "hunt", swats = 0, caughtT = -9, snapT = -99, carry = null, snapA = null, shakeT = -9, errors = 1, quip = null;
const bug = { c: 0, l: 0, fo: .86, s: 1, air: 0, face: 1, phase: 0, mode: "idle", seg: null, spot: null, hs: null, h: 0, wait: 0, hideUntil: 0, hideT0: 0, look: { x: 0, y: 0 }, blink: 2 };
const sw = { x: 0, y: 0, seen: false, active: false, windT: -9, impT: -9, pend: null };
const dents = [], parts = [];
let flags = {};
const events = window.__events = [];
const ev = name => events.push([name, +now.toFixed(3)]);

// ---------- sound (Web Audio, starts on the first tap) ----------
let AC = null;
function audio() { if (!CONFIG.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { AC = null; } }
function tone(type, f0, f1, len, vol, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len * .8);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0006, t + len);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + len + .02);
}
function noise(len, vol, fc, q = 1, type = "bandpass") {
  if (!AC) return; const n = AC.sampleRate * len | 0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = type; f.frequency.value = fc; f.Q.value = q; g.gain.value = vol; s.buffer = b; s.connect(f).connect(g).connect(AC.destination); s.start();
}
let lastTick = 0;
const sfx = {
  tick() { if (now - lastTick < .03) return; lastTick = now; tone("square", rnd(2600, 3400), 2200, .018, .018); },
  hop() { tone("triangle", 380, 900, .12, .07); },
  whoosh() { noise(.14, .5, 1100, .8); },
  thwack() { noise(.12, 1.1, 700, .6, "lowpass"); tone("sine", 170, 55, .16, .35); },
  squeak() { tone("sine", 1500, 2700, .09, .12); tone("sine", 2600, 1700, .12, .1, .09); },
  click() { tone("square", 1900, 1200, .025, .07); noise(.03, .4, 4000, 1, "highpass"); },
  ding() { [1568, 1976, 2349, 3136].forEach((f, i) => tone("sine", f, f, 1.1, .1, i * .05)); },
  wink() { tone("sine", 2400, 3600, .09, .05); },
};

// ---------- the bug: moving, hiding, knocking things over ----------
const ground = (l, k) => ({ c: k + .5, l, fo: .86, s: 1 });
const atSpot = sp => ({ c: sp.c, l: sp.l, fo: sp.fo, s: sp.s, spot: sp });
const bugXY = () => ({ x: cx(bug.c), y: CY0 + (bug.l + bug.fo) * LH - bug.air });
const bugCenter = () => { const p = bugXY(); return { x: p.x, y: p.y - U * bug.s * .48 }; };
function go(to, style, dur) {
  const b = bug, d = Math.hypot(to.c - b.c, (to.l - b.l) * 1.6);
  b.seg = { t0: now, dur, c0: b.c, l0: b.l, fo0: b.fo, s0: b.s, c1: to.c, l1: to.l, fo1: to.fo, s1: to.s, style, h: LH * (.8 + .07 * d), spot: to.spot || null };
  b.mode = "move"; b.spot = null;
  if (style === "hop") { sfx.hop(); ev("hop"); } else ev("run");
}
function knock(l, k, dir, power) {
  const c = G[l] && G[l][k]; if (!c || c.ch === " ") return;
  if (c.kn && power < 1.2) return;
  c.kn = true; c.back = -1;
  c.tx = clamp(c.tx + (Math.random() - .5) * CW * .4 + dir * CW * .22 * power, -CW * 1.4, CW * 1.4);
  c.ty = clamp(c.ty + (Math.random() < .55 ? -1 : .7) * rnd(.12, .32) * LH * power, -LH * .9, LH * .7);
  c.tr = clamp(c.tr + (Math.random() - .5) * 1.1 * power, -1.4, 1.4);
  c.vy -= 160 * S * power; c.vr += (Math.random() - .5) * 18 * power; c.vx += dir * 60 * S * power;
  sfx.tick();
}
function knockRadius(x, y, r, power) {
  for (let l = 0; l < N; l++) for (let k = 0; k < G[l].length; k++) {
    const dx = cx(k + .5) - x, dy = lineTop(l) + LH * .45 - y, d = Math.hypot(dx, dy);
    if (d < r) knock(l, k, Math.sign(dx) || 1, power * (1.3 - d / r * .6));
  }
}
function land(s) {
  const b = bug; b.air = 0;
  if (s.spot) { b.mode = "hide"; b.spot = b.hs = s.spot; b.hideT0 = now; b.hideUntil = now + rnd(1.1, 2.3) / CONFIG.speed; ev("hide:" + s.spot.kind);
    const hq = CONFIG.quips.hide; if (CONFIG.auto ? s.spot.kind === "string" : Math.random() < .35) say(hq[Math.random() * hq.length | 0], .8, .15); }
  else { b.mode = "idle"; b.wait = now + rnd(.05, .35) / CONFIG.speed; }
  if (s.style === "hop") { const li = Math.round(b.l), k = Math.floor(b.c);
    if (!s.spot || s.spot.kind !== "string") for (const d of [-1, 0, 1]) knock(li, k + d, d || b.face, .8); }
}
function updateBug(dt) {
  const b = bug;
  if (b.mode === "move") {
    const s = b.seg, u = clamp((now - s.t0) / s.dur, 0, 1), e = s.style === "hop" ? sm(u) : u;
    b.c = lerp(s.c0, s.c1, e); b.l = lerp(s.l0, s.l1, e); b.fo = lerp(s.fo0, s.fo1, e); b.s = lerp(s.s0, s.s1, e);
    b.air = s.style === "hop" ? Math.sin(Math.PI * u) * s.h : 0;
    if (Math.abs(s.c1 - s.c0) > .01) b.face = Math.sign(s.c1 - s.c0);
    b.phase += dt * (s.style === "run" ? 30 : 6);
    if (s.style === "run") { const li = Math.round(b.l + b.fo - .86); for (let k = Math.floor(b.c - .6); k <= Math.floor(b.c + .6); k++) knock(li, k, b.face, .7); }
    if (u >= 1) land(s);
  } else if (b.mode === "idle" || b.mode === "hide") b.phase += dt * 2;
  b.h = b.mode === "hide" ? Math.min(1, b.h + dt * 9) : Math.max(0, b.h - dt * 9);
  if (b.h === 0 && b.mode !== "hide") b.hs = null;
  b.blink -= dt; if (b.blink < -.12) b.blink = rnd(1.4, 3.2);
  const c = bugCenter(), tx = sw.seen ? sw.x - c.x : b.face * 30, ty = sw.seen ? sw.y - c.y : 0, d = Math.hypot(tx, ty) || 1;
  b.look.x += (tx / d - b.look.x) * Math.min(1, dt * 10); b.look.y += (ty / d - b.look.y) * Math.min(1, dt * 10);
}
// interactive brain: wander, flee the swatter, hide
function think() {
  if (CONFIG.auto || mode !== "hunt") return;
  const b = bug, c = bugCenter(), near = sw.active && Math.hypot(sw.x - c.x, sw.y - c.y) < U * 2.8;
  if ((b.mode === "idle" && now > b.wait) || (b.mode === "hide" && (now > b.hideUntil || (near && now > b.hideT0 + .45)))) pick(near);
}
function pick(near) {
  const b = bug, sp = SPOTS.filter(s => s !== b.spot);
  let to;
  if (sp.length && Math.random() < (near ? .2 : .32)) to = atSpot(sp[Math.random() * sp.length | 0]);
  else {
    let best = null, bd = -1;
    for (let i = 0; i < (near ? 9 : 1); i++) {
      const l = clamp(Math.round(b.l + rnd(-3, 3)), 0, N - 1), len = Math.max(1, LINES[l].length), k = Math.floor(rnd(0, len));
      const t = ground(l, k), d = near ? Math.hypot(cx(t.c) - sw.x, base(l) - sw.y) : 0;
      if (d > bd) { bd = d; best = t; }
    }
    to = best;
  }
  const d = Math.hypot(to.c - b.c, (to.l - b.l) * 1.6);
  if (d < .5) { b.wait = now + .2; return; }
  const hop = Math.abs(to.l - b.l) > .5 && d < 9 || to.spot && d < 7;
  go(to, hop ? "hop" : "run", hop ? .3 / Math.sqrt(CONFIG.speed) : Math.max(.18, d / (12 * CONFIG.speed)));
}
function dodge(x, y) {
  let best = null, bd = -1;

    const l = clamp(Math.round(bug.l + rnd(-2, 2)), 0, N - 1), k = clamp(Math.round(bug.c + rnd(-8, 8)), 0, Math.max(0, LINES[l].length - 1)), t = ground(l, k);

}

// ---------- swatting ----------
function swat(x, y) {
  audio();
  if (mode === "done") { if (!CONFIG.auto && now - snapT > 1.4) reset(); return; }
  if (mode !== "hunt" || sw.pend) return;
  sw.x = x; sw.y = y; sw.seen = true; sw.windT = now; sw.pend = { x, y, t: now + .08 }; sfx.whoosh(); ev("swat");
  const c = bugCenter();
  if (!CONFIG.auto && swats < CONFIG.dodges && !(bug.mode === "move" && bug.seg.style === "hop") && Math.hypot(c.x - x, c.y - y) < U * 2.6) dodge(x, y);
}
function impact(x, y) {
  swats++; sw.impT = now; shakeT = now;
  const c = bugCenter(), airborne = bug.mode === "move" && bug.seg.style === "hop";
  const lucky = !CONFIG.auto && swats <= CONFIG.dodges;   // it always dodges the first N
  if (!airborne && !lucky && Math.hypot(c.x - x, c.y - y) < Math.max(U * .95, 30 * S)) {
    mode = "caught"; caughtT = now; bug.mode = "caught"; bug.spot = null; bug.h = 0; bug.hs = null;
    knockRadius(x, y, CW * 3.2, 1.5); sfx.thwack(); sfx.squeak(); say(CONFIG.quips.caught, .9, .12); ev("hit");
    for (let i = 0; i < 14; i++) { const a = rnd(0, 6.3), v = rnd(80, 240) * S; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 * S, t0: now, life: rnd(.3, .6), c: i % 2 ? "#fff" : BUG, s: rnd(1.5, 3) * S }); }
  } else {
    const seed = Math.random() * 100;
    dents.push({ x, y, t0: now, seed, r: 24 * S });
    knockRadius(x, y, CW * 2.6, 1.6); sfx.thwack(); ev("miss" + swats);
    for (let i = 0; i < 10; i++) { const a = rnd(0, 6.3), v = rnd(60, 200) * S; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40 * S, t0: now, life: rnd(.25, .5), c: "#c0caf5", s: rnd(1.2, 2.4) * S }); }
    const q = CONFIG.quips.miss; say(q[(swats - 1) % q.length], .85, .1);
  }
}
function say(text, life = .9, delay = 0) { quip = { text, t0: now + delay, life }; }
function slotXY() { return { x: cx(SLOT + .5), y: base(ML) + FS * .24 }; }
function startCarry() {
  mode = "carry"; const s = slotXY();
  carry = { t0: now, dur: .63, x0: sw.x, y0: sw.y, x1: s.x, y1: s.y - U * .62 }; ev("carry");
}
function snapDone() {
  mode = "done"; snapT = now; bug.mode = "placed"; sfx.click(); ev("snap"); flags = {};
  const s = slotXY(); let rank = 0;
  const kn = []; G.forEach((row, l) => row.forEach((c, k) => { if (c.kn) kn.push({ c, d: Math.hypot(cx(k) - s.x, lineTop(l) - s.y) }); }));
  kn.sort((a, b) => a.d - b.d).forEach(o => { o.c.back = now + .08 + Math.min(.55, rank++ * .022); });
  for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283, v = 150 * S; parts.push({ x: s.x, y: s.y - FS * .3, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t0: now, life: .45, c: BUG, s: 2.2 * S }); }
}
function reset() {
  mode = "hunt"; swats = 0; snapT = -99; caughtT = -9; carry = null; snapA = null; errors = 1; quip = null; flags = {};
  dents.length = 0; parts.length = 0;
  for (const row of G) for (const c of row) Object.assign(c, { x: 0, y: 0, r: 0, vx: 0, vy: 0, vr: 0, tx: 0, ty: 0, tr: 0, kn: false, back: -1 });
  Object.assign(bug, { c: 4.5, l: Math.min(5, N - 1), fo: .86, s: 1, air: 0, mode: "idle", seg: null, spot: null, hs: null, h: 0, wait: 0 });
  ev("reset");
}

    blink: b.blink < 0, bob: Math.sin(now * (run ? 24 : 4)) * .025, mouth: run ? "o" : "smile", squash: !moving && b.mode !== "hide" ? Math.max(0, .12 * Math.sin(now * 9)) : 0 });
}
function star(x, y, r) {
  ctx.fillStyle = "#ffe08a"; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr2 = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fill();
}
function drawQuip() {
  if (!quip || now < quip.t0 || now > quip.t0 + quip.life) return;
  const k = now - quip.t0, a = k > quip.life - .15 ? (quip.life - k) / .15 : 1, pop = outBack(k / .16);
  let x, y;
  if (bug.mode === "caught" || bug.mode === "carried") { x = sw.x; y = sw.y - U * .95; }
  else { const c = bugCenter(); x = c.x; y = c.y - U * bug.s * .62; }
  ctx.font = `700 ${12.5 * S}px ${F.mono}`; const tw = ctx.measureText(quip.text).width + 16 * S, th = 24 * S;
  x = clamp(x + 14 * S, tw / 2 + 6 * S, W - tw / 2 - 6 * S); y = Math.max(y - th, TABH + 4 * S);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y + th); ctx.scale(pop, pop); ctx.translate(-x, -(y + th));
  rr(x - tw / 2, y, tw, th, 8 * S); ctx.fillStyle = "#f4f1e8"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 10 * S, y + th - 1); ctx.lineTo(x - 16 * S, y + th + 7 * S); ctx.lineTo(x - 2 * S, y + th - 1); ctx.fill();
  ctx.fillStyle = "#16161e"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(quip.text, x, y + th / 2 + .5 * S);
  ctx.restore();
}
function drawPanel() {
  const y0 = CODEB, ok = mode === "done", term = flags.termT !== undefined, succ = flags.succT !== undefined;
  ctx.fillStyle = C.bar; ctx.fillRect(0, y0, W, PANH);
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, y0 + .5); ctx.lineTo(W, y0 + .5); ctx.stroke();
  const px = 16 * S, hy = y0 + 17 * S;
  ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = `700 ${10.5 * S}px ${F.ui}`;
  const tabs = [["PROBLEMS", !term], ["TERMINAL", term]]; let tx = px;
  for (const [name, on] of tabs) {
    ctx.fillStyle = on ? "#c0caf5" : C.dim; ctx.fillText(name, tx, hy); const w = ctx.measureText(name).width;
    if (name === "PROBLEMS") { const c = String(errors); rr(tx + w + 6 * S, hy - 7 * S, 16 * S, 14 * S, 7 * S); ctx.fillStyle = errors ? C.err : "#2a2c40"; ctx.fill();
      ctx.fillStyle = errors ? "#16161e" : C.dim; ctx.font = `700 ${9 * S}px ${F.mono}`; ctx.textAlign = "center"; ctx.fillText(c, tx + w + 14 * S, hy + .5 * S); ctx.textAlign = "left"; ctx.font = `700 ${10.5 * S}px ${F.ui}`; }
    if (on) { ctx.fillStyle = "#c0caf5"; ctx.fillRect(tx, hy + 10 * S, w, 1.5 * S); }
    tx += w + 38 * S;
  }
  const r1 = y0 + 44 * S, r2 = y0 + 70 * S;
  if (!term) {
    ctx.font = `700 ${15 * S}px ${F.ui}`; ctx.fillStyle = C.err; ctx.fillText("✕", px, r1);
    ctx.fillStyle = "#e6e8f5"; ctx.font = `500 ${15 * S}px ${F.ui}`; ctx.fillText(CONFIG.error, px + 20 * S, r1);
    ctx.textAlign = "right"; ctx.fillStyle = C.dim; ctx.font = `400 ${11 * S}px ${F.mono}`; ctx.fillText(`${CONFIG.file} ${ML + 1}:${SLOT + 1}`, W - px, r1 + 1 * S);
    ctx.textAlign = "left"; ctx.fillStyle = C.dim; ctx.font = `400 ${11.5 * S}px ${F.mono}`;
    ctx.fillText(CONFIG.auto || swats ? `build failed · ${swats} swat${swats === 1 ? "" : "s"}` : CONFIG.hint, px + 20 * S, r2);
  } else {
    const k = now - flags.termT, cmd = "$ " + CONFIG.build, n = Math.floor(clamp(k / .32, 0, 1) * cmd.length);
    ctx.font = `400 ${12.5 * S}px ${F.mono}`; ctx.fillStyle = "#c0caf5"; ctx.fillText(cmd.slice(0, n), px, r1 - 4 * S);
    if (!succ) { if (k > .35) { ctx.fillStyle = C.dim; ctx.fillText("⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"[Math.floor(now * 14) % 10] + " building...", px, r2 - 2 * S); } }
    else {
      const sk = now - flags.succT, pop = outBack(sk / .3);
      if (sk < .5) { ctx.fillStyle = `rgba(158,206,106,${.18 * (1 - sk / .5)})`; ctx.fillRect(0, y0 + 30 * S, W, PANH - 30 * S - STH); }
      ctx.save(); ctx.translate(px, r2); ctx.scale(pop, pop);
      ctx.font = `700 ${21 * S}px ${F.ui}`; ctx.fillStyle = C.ok; ctx.fillText(CONFIG.success + " ✓", 0, 0); ctx.restore();
      ctx.textAlign = "right"; ctx.fillStyle = C.dim; ctx.font = `400 ${11 * S}px ${F.mono}`; ctx.fillText("0 errors · 0.41s", W - px, r2 + 1 * S); ctx.textAlign = "left";
    }
  }
  // status bar
  const sy = y0 + PANH - STH; ctx.fillStyle = ok && errors === 0 ? "#1e3a2a" : "#3b1d27"; ctx.fillRect(0, sy, W, STH);
  ctx.font = `500 ${11 * S}px ${F.mono}`; ctx.fillStyle = errors ? "#ffb3c0" : "#b9f28a"; ctx.textAlign = "left";
  ctx.fillText(errors ? `✕ ${errors}  ⚠ 0` : "✓ 0  ⚠ 0", px, sy + STH / 2 + .5 * S);
  ctx.textAlign = "right"; ctx.fillStyle = "rgba(230,232,245,.7)"; ctx.fillText(`Ln ${ML + 1}, Col ${SLOT + 1}  JavaScript`, W - px, sy + STH / 2 + .5 * S);
}

// ---------- one loop for everything ----------
function frame(t) {
  now = t / 1000; const dt = Math.min(.05, last ? now - last : 1 / 60); last = now;
  if (CONFIG.auto) runAuto();
  think();
  if (sw.pend && now >= sw.pend.t) { const p = sw.pend; sw.pend = null; impact(p.x, p.y); }
  if (mode === "caught" && now - caughtT > .25) startCarry();
  if (mode === "carry") {
    const u = clamp((now - carry.t0) / carry.dur, 0, 1), e = sm(u);
    sw.x = lerp(carry.x0, carry.x1, e); sw.y = lerp(carry.y0, carry.y1, e) - Math.sin(u * Math.PI) * LH * 1.6;
    bug.mode = "carried";
    if (u >= 1) { mode = "snap"; bug.mode = "snap"; snapA = { t0: now, dur: .1, x: sw.x, y: sw.y + U * .35 }; }
  }
  if (mode === "snap" && now - snapA.t0 >= snapA.dur) snapDone();
  if (mode === "done") {
    const k = now - snapT;
    if (flags.fixedT === undefined && k > .3) { flags.fixedT = now; errors = 0; ev("fixed"); }
    if (flags.termT === undefined && k > .4) flags.termT = now;
    if (flags.succT === undefined && k > 1.035) { flags.succT = now; sfx.ding(); ev("success"); }
    if (flags.winkT === undefined && k > 2.07) { flags.winkT = now; sfx.wink(); ev("wink"); }
  }
  updateBug(dt);
  // letters: springs
  for (const row of G) for (const c of row) {
    if (c.back > 0 && now >= c.back) { c.back = -1; c.kn = false; c.tx = c.ty = c.tr = 0; c.vy -= 120 * S; }
    if (!c.kn && Math.abs(c.x) + Math.abs(c.y) + Math.abs(c.r) + Math.abs(c.vx) + Math.abs(c.vy) < .02) { c.x = c.y = c.r = 0; continue; }
    const k = c.kn ? 260 : 170, d = c.kn ? 14 : 9;
    c.vx += (k * (c.tx - c.x) - d * c.vx) * dt; c.vy += (k * (c.ty - c.y) - d * c.vy) * dt; c.vr += (k * (c.tr - c.r) - d * c.vr) * dt;
    c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt;
  }

  // draw
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sk = now - shakeT, shake = sk < .16 ? (1 - sk / .16) * 4 * S : 0;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(Math.sin(now * 90) * shake, Math.cos(now * 70) * shake);
  drawCode();
  for (const d of dents) drawDent(d);
  if (!(bug.hs && bug.hs.kind === "string" && bug.mode !== "move") && bug.mode !== "caught" && bug.mode !== "carried" && bug.mode !== "snap") drawBug();
  ctx.restore();
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i], k = (now - p.t0) / p.life; if (k >= 1) { parts.splice(i, 1); continue; }
    p.vy += 500 * S * dt; p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = 1 - k; ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
  drawPanel(); drawTabs();
  drawSwatter();
  if (bug.mode === "caught" || bug.mode === "carried" || bug.mode === "snap") drawBug();
  drawQuip();
  requestAnimationFrame(frame);
}
resize(); reset();
if (!CONFIG.auto) { sw.x = W * .84; sw.y = CODEB - 30 * S; sw.seen = true; }
document.fonts && document.fonts.ready.then(resize);
requestAnimationFrame(frame);
</script>
