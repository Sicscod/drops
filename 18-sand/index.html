<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sand</title>
<meta name="description" content="A falling-sand simulation: drag to pour glowing coloured sand that piles into striped dunes. Tap to switch to water or sparks. Free code by @sicscod.drops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
html,body{height:100%;margin:0;background:#0a090b;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.mono{font:400 10.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
.top{position:fixed;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:baseline;pointer-events:none;color:#8a8279}
.top h1{margin:0;font:italic 400 24px/1 Fraunces,Georgia,serif;letter-spacing:-.01em;color:#f2ebe1}
.top h1 small{font:400 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;color:#6f6861;margin-left:8px;vertical-align:3px}
.bar{position:fixed;top:calc(max(16px,env(safe-area-inset-top)) + 40px);left:0;right:0;display:flex;justify-content:center;gap:8px;pointer-events:none}
.seg{position:relative;display:flex;padding:3px;border-radius:99px;background:rgba(18,16,19,.78);box-shadow:inset 0 0 0 1px rgba(255,240,225,.08);pointer-events:auto}
.seg button,.tilt{position:relative;z-index:1;border:0;background:none;color:#8d857c;padding:8px 13px 8px 12px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:7px}
.seg button.on{color:#f6efe6}
.seg i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;display:block}
.seg button.on i{opacity:1}
.thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:99px;background:rgba(255,244,232,.09);box-shadow:inset 0 0 0 1px rgba(255,244,232,.1)}
.tilt{background:rgba(18,16,19,.78);box-shadow:inset 0 0 0 1px rgba(255,240,225,.08);pointer-events:auto;padding:8px 13px}
.tilt svg{display:block}
.hint{position:fixed;left:0;right:0;top:44%;text-align:center;color:#b3aa9f;pointer-events:none;font-size:11px;letter-spacing:.24em}
.hint em{display:block;font:italic 400 30px/1.1 Fraunces,Georgia,serif;letter-spacing:-.01em;text-transform:none;color:#efe6da;margin-bottom:12px}
.credit{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));text-align:center;font:400 10px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:#5d5650}
.credit a{color:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>Sand<small>/ 18</small></h1><span class="mono" id="read">0 grains</span></div>
<div class="bar">
  <div class="seg mono" id="seg"><div class="thumb" id="thumb"></div>
    <button data-m="1" class="on"><i></i>sand</button><button data-m="2"><i></i>water</button><button data-m="3"><i></i>spark</button>
  </div>
  <button class="tilt mono" id="tilt" aria-label="tilt to clear"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.2 1.6v2.9H9.3"/></svg></button>
</div>
<div class="hint mono" id="hint"><em>pour something</em>drag · tap to switch · double-tap to tilt</div>
<div class="credit">free code by <a href="https://www.instagram.com/sicscod.drops/" target="_blank" rel="noopener">@sicscod.drops</a></div>
<script>
// ===== Sand · free code by @sicscod.drops =====
// Change it from the link: yoursite/?hue=200&speed=1.5&grain=4
const url = new URLSearchParams(location.search);
const CONFIG = {
  hue: +(url.get("hue") ?? 28),        // start colour, 0..360 (28 amber, 200 sky, 330 rose)
  cycle: -16,                         // how fast the colour drifts while you pour (deg / s, minus = amber → rose → violet)
  bands: 1.6,                         // seconds per light/dark stripe while pouring (0 = no stripes)
  speed: +(url.get("speed") || 1),    // simulation speed (0.5 slow-mo .. 2 fast)
  grain: Math.max(2, Math.min(10, +(url.get("grain") || 3))), // grain size in CSS px (bigger = chunkier + faster)
  brush: 5,                           // pour radius in grains
  flow: { sand: .5, water: .5, spark: .09 }, // how much comes out per tick
  glow: .55,                          // bloom strength (0 = flat)
  floor: 30                           // space under the pile for the credit line (px)
};

const SAND = 1, WATER = 2, SPARK = 3, NAMES = ["", "sand", "water", "spark"];
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const small = document.createElement("canvas"), sctx = small.getContext("2d");
const b1 = document.createElement("canvas"), b1x = b1.getContext("2d");
const b2 = document.createElement("canvas"), b2x = b2.getContext("2d");
const readEl = document.getElementById("read"), hintEl = document.getElementById("hint");
const seg = document.getElementById("seg"), thumb = document.getElementById("thumb"), btns = [...seg.querySelectorAll("button")];

let W, H, dpr, G, gw, gh, ox, oy, type, col, vel, aux, mark, img, buf, depth;
function resize() {
  W = innerWidth; H = innerHeight; dpr = Math.min(2, Math.round(devicePixelRatio || 1)); G = CONFIG.grain;
  cv.width = W * dpr; cv.height = H * dpr;
  const nw = Math.floor(W / G), nh = Math.floor((H - CONFIG.floor) / G);
  const oT = type, oC = col, ow = gw, oh = gh;
  gw = nw; gh = nh; ox = Math.floor((W - gw * G) / 2); oy = H - CONFIG.floor - gh * G;
  type = new Uint8Array(gw * gh); col = new Uint32Array(gw * gh); vel = new Float32Array(gw * gh);
  aux = new Int8Array(gw * gh); mark = new Uint8Array(gw * gh); depth = new Uint16Array(gw);
  if (oT) for (let y = 0; y < Math.min(oh, gh); y++) for (let x = 0; x < Math.min(ow, gw); x++) {   // keep the pile, bottom-aligned
    const a = (oh - 1 - y) * ow + x, b = (gh - 1 - y) * gw + x; type[b] = oT[a]; col[b] = oC[a];
  }
  small.width = gw; small.height = gh; img = sctx.createImageData(gw, gh); buf = new Uint32Array(img.data.buffer);
  b1.width = Math.ceil(gw / 2); b1.height = Math.ceil(gh / 2); b2.width = Math.ceil(gw / 4); b2.height = Math.ceil(gh / 4);
}

/* ---------- colour ---------- */
function hsl(h, s, l) {             // -> packed ABGR
  h = ((h % 360) + 360) % 360 / 60;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(h % 2 - 1)), m = l - c / 2;
  const [r, g, b] = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x] : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x];
  return (255 << 24) | (Math.round((b + m) * 255) << 16) | (Math.round((g + m) * 255) << 8) | Math.round((r + m) * 255);
}
let hue = CONFIG.hue, pourT = 0;
function grainColor(m) {
  const r = Math.random();
  const band = CONFIG.bands ? .07 * Math.sin(pourT / CONFIG.bands * 6.283) : 0;
  if (m === SAND) return hsl(hue + (r - .5) * 9, .56, .55 + band + (Math.random() - .5) * .12 + (r > .965 ? .16 : 0));
  if (m === WATER) return hsl(200 + (r - .5) * 12, .7, .5 + r * .06) & 0x00ffffff | (150 << 24);
  return 0;
}

/* ---------- simulation ---------- */
let stamp = 1;
function swap(a, b) {
  let t = type[a]; type[a] = type[b]; type[b] = t;
  t = col[a]; col[a] = col[b]; col[b] = t;
  const v = vel[a]; vel[a] = vel[b]; vel[b] = v;
  const x = aux[a]; aux[a] = aux[b]; aux[b] = x;
  mark[b] = stamp;
}
function fall(i, y, into) {         // falls up to |vel| cells, returns new index or -1
  let v = Math.min(7, vel[i] + .32), n = Math.max(1, v | 0), ci = i, cy = y;
  while (n-- > 0 && cy + 1 < gh) {
    const t = type[ci + gw];
    if (t === 0 || (t === into && Math.random() < .55)) { ci += gw; cy++; if (t) { n = 0; v = 1; } } else break;
  }
  if (ci === i) return -1;
  vel[i] = v; swap(i, ci); return ci;
}
function step() {
  stamp = stamp % 255 + 1;
  for (let y = gh - 1; y >= 0; y--) {
    const ltr = Math.random() < .5, row = y * gw;
    for (let k = 0; k < gw; k++) {
      const x = ltr ? k : gw - 1 - k, i = row + x, t = type[i];
      if (!t || mark[i] === stamp) continue;
      if (t === SAND) {
        if (fall(i, y, WATER) >= 0) continue;
        vel[i] = 1;
        if (y + 1 >= gh || Math.random() < .08) continue;          // a little friction makes nicer slopes
        const d = Math.random() < .5 ? -1 : 1;
        for (const s of [d, -d]) {
          const nx = x + s; if (nx < 0 || nx >= gw) continue;
          const j = i + gw + s, tj = type[j];
          if (tj === 0 || tj === WATER) { swap(i, j); break; }
        }
      } else if (t === WATER) {
        if (fall(i, y, 0) >= 0) continue;
        vel[i] = 1;
        let d = aux[i] || (Math.random() < .5 ? -1 : 1); aux[i] = d;
        if (y + 1 < gh) {
          const a = x + d, b = x - d;
          if (a >= 0 && a < gw && !type[i + gw + d]) { swap(i, i + gw + d); continue; }
          if (b >= 0 && b < gw && !type[i + gw - d]) { aux[i] = -d; swap(i, i + gw - d); continue; }
        }
        let j = i, x2 = x;                                           // flow sideways
        for (let s = 0; s < 5; s++) {
          const nx = x2 + d; if (nx < 0 || nx >= gw || type[row + nx]) break;
          x2 = nx; j = row + nx;
          if (y + 1 < gh && !type[j + gw]) break;
        }
        if (j !== i) swap(i, j); else aux[i] = -d;
      } else {                                                        // spark: jitters upward and fizzles
        if (--vel[i] <= 0) { type[i] = 0; continue; }
        const r = Math.random(), dy = r < .62 ? -1 : r < .82 ? 0 : 1, dx = (Math.random() * 3 | 0) - 1;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= gw || ny < 0 || ny >= gh) { type[i] = 0; continue; }
        const j = ny * gw + nx, tj = type[j];
        if (tj === 0) swap(i, j);
        else if (tj === WATER) { type[i] = 0; type[j] = 0; }              // hiss
        else if (tj === SAND) vel[i] -= 4;
      }
    }
  }
}

/* ---------- pouring ---------- */
let mat = SAND, ptr = null, pouring = false, lastSpawn = null, poured = 0;
function spawnAt(px, py) {
  const cx = (px - ox) / G, cy = (py - oy) / G, R = CONFIG.brush, f = CONFIG.flow[NAMES[mat]];
  for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++) {
    if (y < 0 || y >= gh) continue;
    for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
      if (x < 0 || x >= gw) continue;
      const dd = ((x - cx) ** 2 + (y - cy) ** 2) / (R * R); if (dd > 1) continue;
      const i = y * gw + x; if (type[i] || Math.random() > f * (1 - dd * .6)) continue;
      type[i] = mat; col[i] = grainColor(mat); aux[i] = 0; poured++;
      vel[i] = mat === SPARK ? 18 + Math.random() * 50 : 1 + Math.random() * 2;
    }
  }
}
function pour() {
  if (!pouring || !ptr) return;
  const a = lastSpawn || ptr, dist = Math.hypot(ptr.x - a.x, ptr.y - a.y), n = Math.max(1, Math.ceil(dist / (CONFIG.brush * G * .8)));
  for (let k = 1; k <= n; k++) spawnAt(a.x + (ptr.x - a.x) * k / n, a.y + (ptr.y - a.y) * k / n);
  lastSpawn = { x: ptr.x, y: ptr.y };
}

/* ---------- input ---------- */
let down = null, pendingTap = null, lastTap = null, touched = false, clearT = -1;
cv.addEventListener("pointerdown", e => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() }; ptr = { x: e.clientX, y: e.clientY }; pouring = false; lastSpawn = null;
});
addEventListener("pointermove", e => {
  if (!down) return; ptr = { x: e.clientX, y: e.clientY };
  if (!pouring && Math.hypot(ptr.x - down.x, ptr.y - down.y) > 7) { pouring = true; touched = true; }
});
addEventListener("pointerup", e => {
  if (!down) return; const now = performance.now();
  if (!pouring && now - down.t < 260) {                               // a tap
    if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 50) { pendingTap = null; lastTap = null; tilt(now); }
    else { pendingTap = { t: now }; lastTap = { t: now, x: e.clientX, y: e.clientY }; }
  }
  down = null; pouring = false; ptr = null;
});
addEventListener("pointercancel", () => { down = null; pouring = false; ptr = null; });
function setMat(m) { mat = m; btns.forEach(b => b.classList.toggle("on", +b.dataset.m === m)); touched = true; }
btns.forEach(b => b.addEventListener("click", () => setMat(+b.dataset.m)));
document.getElementById("tilt").addEventListener("click", () => tilt(performance.now()));
function tilt(now) { if (clearT < 0) clearT = now; touched = true; }

/* ---------- render ---------- */
function paint(now) {
  depth.fill(0);
  const tt = now / 1000; let count = 0;
  for (let y = 0, i = 0; y < gh; y++) for (let x = 0; x < gw; x++, i++) {
    const t = type[i];
    if (!t) { buf[i] = 0; depth[x] = 0; continue; }
    const c = col[i]; let k, al = c >>> 24;
    if (t === SAND) {
      count++; const d = ++depth[x];
      k = d === 1 ? 1.32 : d < 3 ? 1.12 : Math.max(.62, 1.02 - d * .0032);
    } else if (t === WATER) {
      count++; depth[x] = 0;
      const top = y === 0 || !type[i - gw];
      al = top ? 245 : 150;
      k = (top ? 1.5 : .9) + .16 * Math.sin(tt * 3.1 + x * .45 + y * .8) * Math.sin(tt * 1.7 - x * .21);
    } else {
      depth[x] = 0; const l = Math.min(1, vel[i] / 40);
      buf[i] = hsl(hue + 30 - l * 30, .95, .55 + l * .4); continue;
    }
    const r = Math.min(255, (c & 255) * k), g = Math.min(255, (c >> 8 & 255) * k), b = Math.min(255, (c >> 16 & 255) * k);
    buf[i] = (al << 24) | (b << 16) | (g << 8) | r;
  }
  sctx.putImageData(img, 0, 0);
  // background
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  const bg = ctx.createRadialGradient(W * dpr * .5, H * dpr * .15, 0, W * dpr * .5, H * dpr * .45, H * dpr * .9);
  bg.addColorStop(0, "#17141a"); bg.addColorStop(1, "#08070a");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height);
  // tilt to clear: the box rocks and everything slides out of the bottom
  let dy = 0, alpha = 1;
  if (clearT >= 0) {
    const p = Math.min(1, (now - clearT) / 1100);
    const rot = Math.sin(p * Math.PI) * .07 * (1 + .25 * Math.sin(p * 40));
    ctx.translate(W * dpr / 2, H * dpr * .6); ctx.rotate(rot); ctx.translate(-W * dpr / 2, -H * dpr * .6);
    dy = p * p * H * dpr * 1.1; alpha = 1 - p * p;
    if (p >= 1) { type.fill(0); clearT = -1; poured = 0; }
  }
  // floor line
  ctx.fillStyle = "rgba(255,238,220,.10)"; ctx.fillRect(ox * dpr, (oy + gh * G) * dpr, gw * G * dpr, Math.max(1, dpr));
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(small, ox * dpr, oy * dpr + dy, gw * G * dpr, gh * G * dpr);
  if (CONFIG.glow > 0) {              // cheap bloom: downsample twice, add back softly
    b1x.clearRect(0, 0, b1.width, b1.height); b1x.imageSmoothingEnabled = true; b1x.drawImage(small, 0, 0, b1.width, b1.height);
    b2x.clearRect(0, 0, b2.width, b2.height); b2x.imageSmoothingEnabled = true; b2x.drawImage(b1, 0, 0, b2.width, b2.height);
    ctx.imageSmoothingEnabled = true; ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = alpha * CONFIG.glow * .55; ctx.drawImage(b1, (ox - G) * dpr, (oy - G) * dpr + dy, (gw + 2) * G * dpr, (gh + 2) * G * dpr);
    ctx.globalAlpha = alpha * CONFIG.glow * .6; ctx.drawImage(b2, (ox - 3 * G) * dpr, (oy - 3 * G) * dpr + dy, (gw + 6) * G * dpr, (gh + 6) * G * dpr);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  return count;
}

/* ---------- one loop ---------- */
let prev = performance.now(), acc = 0, hintA = 1, thumbX = 0, thumbW = 0, shown = -1;
const t0 = prev;
resize(); addEventListener("resize", resize);
function frame(now) {
  const dt = Math.min(100, now - prev); prev = now;
  if (pendingTap && now - pendingTap.t > 300) { pendingTap = null; setMat(mat % 3 + 1); }
  if (down && !pouring && now - down.t > 160) { pouring = true; touched = true; }      // press and hold also pours
  if (pouring) { hue += CONFIG.cycle * dt / 1000; pourT += dt / 1000; }
  acc += dt * CONFIG.speed; let n = 0; const STEP = 1000 / 90;
  while (acc >= STEP && n < 6) { pour(); step(); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  const count = paint(now);
  if (count !== shown) { shown = count; readEl.textContent = count.toLocaleString("en-US") + " grains"; }
  // segmented control thumb + live colour dots
  const on = btns[mat - 1], tx = on.offsetLeft - 3, tw = on.offsetWidth, a = Math.min(1, dt / 90);
  thumbX += (tx - thumbX) * (thumbW ? a : 1); thumbW += (tw - thumbW) * (thumbW ? a : 1);
  thumb.style.transform = `translateX(${thumbX.toFixed(2)}px)`; thumb.style.width = thumbW.toFixed(2) + "px";
  btns[0].firstChild.style.background = `hsl(${(hue % 360 + 360) % 360},62%,60%)`;
  btns[1].firstChild.style.background = `hsl(200,70%,58%)`;
  btns[2].firstChild.style.background = `hsl(${((hue + 30) % 360 + 360) % 360},95%,72%)`;
  hintA += ((touched ? 0 : 1) - hintA) * Math.min(1, dt / 260);
  hintEl.style.opacity = (Math.min(1, (now - t0) / 600) * hintA).toFixed(3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
