<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Dragon</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== Neon Dragon · free code by @sicscod.drops =====
// It follows your finger / cursor. Idle = flies on its own.
const SEGMENTS = 110, GAP = 3.2;        // body length
const HEAD = [255, 215, 90], TAIL = [255, 40, 60];   // gold -> red

const c = document.getElementById("c"), g = c.getContext("2d");
let W, H, D, U, spine = [], sparks = [], pointer = null, lastMove = -1e9;
function resize(){ D = devicePixelRatio; W = c.width = innerWidth*D; H = c.height = innerHeight*D; U = Math.min(W, H)/400; }
resize(); addEventListener("resize", resize);
for (let i = 0; i < SEGMENTS; i++) spine.push({ x: W/2, y: H/2 + i*GAP*U });
addEventListener("pointermove", e => { pointer = [e.clientX*D, e.clientY*D]; lastMove = performance.now(); });
addEventListener("pointerdown", e => { pointer = [e.clientX*D, e.clientY*D]; lastMove = performance.now(); });

const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i]-v)*k));
const rgba = (col, a) => `rgba(${col},${a})`;

function target(T){
  if (pointer && performance.now() - lastMove < 2500) return pointer;
  const s = Math.min(W, H);
  return [W/2 + Math.sin(T*.9)*s*.30 + Math.sin(T*2.1)*s*.07,
          H/2 + Math.sin(T*1.3)*s*.24 + Math.cos(T*.7)*s*.07];
}

function step(T){
  const [tx, ty] = target(T), h = spine[0];
  h.x += (tx - h.x)*.09; h.y += (ty - h.y)*.09;           // head chases target
  for (let i = 1; i < SEGMENTS; i++){                      // body follows head
    const a = spine[i-1], b = spine[i];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    b.x = a.x + Math.cos(ang)*GAP*U; b.y = a.y + Math.sin(ang)*GAP*U;
  }
}

function width(i){ const k = i/SEGMENTS; return U*(13*Math.pow(1-k, .9)*(k < .06 ? .6 + k*6.6 : 1) + 1.2); }
function normal(i){
  const a = spine[Math.max(0, i-1)], b = spine[Math.min(SEGMENTS-1, i+1)];
  const ang = Math.atan2(b.y - a.y, b.x - a.x); return [Math.cos(ang + Math.PI/2), Math.sin(ang + Math.PI/2), ang];
}

function draw(time){
  const T = time/1000; step(T);
  g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "lighter"; g.lineCap = "round";

  // ribs + back spikes
  for (let i = 2; i < SEGMENTS; i += 2){
    const p = spine[i], [nx, ny] = normal(i), w = width(i), col = mix(HEAD, TAIL, i/SEGMENTS);
    const wave = Math.sin(T*6 - i*.35)*.25;
    g.strokeStyle = rgba(col, .75); g.lineWidth = 1.6*D;
    g.beginPath(); g.moveTo(p.x - nx*w, p.y - ny*w);
    g.quadraticCurveTo(p.x + nx*w*wave, p.y + ny*w*wave, p.x + nx*w, p.y + ny*w); g.stroke();
    if (i % 4 === 0){
      const q = spine[i+2] || p;
      g.strokeStyle = rgba(col, .9); g.lineWidth = 1.2*D;
      g.beginPath(); g.moveTo(p.x - nx*w, p.y - ny*w);
      g.lineTo((p.x+q.x)/2 - nx*w*1.9, (p.y+q.y)/2 - ny*w*1.9); g.lineTo(q.x - nx*width(i+2), q.y - ny*width(i+2)); g.stroke();
    }
  }
  // spine glow
  for (const [lw, a] of [[9, .08], [4, .25], [1.6, .9]]){
    g.strokeStyle = rgba(HEAD, a); g.lineWidth = lw*D; g.beginPath();
    spine.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.stroke();
  }
  // legs with claws
  for (const [i, side] of [[18, 1], [18, -1], [48, 1], [48, -1]]){
    const p = spine[i], [nx, ny, ang] = normal(i), w = width(i), col = mix(HEAD, TAIL, i/SEGMENTS);
    const swing = Math.sin(T*5 + i + side)*.5;
    const kx = p.x + nx*side*w*2.2 + Math.cos(ang)*w*swing*2, ky = p.y + ny*side*w*2.2 + Math.sin(ang)*w*swing*2;
    const fx = kx + nx*side*w*1.2 - Math.cos(ang)*w*1.2, fy = ky + ny*side*w*1.2 - Math.sin(ang)*w*1.2;
    g.strokeStyle = rgba(col, .9); g.lineWidth = 2*D;
    g.beginPath(); g.moveTo(p.x + nx*side*w*.8, p.y + ny*side*w*.8); g.lineTo(kx, ky); g.lineTo(fx, fy); g.stroke();
    for (let k = -1; k <= 1; k++){
      const ca = ang + Math.PI + k*.5 + side*.3;
      g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + Math.cos(ca)*w*.8, fy + Math.sin(ca)*w*.8); g.stroke();
    }
  }
  // head
  const h = spine[0], [nx, ny, ang] = normal(1), fx = -Math.cos(ang), fy = -Math.sin(ang), hw = width(6)*1.3;
  const tip = [h.x + fx*hw*2.2, h.y + fy*hw*2.2];
  g.strokeStyle = rgba(HEAD, 1); g.lineWidth = 2*D; g.beginPath();
  g.moveTo(h.x + nx*hw, h.y + ny*hw); g.lineTo(tip[0] + nx*hw*.35, tip[1] + ny*hw*.35);
  g.lineTo(tip[0] - nx*hw*.35, tip[1] - ny*hw*.35); g.lineTo(h.x - nx*hw, h.y - ny*hw); g.stroke();
  for (const s of [1, -1]){
    // horns
    g.beginPath(); g.moveTo(h.x + nx*s*hw*.6, h.y + ny*s*hw*.6);
    g.quadraticCurveTo(h.x - fx*hw*1.6 + nx*s*hw*1.6, h.y - fy*hw*1.6 + ny*s*hw*1.6, h.x - fx*hw*2.6 + nx*s*hw*1.1, h.y - fy*hw*2.6 + ny*s*hw*1.1); g.stroke();
    // eyes
    const ex = h.x + fx*hw*.9 + nx*s*hw*.55, ey = h.y + fy*hw*.9 + ny*s*hw*.55;
    g.fillStyle = "rgba(120,255,240,1)"; g.beginPath(); g.arc(ex, ey, 2.4*D, 0, 7); g.fill();
    g.fillStyle = "rgba(120,255,240,.25)"; g.beginPath(); g.arc(ex, ey, 7*D, 0, 7); g.fill();
    // whiskers
    g.strokeStyle = rgba(HEAD, .7); g.lineWidth = 1.2*D; g.beginPath();
    const wx = tip[0] + nx*s*hw*.3, wy = tip[1] + ny*s*hw*.3; g.moveTo(wx, wy);
    const wv = Math.sin(T*4 + s)*hw*1.5;
    g.bezierCurveTo(wx + nx*s*hw*2 - fx*hw*1 + nx*wv, wy + ny*s*hw*2 - fy*hw + ny*wv,
                    wx + nx*s*hw*1.5 - fx*hw*4, wy + ny*s*hw*1.5 - fy*hw*4,
                    wx + nx*s*hw*3 - fx*hw*6 + nx*wv, wy + ny*s*hw*3 - fy*hw*6 + ny*wv); g.stroke();
  }
  // sparks from the mouth
  for (let k = 0; k < 3; k++) sparks.push({ x: tip[0], y: tip[1], vx: fx*(2+Math.random()*4)*D + (Math.random()-.5)*2*D,
    vy: fy*(2+Math.random()*4)*D + (Math.random()-.5)*2*D, life: 1 });
  sparks = sparks.filter(s => (s.life -= .025) > 0);
  for (const s of sparks){ s.x += s.vx; s.y += s.vy; s.vx *= .97; s.vy *= .97;
    g.fillStyle = rgba(mix(TAIL, HEAD, s.life), s.life); g.fillRect(s.x, s.y, 2*D, 2*D); }

  g.globalCompositeOperation = "source-over";
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
